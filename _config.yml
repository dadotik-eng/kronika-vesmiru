title: Hvězdná kronika
description: Česká kronika dějin vesmíru Star Citizen – vyprávěná z ověřených pramenů.
lang: cs
url: "https://dadotik-eng.github.io"
baseurl: "/kronika-vesmiru"
permalink: pretty
markdown: kramdown
kramdown:
  smart_quotes: ["sbquo", "lsquo", "bdquo", "ldquo"]

collections:
  kapitoly:
    output: true
    permalink: /kapitoly/:name/
  osoby:
    output: true
    permalink: /osobnosti/:name/
  encyklopedie:
    output: true
    permalink: /encyklopedie/:name/
  rasy:
    output: true
    permalink: /rasy/:name/
  udalosti:
    output: false
  zasobnik:
    output: false

defaults:
  - scope:
      path: ""
      type: kapitoly
    values:
      layout: kapitola
  - scope:
      path: ""
      type: osoby
    values:
      layout: osoba
  - scope:
      path: ""
      type: encyklopedie
    values:
      layout: heslo
  - scope:
      path: ""
      type: rasy
    values:
      layout: rasa

exclude:
  - README.md
  - SABLONA-KAPITOLY.md
  - ZASOBNIK.md
  - SABLONY.md
  - DABING.md
  - nastroje

# Sociální sítě – vyplň odkaz, jakmile kanál založíš; prázdné = v patičce se neukáže
socialni_site:
  discord: ""
  facebook: ""
  youtube: ""

# Cloudflare Web Analytics (veřejný token měřicího skriptu, není tajný)
statistiky_token: "f77cd50715d74860859487018bcfb7ac"
