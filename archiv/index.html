<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hvězdná kronika</title>
<meta name="description" content="Dějiny, firmy, svátky a příběhy univerza Star Citizen – neoficiální česká kronika s vyprávěním.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Saira+Condensed:wght@400;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Kyanotypová kinosála: prolog jako film, po přechodu hvězdná mapa s planetami-kategoriemi. V dramatizaci se jantar mění na poplachovou červeň. */
:root{color-scheme:dark;--night:#081a33;--sheet:#12355f;--line:rgba(222,236,246,.28);--text:#f0f5f7;--muted:#bcd0dd;--accent:#f6bd4b;
 --display:"Cinzel","Times New Roman",serif;--body:"Spectral",Georgia,serif;--label:"Saira Condensed","Arial Narrow",sans-serif}
body[data-mood="letka"]{--accent:#ff7a5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--night);color:var(--text);font:400 19px/1.5 var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;transition:opacity .32s}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
.lab{font:600 15px/1.3 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px clamp(16px,6vw,84px);font:600 16px/1 var(--label);letter-spacing:.12em;text-transform:uppercase}
.top nav{display:flex;gap:clamp(12px,2.2vw,28px);flex-wrap:wrap}
.top button{padding:6px 0;border-bottom:2px solid transparent;letter-spacing:inherit;text-transform:inherit}
.top button:hover{color:var(--accent)}
.top button[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
.brand{color:var(--muted)}
.top{position:relative}.topmute{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;font-size:18px;line-height:1;display:grid;place-items:center;margin-left:14px;cursor:pointer}.topmute:hover{border-color:var(--accent)}.topmute.ztlumeno{border-color:#ff7a5c}
.top a{color:inherit;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent;letter-spacing:inherit}.top a:hover{color:#fff}.top a,#tabs button{white-space:nowrap}
.stage{position:relative;min-height:0;display:flex;align-items:center;padding:0 clamp(20px,6vw,84px)}
.stage.scroll{display:block;overflow:auto;padding-top:8px;padding-bottom:40px}
.col{width:min(600px,46vw);position:relative}
.scroll .col{width:auto;max-width:1120px;margin:0 auto}
#year{font:700 clamp(58px,8vw,112px)/1 var(--display);color:transparent;-webkit-text-stroke:1px var(--muted);margin:0 0 14px;font-variant-numeric:tabular-nums;min-height:1em}
#prev{color:var(--muted);opacity:.72;font-size:18px;margin:0 0 16px;min-height:1.5em}
#hud{font:600 14px/1.3 var(--label);letter-spacing:.2em;text-transform:uppercase;color:#bfe3f5;margin:0 0 18px;display:flex;align-items:center;gap:12px;min-height:1.3em;opacity:0;transform:translateY(-4px);transition:opacity .5s,transform .5s}
#hud.on{opacity:.9;transform:none}
.app{grid-template-columns:minmax(0,1fr)}.stage{min-width:0}#col{min-width:0;max-width:100%;overflow-wrap:break-word}
#hud.on::before{content:"";width:28px;height:1px;background:#bfe3f5;opacity:.6}
#who{min-height:1.3em;margin-bottom:6px}
#line{font:400 clamp(25px,2.65vw,36px)/1.32 var(--body);margin:0;text-wrap:pretty}
body.radio #line{font:600 clamp(26px,2.8vw,38px)/1.24 var(--label);letter-spacing:.02em}
#note{color:var(--muted);font-size:16px;margin:18px 0 0}
.find{margin-top:20px;border:1px solid var(--accent);color:var(--accent);padding:9px 14px;font:600 17px/1.1 var(--label);letter-spacing:.05em;animation:p 2.2s ease-in-out 3}
.find:hover{background:var(--accent);color:var(--night)}
@keyframes p{50%{box-shadow:0 0 0 7px rgba(246,189,75,.2)}}
h1{font:500 clamp(46px,6.2vw,80px)/1.08 var(--display);margin:.15em 0 .25em;text-wrap:balance}
h2{font:500 clamp(32px,3.8vw,48px)/1.14 var(--display);margin:.2em 0 .3em;text-wrap:balance}
.lead{font-size:clamp(20px,1.9vw,24px);max-width:30em;margin:0 0 26px}
.small{color:var(--muted);font-size:16.5px;max-width:34em;margin:20px 0 0}
.main{background:var(--accent);color:var(--night);font:600 21px/1 var(--label);letter-spacing:.06em;padding:16px 24px}
.main:hover{filter:brightness(1.08)}
.alt{border:1px solid var(--line);font:600 19px/1 var(--label);letter-spacing:.05em;padding:15px 20px}
.alt:hover{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.hero{display:block;width:100%;max-width:520px;border:1px solid var(--accent);padding:20px 22px;background:rgba(8,26,51,.6);margin-bottom:14px}
.hero:hover{background:rgba(246,189,75,.12)}
.hero b{display:block;font:500 clamp(30px,3vw,38px)/1.15 var(--display);margin:4px 0}
.hero span:last-child{color:var(--muted);font-size:18px}
#nodes .node{position:fixed;transform:translate(-50%,-9px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;width:170px;font-family:var(--label)}
.node i{width:18px;height:18px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 6px rgba(222,236,246,.12);transition:background .15s,box-shadow .15s}
.node b{font-weight:600;font-size:20px;letter-spacing:.03em;line-height:1.1}
.node span{color:var(--muted);font-size:16px;line-height:1.1}
.node:hover i,.node:focus-visible i{background:var(--accent);box-shadow:0 0 0 9px rgba(246,189,75,.24)}
.node:hover b{color:var(--accent)}
.rise{animation:r .55s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--d,0)*90ms)}
@keyframes r{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
.toc{list-style:none;margin:6px 0 0;padding:0}
.toc button{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:baseline;width:100%;padding:14px 4px;border-bottom:1px solid var(--line)}
.toc button:hover .t{color:var(--accent)}
.toc .i{font:600 18px/1 var(--label);color:var(--accent)}
.toc .t{font:500 22px/1.2 var(--display)}
.toc small{display:block;font:400 16px/1.2 var(--body);color:var(--muted);margin-top:3px}
.toc .y{font:400 17px/1 var(--label);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:10px}
.item{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);padding:18px 20px;background:rgba(8,26,51,.72);min-height:172px}
.item:hover{border-color:var(--accent)}
.item.play{border-color:var(--accent)}
.item b{font:500 23px/1.2 var(--display)}
.item span.tag{font:600 15px/1.2 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.item.soon span.tag{color:var(--muted)}
.item span.bl{color:var(--muted);font-size:17px;line-height:1.38}
.ctl{display:flex;align-items:center;gap:14px;padding:12px clamp(16px,6vw,84px);border-top:1px solid var(--line);background:rgba(8,26,51,.82);font:400 17px/1.2 var(--label)}
.ctl button{text-align:center}
.ctl .b{width:42px;height:42px;display:grid;place-items:center;font-size:15px;border:1px solid var(--line);border-radius:50%;flex:none}
.ctl .b:hover{border-color:var(--accent);color:var(--accent)}
#pp{width:52px;height:52px;background:var(--accent);color:var(--night);border:0;font-size:18px}
#pp:hover{color:var(--night);filter:brightness(1.08)}
#st{flex:1;min-width:0;color:var(--muted)}
#st b{display:block;color:var(--text);font-weight:600;font-size:18px}
.tg{border:1px solid var(--line);padding:9px 12px;letter-spacing:.04em;flex:none}
.vol{display:flex;align-items:center;gap:6px;flex:none}.vol .vb{width:38px;height:38px;font-size:17px;line-height:1}
#vol{width:110px;accent-color:var(--accent);cursor:pointer}
.tg:hover{border-color:var(--accent)}.tg[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
#auto[aria-pressed="false"]{text-decoration:none}
#auto[aria-pressed="true"]{background:var(--accent);color:var(--night);border-color:var(--accent);font-weight:600}
.tg[disabled]{opacity:.55;text-decoration:none;cursor:not-allowed}
#skip{border-color:var(--accent);color:var(--accent);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(3,10,22,.68);display:grid;place-items:center;padding:16px;z-index:9}
.card{background:var(--sheet);border:1px solid var(--accent);padding:30px 32px;width:min(560px,100%);max-height:90%;overflow:auto}
.card h2{font-size:34px}.card p:not(.lab){margin:0 0 20px}
.card .row button{font-size:18px}
.rel{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:6px}
.rel button{color:var(--accent);font-size:17.5px;line-height:1.3}.rel button:hover{text-decoration:underline}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.find,.rise{animation:none}}
@media(max-width:800px){
 body{font-size:18px}
 .top{padding:10px 14px;font-size:14px;letter-spacing:.05em;gap:4px;flex-wrap:wrap}.top .brand{width:100%}.topmute{position:absolute;top:6px;right:10px}.top nav{gap:14px;flex-wrap:nowrap;overflow-x:auto;width:100%}.top nav button{flex:none}
 .stage{align-items:flex-end;padding:0 18px 16px}
 .stage.scroll{padding:6px 16px 26px}
 .stage.film::before{content:"";position:absolute;inset:32% 0 0;background:linear-gradient(transparent,rgba(8,26,51,.93) 26%);pointer-events:none}
 .stage.hubv{display:block;overflow:auto;padding:8px 18px 26px}
 .col{width:100%}
 #prev{display:none}
 #year{font-size:56px;margin-bottom:6px}
 #nodes{display:grid;gap:8px;margin-top:6px}
 #nodes .node{position:static;transform:none;flex-direction:row;width:auto;text-align:left;gap:12px;border:1px solid var(--line);padding:13px 14px;background:rgba(8,26,51,.72)}
 #nodes .node span{margin-left:auto;white-space:nowrap}
 .ctl{gap:8px;padding:8px 12px;flex-wrap:wrap}.ctl .b{width:38px;height:38px}#pp{width:46px;height:46px}
 #st{flex:1 1 40%}.tg{padding:7px 9px;font-size:15px}
 .grid{grid-template-columns:1fr}.item{min-height:0}
 .toc button{grid-template-columns:36px 1fr}.toc .y{display:none}
 .card{padding:22px}
}
</style>
</head>

addEventListener('hashchange',route);

/* Vizualizace */
const cv=$('#c'),x=cv.getContext('2d');let W=0,H=0,DPR=1;
function fit(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);if(reduce)draw(0)}
addEventListener('resize',fit);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const stars=Array.from({length:220},()=>[rnd(),rnd(),rnd()*1.2+.3,rnd()]);
const foes=Array.from({length:64},()=>[rnd()*6.283,.34+rnd()*.64,rnd()]);
const cons=Array.from({length:30},()=>[rnd()*6.283,rnd(),rnd()*.5+.5]);
const mine=Array.from({length:16},()=>[rnd()*6.283,.1+rnd()*.2,rnd()*.6+.4]);
const vis={mode:'years',step:0,alarm:0,o:{},lbl:'',key:'',t0:0,tgt:[0,0,16],cur:[0,0,16],reset(){this.step=0;this.alarm=0;this.tgt=[0,0,16];this.cur=[0,0,16];this.o={};this.lbl='';this.key='';this.key0=0;this.t0=performance.now()}};
const COL={line:'rgba(222,236,246,.3)',faint:'rgba(222,236,246,.13)',amber:'#f6bd4b',red:'#ff7a5c',ice:'#bfe3f5'};
function center(){const m=W<=800;return m?[W*.5,H*.3,Math.min(W*.37,H*.2)]:[W*.71,H*.5,Math.min(H*.37,W*.23)]}
function draw(t){x.clearRect(0,0,W,H);x.fillStyle='#081a33';x.fillRect(0,0,W,H);
  if(vis.warp){warpDraw();if(vis.warp)return}
  for(const s of stars){const tw=.5+.5*Math.sin(t/1400+s[3]*20);x.fillStyle=`rgba(222,236,246,${.14+.42*tw*s[3]})`;x.beginPath();x.arc((s[0]*W+t*.004*s[2])%W,s[1]*H,s[2]*.8,0,7);x.fill()}
  const [cx,cy,R]=center();
  const M={orbit,radar,ship,planet,jump,contact,map:smap,senate,pillars,signal,dynasty,kingship,ark};if(M[vis.mode])M[vis.mode](t,cx,cy,R);else if(vis.mode==='years'||vis.mode==='hub')chart(t,cx,cy,R);}
function warpDraw(){const k=(performance.now()-vis.warp)/1150;if(k>=1){vis.warp=0;return}const cx=W/2,cy=H/2,e=k*k;x.lineCap='round';for(const s of stars){const px=s[0]*W-cx,py=s[1]*H-cy,d=Math.hypot(px,py)||1,ux=px/d,uy=py/d,r0=d*(1+e*2.2),r1=r0+e*H*.9*s[2];x.strokeStyle=`rgba(222,236,246,${.25+.65*s[3]})`;x.lineWidth=s[2]*1.1;x.beginPath();x.moveTo(cx+ux*r0,cy+uy*r0);x.lineTo(cx+ux*r1,cy+uy*r1);x.stroke()}if(k>.72){x.fillStyle=`rgba(232,242,250,${(k-.72)/.28*.75})`;x.fillRect(0,0,W,H)}}
function ring(cx,cy,r,dash,col){x.strokeStyle=col||COL.line;x.lineWidth=1;x.setLineDash(dash||[]);x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();x.setLineDash([])}
function chart(t,cx,cy,R){ring(cx,cy,R*.42);ring(cx,cy,R*.72,[2,7]);ring(cx,cy,R);x.strokeStyle=COL.faint;x.beginPath();x.moveTo(cx-R*1.12,cy);x.lineTo(cx+R*1.12,cy);x.moveTo(cx,cy-R*1.12);x.lineTo(cx,cy+R*1.12);x.stroke();
  [[.42,.00028,3],[.72,.00016,5],[1,.0001,4]].forEach((o,i)=>{const a=t*o[1]+i*2;dot(cx+Math.cos(a)*R*o[0],cy+Math.sin(a)*R*o[0],o[2],i===1?COL.amber:COL.ice)})}
function dot(a,b,r,c,al=1){x.globalAlpha=al;x.fillStyle=c;x.beginPath();x.arc(a,b,r,0,7);x.fill();x.globalAlpha=1}
function orbit(t,cx,cy,R){const alarm=vis.alarm,hot=alarm?COL.red:COL.amber,sold=vis.o&&vis.o.sold;
  const pulse=1+.08*Math.sin(t/600);x.fillStyle=alarm?'rgba(255,122,92,.14)':'rgba(246,189,75,.14)';x.beginPath();x.arc(cx,cy,R*.22*pulse,0,7);x.fill();dot(cx,cy,R*.09,hot);
  const pl=[[.36,.00046,5],[.56,.00031,8],[.77,.00022,6],[1,.00015,5]];
  pl.forEach((p,i)=>{const on=sold||i===vis.step;ring(cx,cy,R*p[0],on?null:[2,7],on?COL.line:COL.faint);const a=t*p[1]+i*1.7,px=cx+Math.cos(a)*R*p[0],py=cy+Math.sin(a)*R*p[0];if(sold){x.fillStyle='rgba(246,189,75,.18)';x.beginPath();x.arc(px,py,p[2]*2.6,0,7);x.fill()}dot(px,py,p[2],on?hot:COL.ice,on?1:.6)})}
function radar(t,cx,cy,R){for(let i=0;i<3;i++)vis.cur[i]+=(vis.tgt[i]-vis.cur[i])*.025;
  const [th,con,sq]=vis.cur;ring(cx,cy,R*.33);ring(cx,cy,R*.66);ring(cx,cy,R);x.strokeStyle=COL.faint;x.beginPath();x.moveTo(cx-R,cy);x.lineTo(cx+R,cy);x.moveTo(cx,cy-R);x.lineTo(cx,cy+R);x.stroke();
  const sw=reduce?1:t*.0013;const gr=x.createConicGradient?x.createConicGradient(sw-.9,cx,cy):null;
  if(gr){gr.addColorStop(0,'rgba(191,227,245,0)');gr.addColorStop(.143,'rgba(191,227,245,.24)');gr.addColorStop(.1431,'rgba(191,227,245,0)');x.fillStyle=gr;x.beginPath();x.arc(cx,cy,R,0,7);x.fill()}
  x.strokeStyle='rgba(191,227,245,.75)';x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(sw)*R,cy+Math.sin(sw)*R);x.stroke();
  dot(cx,cy,4,COL.ice);
  foes.slice(0,Math.round(th*foes.length)).forEach((f,i)=>{const d=f[1]-(th*.16)-(reduce?0:.018*Math.sin(t/2600+i));const big=i===9&&th>.6;dot(cx+Math.cos(f[0]+t*.00004)*R*Math.max(.22,d),cy+Math.sin(f[0]+t*.00004)*R*Math.max(.22,d),big?8:2.6,COL.red,big?1:.9)});
  cons.slice(0,Math.round(con)).forEach((c,i)=>{const p=((t*.00007*c[2])+c[1])%1,d=.12+p*.92;if(d<1)dot(cx+Math.cos(c[0])*R*d,cy+Math.sin(c[0])*R*d,2.4,COL.amber,1-p*.45)});
  mine.slice(0,Math.max(0,Math.round(sq))).forEach((m,i)=>{const a=m[0]+t*.00034*m[2];const last=Math.round(sq)===1;dot(cx+Math.cos(a)*R*m[1],cy+Math.sin(a)*R*m[1],last?4.2:2.8,COL.ice,last?.65+.35*Math.sin(t/330):1)})}

/* Knihovna animací svázaných s textem. Každá věta může mít vis (režim), o (volby) a lbl (popisek na obrazovce). */
function E0(t){return reduce?99:Math.max(0,(t-vis.t0)/1000)}
function visFor(s,n){for(let i=n;i>=0;i--){const l=s.lines[i];if(l.vis)return l}return null}
function applyVis(s,n){const l=visFor(s,n),mode=l?l.vis:s.vis,o=l?(l.o||{}):{},lb=l?(l.lbl||''):(s.lbl||''),key=mode+JSON.stringify(o)+lb;
  if(key===vis.key)return;const same=mode===vis.mode;vis.key=key;
  const set=()=>{vis.mode=mode;vis.o=o;vis.lbl=lb;vis.t0=performance.now();if(reduce)draw(performance.now())};
  const h=$('#hud');if(h){h.classList.remove('on');setTimeout(()=>{h.textContent=lb;if(lb)h.classList.add('on')},lb&&h.textContent?250:0)}
  if(same||reduce||!vis.key0){vis.key0=1;set();return}
  cv.style.opacity=0;setTimeout(()=>{if(vis.key===key)set();cv.style.opacity=1},320)}
function label(cx,cy,R){if(!vis.lbl)return;const m=W<=800;x.save();x.font='600 13px "Saira Condensed","Arial Narrow",sans-serif';x.textAlign='center';
  if('letterSpacing' in x)x.letterSpacing='3px';x.fillStyle='rgba(191,227,245,.78)';x.fillText(vis.lbl.toUpperCase(),cx,m?cy-R*1.12-6:cy+R*1.2+18);
  x.strokeStyle='rgba(191,227,245,.3)';const w=Math.min(R*.5,90),yy=m?cy-R*1.12+4:cy+R*1.2+28;x.beginPath();x.moveTo(cx-w,yy);x.lineTo(cx+w,yy);x.stroke();x.restore()}
function shipIcon(px,py,L,c,rot){x.save();x.translate(px,py);x.rotate(rot||0);x.fillStyle='#0d2240';x.strokeStyle=c;x.lineWidth=1.5;x.beginPath();x.moveTo(L,0);x.lineTo(-L*.7,-L*.5);x.lineTo(-L*.4,0);x.lineTo(-L*.7,L*.5);x.closePath();x.fill();x.stroke();x.restore()}

/* Loď v kvantovém letu */
function ship(t,cx,cy,R){const o=vis.o,v=o.fast?.9:.35;x.lineCap='round';
  for(const s of stars){const span=W*1.3,px=((s[0]*span-t*v*s[2])%span+span)%span-W*.15,py=s[1]*H,len=(o.fast?110:34)*s[2];
    x.strokeStyle=`rgba(222,236,246,${.12+.4*s[3]})`;x.lineWidth=s[2];x.beginPath();x.moveTo(px,py);x.lineTo(px+len,py);x.stroke()}
  ring(cx,cy,R,[2,9],COL.faint);const sy=cy+Math.sin(t/900)*R*.03,L=R*.36;
  const g=x.createRadialGradient(cx-L*.5,sy,0,cx-L*.5,sy,L*.75);g.addColorStop(0,'rgba(191,227,245,.85)');g.addColorStop(1,'rgba(191,227,245,0)');

  shipIcon(cx,sy,L*.6,COL.ice,0)}

/* Planeta: barren, forming, collapse, green, burn, build, protected, surround */
function planet(t,cx,cy,R){const s=vis.o.s||'barren',e=E0(t),r=R*.5;ring(cx,cy,R,[2,9],COL.faint);
  if(s==='build'){const k=.18+Math.min(1,e/5)*.55;x.strokeStyle='rgba(191,227,245,.55)';x.lineWidth=1;
    for(let i=1;i<8;i++){const la=-Math.PI/2+i*Math.PI/8,yy=cy+Math.sin(la)*r,rr=Math.cos(la)*r;x.beginPath();x.ellipse(cx,yy,rr,rr*.22,0,0,6.283*k);x.stroke()}
    for(let i=0;i<8;i++){const a=i*Math.PI/8+t*.00018;x.beginPath();x.ellipse(cx,cy,Math.abs(Math.cos(a))*r,r,0,-Math.PI/2,-Math.PI/2+6.283*k);x.stroke()}

      if(i%2===0){x.strokeStyle='rgba(246,189,75,.25)';x.beginPath();x.moveTo(px,py);x.lineTo(cx+Math.cos(a)*r*.7,cy+Math.sin(a)*r*.4);x.stroke()}}return}
  const pal={barren:['#e2875e','#5a2516'],forming:['#d99a6c','#4a2a26'],collapse:['#e2875e','#3a1410'],green:['#86c9d6','#1c465a'],burn:['#9a5236','#250c08'],protected:['#93d3a4','#1e4a3a'],surround:['#bba27a','#3a2e22']}[s];
  let atm=0;if(s==='forming')atm=Math.min(1,e/5);if(s==='green'||s==='protected')atm=1;if(s==='collapse')atm=Math.max(0,1-e/2.4)*(.6+.4*Math.sin(t/70));

  if(s==='green'||s==='protected'||s==='forming'){x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();x.strokeStyle=`rgba(255,255,255,${s==='forming'?.12*atm:.18})`;x.lineWidth=r*.08;
    for(let i=0;i<4;i++){const yy=cy-r*.6+i*r*.4,off=((t*.012*(i%2?1:-1))%(r*2));x.beginPath();x.moveTo(cx-r*2+off,yy);x.bezierCurveTo(cx-r*.6+off,yy-r*.15,cx+off,yy+r*.15,cx+r*2+off,yy);x.stroke()}x.restore()}

  if(s==='collapse'){const k=Math.min(1,e/2.4);x.strokeStyle=`rgba(255,122,92,${.6*(1-k*.6)})`;x.lineWidth=1.5;x.beginPath();x.arc(cx,cy,r*(1.38-.36*k),0,7);x.stroke()}
  if(s==='burn')for(let i=0;i<14;i++){const a=i*2.4,d=((i*.37)%1)*.85,px=cx+Math.cos(a)*r*d,py=cy+Math.sin(a)*r*d*.9,f=.5+.5*Math.sin(t/(170+i*23)+i);
    x.fillStyle=`rgba(255,122,92,${.22*f})`;x.beginPath();x.arc(px,py,r*.17*f+2,0,7);x.fill();dot(px,py,2,COL.red,.7+.3*f)}

  const g2=x.createLinearGradient(cx-r,cy,cx+r,cy);g2.addColorStop(.5,'rgba(4,10,20,0)');g2.addColorStop(1,'rgba(4,10,20,.55)');x.fillStyle=g2;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}

/* Skokový bod: anomaly (vír, mizející lodě), through (průlet tunelem a nové slunce) */
function jump(t,cx,cy,R){const s=vis.o.s||'anomaly',e=E0(t);
  if(s==='through'){const sp=Math.min(1,e/3);
    for(let i=0;i<16;i++){const k=((t*.0003*(1+sp*2)+i/16)%1),r=R*1.45*k*k;x.strokeStyle=`rgba(191,227,245,${Math.sin(k*Math.PI)*.55})`;x.lineWidth=1+k*2.5;x.beginPath();x.ellipse(cx,cy,r,r*.82,t*.0003,0,7);x.stroke()}

  for(let arm=0;arm<3;arm++){x.beginPath();for(let k=0;k<=60;k++){const f=k/60,a=arm*2.094+f*5+t*.0006,r=R*.92*f,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.8;k?x.lineTo(px,py):x.moveTo(px,py)}x.strokeStyle='rgba(191,227,245,.22)';x.lineWidth=1.5;x.stroke()}

/* Setkání dvou lodí: meet, tense, delegation, accord, flee */
function contact(t,cx,cy,R){const s=vis.o.s||'meet',e=E0(t),hx=cx-R*.55,hy=cy+R*.12,ax=cx+R*.55,ay=cy-R*.12;ring(cx,cy,R,[2,9],COL.faint);
  if(s==='flee'){const k=(t*.00007)%1,fx=cx-R*1.1+k*R*2.2,fy=cy+Math.sin(k*6)*R*.2;
    for(let i=1;i<4;i++)shipIcon(fx-i*R*.2,fy+Math.sin(t/300+i)*R*.05,5,COL.red,0);shipIcon(fx,fy,R*.1,COL.amber,0);return}
  for(let i=0;i<3;i++){const k=((t*.0005+i/3)%1);x.lineWidth=1;x.strokeStyle=`rgba(191,227,245,${(1-k)*.5})`;x.beginPath();x.arc(hx,hy,k*R*.9,-.6,.6);x.stroke();
    x.strokeStyle=`rgba(246,189,75,${(1-k)*.5})`;x.beginPath();x.arc(ax,ay,k*R*.9,Math.PI-.6,Math.PI+.6);x.stroke()}
  if(s==='tense'){x.strokeStyle=`rgba(255,122,92,${.4+.4*Math.abs(Math.sin(t/160))})`;x.setLineDash([4,5]);x.beginPath();x.moveTo(hx,hy);x.lineTo(ax,ay);x.stroke();x.setLineDash([])}
  if(s==='delegation'){const k=Math.min(1,e/3);[[.25,-.22],[.25,.22],[.45,-.38],[.45,.38]].forEach((p,i)=>shipIcon(ax+R*p[0]+R*.6*(1-k),ay+R*p[1],R*.06,COL.amber,Math.PI))}
  if(s==='accord'){const k=Math.min(1,e/2);const mx=hx+(ax-hx)*.5,my=hy+(ay-hy)*.5;x.strokeStyle=`rgba(246,189,75,${.7*k})`;x.lineWidth=2;x.beginPath();x.moveTo(hx,hy);x.lineTo(hx+(ax-hx)*k,hy+(ay-hy)*k);x.stroke();
    if(k>=1){x.fillStyle=`rgba(246,189,75,${.15+.1*Math.sin(t/400)})`;x.beginPath();x.arc(mx,my,R*.14,0,7);x.fill();dot(mx,my,4,COL.amber)}}
  shipIcon(hx,hy,R*.12,COL.ice,0);shipIcon(ax,ay,R*.12,COL.amber,Math.PI)}

/* Hvězdná mapa: n (počet rozsvícených soustav), border, cross, peace, spread, red, erase, hi, trade */
const MAP=(()=>{let sd=11;const r=()=>(sd=(sd*16807)%2147483647)/2147483647,n=[[-.55,.05]];let g=0;
  while(n.length<24&&g++<5000){const p=[r()*2-1,(r()*2-1)*.8];if(Math.hypot(p[0],p[1])>1)continue;if(n.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<.22))continue;n.push(p)}
  const d=n.map(p=>Math.hypot(p[0]-n[0][0],p[1]-n[0][1])),N=n.map((_,i)=>i).sort((a,b)=>d[a]-d[b]).map(i=>n[i]),E=[];
  N.forEach((p,i)=>N.map((q,j)=>[Math.hypot(q[0]-p[0],q[1]-p[1]),j]).filter(z=>z[1]!==i).sort((a,b)=>a[0]-b[0]).slice(0,2).forEach(z=>{const a=Math.min(i,z[1]),b=Math.max(i,z[1]);if(!E.some(e=>e[0]===a&&e[1]===b))E.push([a,b])}));
  const Hh=N.map(()=>99);Hh[0]=0;for(let k=0;k<30;k++)E.forEach(([a,b])=>{Hh[b]=Math.min(Hh[b],Hh[a]+1);Hh[a]=Math.min(Hh[a],Hh[b]+1)});
  const far=N.reduce((m,p,i)=>p[0]<N[m][0]-.0&&p[1]<0?i:m,1);return{N,E,H:Hh,far}})();
function smap(t,cx,cy,R){const o=vis.o,e=E0(t),N=MAP.N,lit=o.n??N.length,P=N.map(p=>[cx+p[0]*R,cy+p[1]*R]),xi=i=>o.border&&N[i][0]>.45,wave=o.spread?e*1.6:null;
  MAP.E.forEach(([a,b])=>{if(a>=lit||b>=lit)return;if(o.border&&xi(a)!==xi(b))return;let c='rgba(191,227,245,.22)';
    if(wave!=null&&wave>Math.max(MAP.H[a],MAP.H[b]))c=o.red?'rgba(255,122,92,.45)':'rgba(246,189,75,.45)';
    if(o.trade&&(a===0||b===0||MAP.H[a]<3&&MAP.H[b]<3)){const k=(t*.0004)%1;dot(P[a][0]+(P[b][0]-P[a][0])*k,P[a][1]+(P[b][1]-P[a][1])*k,1.8,COL.amber)}
    x.strokeStyle=c;x.lineWidth=1;x.beginPath();x.moveTo(P[a][0],P[a][1]);x.lineTo(P[b][0],P[b][1]);x.stroke()});
  P.forEach((p,i)=>{if(i>=lit)return;let c=xi(i)?COL.amber:COL.ice,al=1,r=i?2.6:4.6;
    if(o.erase&&i===MAP.far)al=Math.max(.08,1-e/2.5);
    if(wave!=null){const k=wave-MAP.H[i];if(k>0){c=o.red?COL.red:COL.amber;r+=Math.max(0,3-k*2)}}
    dot(p[0],p[1],r,c,al)});
  if(o.n!=null&&lit>0&&lit<N.length+1){const p=P[lit-1],k=(t*.001)%1;ring(p[0],p[1],6+k*16,null,`rgba(246,189,75,${1-k})`)}
  if(o.border){const bx=cx+.45*R;x.strokeStyle=o.peace?`rgba(111,211,160,${Math.max(.2,.8-e*.12)})`:'rgba(255,122,92,.65)';x.lineWidth=1.5;x.setLineDash(o.peace?[2,9]:[6,6]);x.beginPath();x.moveTo(bx,cy-R*.95);x.lineTo(bx,cy+R*.95);x.stroke();x.setLineDash([]);
    if(o.cross){const k=(t*.00012)%1;shipIcon(bx-R*.3+k*R*.6,cy-R*.08,6,COL.ice,0)}}
  if(o.hi!=null){const p=P[o.hi];ring(p[0],p[1],11+2*Math.sin(t/300),null,COL.amber)}
  if(o.erase){const p=P[MAP.far],k=Math.min(1,e/2),s=9;x.strokeStyle=`rgba(255,122,92,${k})`;x.lineWidth=2;x.beginPath();x.moveTo(p[0]-s,p[1]-s);x.lineTo(p[0]+s,p[1]+s);x.moveTo(p[0]+s,p[1]-s);x.lineTo(p[0]-s,p[1]+s);x.stroke()}}

/* Senát: půlkruh křesel, vote = hlasování, one = jediná moc */
function senate(t,cx,cy,R){const o=vis.o,e=E0(t),vote=o.vote?Math.min(1,e/2.5):0,by=cy+R*.3;let i=0;
  for(let r=0;r<5;r++){const rr=R*(.42+r*.14),n=12+r*5;for(let j=0;j<n;j++,i++){const a=Math.PI+(j+.5)/n*Math.PI,k=(i*.618)%1,on=k<vote;
    dot(cx+Math.cos(a)*rr,by+Math.sin(a)*rr,3,on?(o.red?COL.red:COL.amber):COL.ice,on?1:.42+.1*Math.sin(t/700+i))}}
  x.strokeStyle=COL.line;x.beginPath();x.moveTo(cx-R*1.05,by+10);x.lineTo(cx+R*1.05,by+10);x.stroke();
  if(o.one){x.fillStyle=`rgba(246,189,75,${.18+.08*Math.sin(t/500)})`;x.beginPath();x.arc(cx,by-R*.08,R*.16,0,7);x.fill();dot(cx,by-R*.08,7,COL.amber)}else dot(cx,by-R*.08,4,COL.amber)}

/* Tři pilíře: fall = pád a nástup jediné moci */
function pillars(t,cx,cy,R){const o=vis.o,e=E0(t),w=R*.17,h=R*.85,base=cy+R*.45;
  x.strokeStyle=COL.line;x.lineWidth=1;x.beginPath();x.moveTo(cx-R*.8,base);x.lineTo(cx+R*.8,base);x.stroke();
  [-1,0,1].forEach((d,i)=>{let ang=0,al=1;if(o.fall){const k=Math.min(1,Math.max(0,(e-i*.35)/1.4));ang=(d||.35)*k*k*1.2;al=1-k*.75}
    x.save();x.translate(cx+d*R*.45,base);x.rotate(ang);x.globalAlpha=al;x.fillStyle='rgba(191,227,245,.1)';x.strokeStyle=COL.ice;x.lineWidth=1.5;
    x.fillRect(-w/2,-h,w,h);x.strokeRect(-w/2,-h,w,h);x.strokeRect(-w*.72,-h-9,w*1.44,9);x.strokeRect(-w*.72,-6,w*1.44,6);
    x.lineWidth=1;x.strokeStyle='rgba(191,227,245,.4)';for(let f=1;f<4;f++){x.beginPath();x.moveTo(-w/2+f*w/4,-h+6);x.lineTo(-w/2+f*w/4,-8);x.stroke()}x.restore();x.globalAlpha=1});
  if(o.fall){const k=Math.min(1,Math.max(0,(e-1.4)/1.6));if(k>0){x.fillStyle=`rgba(255,122,92,${.18*k})`;x.beginPath();x.arc(cx,cy-R*.62,R*.2,0,7);x.fill();dot(cx,cy-R*.62,R*.06*k,COL.red)}}
  else{const p=.5+.5*Math.sin(t/700);[-1,0,1].forEach(d=>dot(cx+d*R*.45,base-h-16,3,COL.amber,.5+.5*p))}}

/* Vysílání: kruhy signálu, red = propaganda */
function signal(t,cx,cy,R){const red=vis.o.red,c=red?'255,122,92':'191,227,245';
  for(let i=0;i<5;i++){const k=((t*.00035+i/5)%1);x.strokeStyle=`rgba(${c},${(1-k)*.6})`;x.lineWidth=1.5;x.beginPath();x.arc(cx,cy,k*R*1.1,0,7);x.stroke()}
  for(let i=0;i<18;i++){const a=i/18*6.283+.2,d=R*(.45+.5*((i*.37)%1)),lit=Math.max(0,Math.sin(t/420-d/R*6));dot(cx+Math.cos(a)*d,cy+Math.sin(a)*d,2.4,red?COL.red:COL.ice,.25+.75*lit)}
  for(let i=-3;i<=3;i++){const hg=R*.05+R*.13*Math.abs(Math.sin(t/180+i*1.3));x.fillStyle=red?COL.red:COL.amber;x.fillRect(cx+i*8-2,cy-hg/2,4,hg)}}

/* Dynastie: řada korun, coup = převrat, end = konec rodu */
function crown(px,py,s,c,al){x.globalAlpha=al;x.strokeStyle=c;x.fillStyle='rgba(8,26,51,.9)';x.lineWidth=1.5;x.beginPath();x.moveTo(px-s,py+s*.5);x.lineTo(px-s,py-s*.4);x.lineTo(px-s*.5,py);x.lineTo(px,py-s*.75);x.lineTo(px+s*.5,py);x.lineTo(px+s,py-s*.4);x.lineTo(px+s,py+s*.5);x.closePath();x.fill();x.stroke();x.globalAlpha=1}
function dynasty(t,cx,cy,R){const o=vis.o,e=E0(t),n=11,pts=[];for(let i=0;i<n;i++){const a=Math.PI*.95-i/(n-1)*Math.PI*.9;pts.push([cx+Math.cos(a)*R*.85,cy+R*.25-Math.sin(a)*R*.75])}
  const shown=o.coup||o.end?n:Math.min(n,Math.floor(e*2.5)+1);
  x.strokeStyle=COL.line;x.lineWidth=1;x.beginPath();pts.slice(0,shown).forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
  pts.slice(0,shown).forEach((p,i)=>{let c=COL.amber,al=1,s=9;
    if(o.coup&&i===n-2){c=COL.red;al=Math.max(.15,1-e/2)}if(o.coup&&i===n-1)s=12;
    if(o.end){al=Math.max(.12,1-e/2.5);if(i===n-1){c=COL.red;al=1}}crown(p[0],p[1],s,c,al)});
  if(o.end){const p=pts[n-1],k=Math.min(1,e/1.5),s=16;x.strokeStyle=`rgba(255,122,92,${k})`;x.lineWidth=2;x.beginPath();x.moveTo(p[0]-s,p[1]-s);x.lineTo(p[0]+s,p[1]+s);x.moveTo(p[0]+s,p[1]-s);x.lineTo(p[0]-s,p[1]+s);x.stroke()}}

/* Kingship: obří loď, před kterou prchají malé lodě */
function kingship(t,cx,cy,R){const e=E0(t),k=Math.min(1,e/10),L=R*1.5,hx=cx+R*1.35-k*R*1.45;ring(cx,cy,R,[2,9],COL.faint);
  for(let i=0;i<9;i++){const p=((t*.00012+i/9)%1);shipIcon(hx-L*.62-p*R*1.5,cy+(i-4)*R*.11+Math.sin(t/500+i)*3,4,COL.ice,Math.PI)}
  x.save();x.translate(hx,cy);x.fillStyle='#14090e';x.strokeStyle='rgba(255,122,92,.75)';x.lineWidth=1.5;x.beginPath();
  x.moveTo(-L*.55,0);x.lineTo(-L*.2,-R*.18);x.lineTo(L*.1,-R*.33);x.lineTo(L*.55,-R*.22);x.lineTo(L*.45,0);x.lineTo(L*.55,R*.22);x.lineTo(L*.1,R*.33);x.lineTo(-L*.2,R*.18);x.closePath();x.fill();x.stroke();
  x.strokeStyle='rgba(255,122,92,.4)';for(let i=0;i<6;i++){const px=-L*.25+i*L*.12;x.beginPath();x.moveTo(px,-R*.15-i*R*.025);x.lineTo(px+L*.06,-R*.4);x.moveTo(px,R*.15+i*R*.025);x.lineTo(px+L*.06,R*.4);x.stroke()}
  for(let i=0;i<10;i++)dot(-L*.42+i*L*.09,(i%2?-1:1)*R*.07,1.8,COL.red,.35+.65*Math.abs(Math.sin(t/400+i)));x.restore()}

/* Archa: rotující prstenec, do kterého proudí vědění všech ras */
function ark(t,cx,cy,R){const a=t*.00025,r=R*.6;
  for(let i=0;i<18;i++){const k=((t*.00012+i/18)%1),ang=i*2.1,d=R*(1.15-k*.95);dot(cx+Math.cos(ang)*d,cy+Math.sin(ang)*d,1.8,[COL.ice,COL.amber,'#8fd0a0'][i%3],k)}
  x.save();x.translate(cx,cy);x.rotate(-.3);x.strokeStyle='rgba(191,227,245,.22)';x.lineWidth=10;x.beginPath();x.ellipse(0,0,r,r*.32,0,0,7);x.stroke();
  x.strokeStyle='rgba(191,227,245,.75)';x.lineWidth=1.5;x.beginPath();x.ellipse(0,0,r,r*.32,0,0,7);x.stroke();
  x.strokeStyle='rgba(191,227,245,.2)';x.lineWidth=1;for(let i=0;i<6;i++){const b=a*.6+i/6*6.283;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(b)*r,Math.sin(b)*r*.32);x.stroke()}
  for(let i=0;i<12;i++){const b=a+i/12*6.283,front=Math.sin(b)>0;dot(Math.cos(b)*r,Math.sin(b)*r*.32,front?3:2,i%3?COL.ice:COL.amber,front?1:.4)}x.restore();
  x.fillStyle=`rgba(246,189,75,${.15+.06*Math.sin(t/700)})`;x.beginPath();x.arc(cx,cy,R*.17,0,7);x.fill();dot(cx,cy,R*.06,COL.amber)}

/* Automatický výběr animace pro kapitoly od bota podle obsahu věty */
function autoVis(t){const s=t.toLowerCase();
  if(/kingship/.test(s))return{vis:'kingship'};
  if(/vanduul|bitv|útok|útoč|flotil|válk|boj|obrana|obran|nájezd/.test(s))return{vis:'radar',r:[.55,0,12]};
  if(/skokov|skok /.test(s))return{vis:'jump',o:{s:'through'}};
  if(/hoř|zničen|vyhub|vypálen|pad/.test(s)&&/planet|svět|kolon/.test(s))return{vis:'planet',o:{s:'burn'}};
  if(/terraform|atmosf/.test(s))return{vis:'planet',o:{s:'forming'}};
  if(/senát|imperátor|volb|zákon/.test(s))return{vis:'senate'};
  if(/banu|xi.an|tevarin|kontakt|dohod|smlouv/.test(s))return{vis:'contact'};
  if(/vysíl|zpráv|propagand|signál/.test(s))return{vis:'signal'};
  return null}

addEventListener('resize',()=>placeNodes());
function loop(t){draw(t);if(!reduce)requestAnimationFrame(loop)}

/* Kapitoly od bota (soubory _kapitoly/*.md na GitHubu) – přidají se mezi Příběhy */
async function loadWebChapters(){try{
  const r=await fetch('../kapitoly.json',{cache:'no-store'});if(!r.ok)return;const list=await r.json();if(!Array.isArray(list)||!list.length)return;
  list.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const items=[];
  list.forEach(k=>{
    const box=document.createElement('div');box.innerHTML=k.html||'';
    let paras=[...box.querySelectorAll('p')].map(p=>p.textContent.trim()).filter(Boolean);if(!paras.length)paras=(box.textContent||'').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
    const sent=[];let lastAv=null;paras.forEach((p,pi)=>{const parts=p.split(/(?<=[.!?…]["“”»]?)\s+(?=[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ])/);parts.forEach((s,si)=>{s=s.trim();if(s){const av=autoVis(s),key=av&&JSON.stringify(av);const l={who:'ARCHIVÁŘ',t:s,v:s,p:0,h:si===parts.length-1?.9:.4};if(av&&key!==lastAv){Object.assign(l,av);lastAv=key}sent.push(l)}})});
    if(!sent.length)return;
    const id='web-'+k.slug;
    const head={who:'ARCHIVÁŘ',t:k.title+'.',v:k.title+'.',h:1,fx:'bell'};
    const src=(k.prameny||[]).map(p=>p.nazev+(p.typ?' ('+p.typ+')':'')).join(' · ');
    const note=(k.overeni==='OK'?'Ověřeno proti pramenům':'Čeká na ověření')+(src?'. Prameny: '+src:'');
    S.push({id,label:k.title,sub:[k.era,k.herni_rok].filter(Boolean).join(' · '),type:'lines',mood:'kapitola',vis:'orbit',lines:[head,...sent],note});
    items.push({id,title:k.title,tag:'Nová kapitola'+(k.herni_rok?' · '+k.herni_rok:''),text:k.popis||'',blurb:k.popis||'',ch:[],play:id,voice:k.popis||'',soon:false});
  });
  D.cats.pribehy.items=[...items,...D.cats.pribehy.items];
  if(view==='hub'||view==='list')route();
}catch(e){}}
loadWebChapters().then(()=>{const w=wanted();const b=$('#go');if(w&&b){b.textContent='Přehrát: '+S[idx(w)].label}});
fit();route();if(reduce)draw(0);else requestAnimationFrame(loop);
</script>
