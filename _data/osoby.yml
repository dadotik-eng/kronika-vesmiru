  kapitoly: [kap-6, kap-8]

- id: "anthony-tanaka"
  jmeno: "Anthony Tanaka"
  narozeni: "2745"
  umrti: "2757"
  role: "dětský dělník, mučedník protimesserovského hnutí"
  kategorie: "politika"
  medailonek: "Anthony Tanaka se narodil v Newcastlu na planetě Borea a místní úřady ho v sedmi letech poslaly pracovat do muniční továrny. Dne 3. prosince 2757, vyčerpaný po šestnáctihodinové směně, odmítl zaskočit za spolupracovníka, který upadl do anafylaktického šoku. Agent Advokacie, který ve firmě sloužil jako ochranka, ho za tento vzdor popravil přímo v hale továrny. Záznam vraždy byl z továrny propašován a stal se symbolem odporu pro sílící protimesserovské hnutí; na Tanakovu počest vznikl Den vzpomínky."
  zdroje:
    - nazev: "Anthony Tanaka"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RwZBdpj2rz-anthony-tanaka
  kapitoly: []

- id: "erin-toi"
  jmeno: "Erin Toi"
  narozeni: "2746"
  umrti: "2873"
  role: "první imperátorka UEE po pádu Messerů"
  kategorie: "vladari"
  medailonek: "Erin Toi byla politička a spisovatelka, senátorka za Zemi a první imperátorka Spojeného impéria Země (UEE) po skončení éry Messerů (2546–2792). V úřadu dohlížela na vznik a zavedení zákona Fair Chance, na soudy s bývalými messerovskými agenty za válečné zločiny, na Pakt o Perryho linii, na obnovu Tribunálu i na další zásadní změny ve vládě UEE. Senátoru Terrenci Akarimu nabídla místo velvyslance u Xi’anů a diplomatickým tajemníkem své vlády jmenovala Marshalla Leona. Úřad opustila v roce 2801 a Leona podpořila v kampani za svého nástupce."
  zdroje:
