- id: "ne-se-ruoth"
  jmeno: "Nē\" se Ruoth"
  narozeni: "2475"
  umrti: "2898"
  role: "xi’anská průzkumnice a historička"
  kategorie: "xiani-tevarini"
  medailonek: "Nē\" se Ruoth byla nejmladší dcerou jedné z matriarch xi’anského rodu Ruoth a měla se stát politickou historičkou jako ostatní v rodině, víc ji však lákal průzkum a pilotování lodí. Během civilní služby Pō't.ōngp.ū sloužila jako průzkumnice xi’anské armády a ve volných chvílích prozkoumávala okraje soustav, kde byla zrovna umístěna. Tak v roce 2542 objevila skokový bod ze soustavy R.il'a do soustavy Odara (dnešní Gurzil), kterou ovládaly Spojené planety Země (UPE). Její příchod do Odary vyhrotil napětí mezi Xi’any a lidmi, a tak sice dostala za objev pochvalu, ale za neopatrnost přišla o místo pilotky a zbytek služby odsloužila jako písařka. Po návratu se ujala rodinného řemesla, dál létala na vlastní lodi a v roce 2881 zvítězila v Koa e Ko'ia."
  zdroje:
    - nazev: "Nē\" se Ruoth"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/V8WPAo6xpO-nee-se-ruoth
  kapitoly: []

- id: "upsana-dixit"
  jmeno: "Upsana Dixit"
  narozeni: "2491"
  umrti: "2563"
  role: "novinářka, tvůrkyně pořadu Showdown!"
  kategorie: "kultura"
  medailonek: "Upsana Dixit se narodila v roce 2491 v Quintonu na planetě Angeli (Croshaw II). V roce 2511 vytvořila Showdown!, třicetiminutový zvukový pořad, v němž se debatovalo o aktuálním dění. Když si pořad získal velké publikum, koupila ho společnost SSN/CAtv a v roce 2521 z něj udělala vysílání na Spectru. Dixit jej nestranně moderovala až do roku 2546, kdy na protest proti nástupu Ivara Messera I. k moci odešla. Zemřela ve věku 72 let při zemětřesení ve svém rodném Quintonu v roce 2563."
  zdroje:
    - nazev: "Upsana Dixit"
      typ: Galactapedie
