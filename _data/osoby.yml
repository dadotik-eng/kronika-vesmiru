- id: "janis-rezaian"
  jmeno: "Janis Rezaian"
  narozeni: "2469"
  umrti: "2550"
  role: "vrchní tajemnice UPE"
  kategorie: "politika"
  medailonek: "Janis Rezaian zastávala v letech 2539 až 2546 úřad vrchní tajemnice Spojených planet Země (UPE) a zasedala v Tribunálu. Spolu s vrchním advokátem Mauriciem Tuskem veřejně kritizovala vrchního generála Ivara Messera za to, že odmítá vyjednávat s ostatními členy Tribunálu. Jakmile se Messer stal prvním občanem, Tribunál rozpustil. V roce 2548 kandidovala na senátorku za planetu Vann (Croshaw III), ale volby prohrála. Zemřela přirozenou smrtí ve věku 81 let."
  zdroje:
    - nazev: "Janis Rezaian"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VaZwBAGOBv-janis-rezaian
