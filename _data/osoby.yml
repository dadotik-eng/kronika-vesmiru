  narozeni: "2880"
  umrti: "žije"
  role: "admirál námořnictva UEE"
  kategorie: "armada"
  medailonek: "Ernst Bishop je admirálem námořnictva Spojeného impéria Země (UEE) a od 9. února 2939 velí 65. bojové skupině 2. flotily. Předtím velel 6. bojové skupině. Do hodnosti admirála ho navrhl imperátor Mikkel Sheriden a Senát ho potvrdil v roce 2930. V čele 65. bojové skupiny se účastnil bitvy o Vegu II."
