- id: "sydney-kamarck"
  jmeno: "Sydney Kamarck"
  narozeni: "2761"
  umrti: "2864"
  role: "historička, autorka knihy The Path to Prime Citizen"
  kategorie: "veda-technika"
  medailonek: "Sydney Kamarck byla historička politických systémů lidstva na Rhetorské univerzitě, proslavená knihou The Path to Prime Citizen z roku 2812. Vycházela z tisíců osobních i úředních záznamů rodu Messerů, které v roce 2806 zveřejnila Komise pro pravdu a smíření. Při jejich studiu dospěla k závěru, že za sérií bombových útoků, které v roce 2546 zabily tisíce lidí, mohl stát Ivar Messer I. Ve své knize tvrdila, že útoky nejspíš provedli jeho bývalí spolubojovníci Adam Corr a Cyrus Ishitaka, a to na Messerův rozkaz."
  zdroje:
    - nazev: "Sydney Kamarck"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VaZwNWd7lm-sydney-kamarck
  kapitoly: []

- id: "daniela-argen"
  jmeno: "Daniela Argen"
  narozeni: "2762"
  umrti: "2838"
  role: "senátorka za Locke"
  kategorie: "politika"
  medailonek: "Daniela Argen byla v letech 2801 až 2827 senátorkou Spojeného impéria Země (UEE) za planetu Locke (Idris IV); zvolena byla se slibem oživit ekonomiku a prosadila daňové úlevy pro začínající podnikatele i program, který snížil nezaměstnanost. V roce 2815 předložila Senátu plán na stavbu věznice s nejvyšší ostrahou a závodu na zpracování antihmoty na Kellogu VI: silná stráž měla bez dalších nákladů na armádu varovat před vanduulskými vpády skrz tehdy nově objevené skokové body do soustav Virgil a Vector a závod měl přinášet příjmy i stálý přísun antihmoty. Senát plán schválil. Během třetího funkčního období ji Advokacie zatkla za přijímání úplatků, musela odstoupit a po soudu dostala pokutu; pak pracovala jako soukromá poradkyně. V roce 2838 ji našli mrtvou s mnoha bodnými ranami v hotelovém pokoji na planetě Asura (Ferron III) a její vražda nebyla nikdy objasněna."
  zdroje:
    - nazev: "Daniela Argen"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RvlxLvYKKv-daniela-argen
  kapitoly: []

- id: "fiona-messer"
  jmeno: "Fiona Messer"
  narozeni: "2768"
  umrti: "neznámo"
  role: "sestra Lintona XI., poslední z rodu Messerů"
  kategorie: "politika"
  rod: "messer"
  medailonek: "Fiona Messer byla mladší sestrou Lintona XI. a po jeho smrti poslední žijící členkou dynastie Messerů. Nejprve pomohla bratrovi sesadit jejich otce Ulyssese X., pak se ale spolčila s některými silami uvnitř UEE, aby Lintona odstranila a sama převzala jeho místo. Informace, které předávala odbojové skupině Tide, pomohly rozdmýchat protimesserovskou revoluci. Když po úniku záznamu z masakru na Garronu II vypuklo povstání, zapsala si do osobního deníku, že se šíří příliš rychle, než aby se dalo zvládnout. Historici se domnívají, že uprchla, aby unikla zajetí a popravě, která čekala jejího bratra; co se s ní stalo potom, není známo."
  zdroje:
    - nazev: "Fiona Messer"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/R56nLjJog7-fiona-messer
  kapitoly: [kap-6, kap-8]

- id: "patek-coen"
  jmeno: "Patek Coen"
  narozeni: "2786"
  umrti: "2867"
  role: "navjumper, objevitel soustavy Kellog"
  kategorie: "objevitele"
  medailonek: "Patek Coen se narodil na planetě Kampos (Ellis IV) a začínal jako pilot soukromé trajektové linky na sousední planety Green a Noble. K navjumpingu ho přivedla biografie Antoina Lebeca, a tak ve volném čase absolvoval soukromé kurzy navigace a detekce; jeho snem bylo žít v soustavě, kterou sám objeví. Po téměř deseti letech hledání našel v roce 2811 skokový bod do soustavy Kellog, zklamání však přišlo, když se ukázalo, že na planetě Kellog II žije civilizace Ormů, soustava spadla pod zákon Fair Chance a on v ní nesměl žít. S navjumpingem skončil v roce 2839, kdy se jeho autobiografie A Refuted Dream nečekaně stala bestsellerem."
  zdroje:
    - nazev: "Patek Coen"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/R9vPd4ZjK7-patek-coen
  kapitoly: []

- id: "toshi-aaron"
  jmeno: "Toshi Aaron"
  narozeni: "2802"
  umrti: "2929"
  role: "navjumperka, objevitelka soustavy Stanton"
  kategorie: "objevitele"
  medailonek: "Toshi Aaron se narodila v soustavě Magnus a už jako malé dítě snila o objevení nového skokového bodu. Na průzkum hvězd na plný úvazek neměla peníze, a tak brala riskantní, ale dobře placené práce při rybolovu v oceánech Magnu a mimo sezónu hledala skokové body. V roce 2851 zachytila anomálii, která se ukázala být skokovým bodem do nové soustavy. Objev ohlásila vládě Spojeného impéria Země (UEE) a požádala, aby soustava nesla jméno Stanton na počest jejího zesnulého bratra."
  zdroje:
    - nazev: "Toshi Aaron"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/0NjkMMlGXD-toshi-aaron
  kapitoly: [kap-9]

- id: "aberdeen-hurston"
  jmeno: "Aberdeen Hurston"
  narozeni: "2821"
  umrti: "2912"
  role: "inženýr Hurston Dynamics, konstruktér antihmotové hlavice"
  kategorie: "veda-technika"
  medailonek: "Aberdeen Hurston byl inženýr, který ve společnosti Hurston Dynamics pracoval od roku 2841 až do odchodu do důchodu v roce 2877. Už během studií na univerzitě spolupracoval na dálku se zbrojním týmem firmy na prvních pokusech o rakety na bázi antihmoty. V roce 2853 tým po letech výzkumu představil první antihmotovou hlavici společnosti postavenou podle jeho návrhu, což firmě zajistilo dlouhodobý kontrakt se Spojeným impériem Země (UEE). Na jeho počest nese jméno Aberdeen druhý měsíc planety Hurston."
  zdroje:
    - nazev: "Aberdeen Hurston"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VlMMykaZKv-aberdeen-hurston
  kapitoly: []

- id: "errol-navis"
  jmeno: "Errol Navis"
  narozeni: "2822"
  umrti: "2931"
  role: "účetní a amatérský průzkumník, objevitel soustavy Oso"
  kategorie: "objevitele"
  medailonek: "Errol Navis se narodil na planetě Carteyna (Cano II) rodičům geoinženýrům a po studiu matematiky nastoupil v roce 2843 jako účetní ke společnosti Shubin Interstellar. Dětství strávené v uzavřených základnách s řízeným prostředím v něm podle pozdějších výkladů probudilo silnou touhu žít ve světě s otevřeným nebem a dýchatelnou atmosférou. Když mu Shubin zamítl přeložení na Terru, koupil si malou loď a o víkendech s ní bral svou malou dceru Oso na výlety do exotických míst. Na jednom z nich zachytil na okraji soustavy Castra anomálii, z níž se vyklubal skokový bod do dosud neznámé soustavy Oso; stalo se tak v roce 2861. Odměnu od vlády Spojeného impéria Země (UEE) použil na koupi domu na Terře a na založení účetní poradenské firmy."
  zdroje:
    - nazev: "Errol Navis"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/bZkAvg8BPE-errol-navis
  kapitoly: []

- id: "corbyn-salehi"
  jmeno: "Corbyn Salehi"
  narozeni: "2829"
  umrti: "2922"
  role: "imperátor UEE (2871–2881), zakladatel projektu Synthworld"
  kategorie: "vladari"
  medailonek: "Corbyn Salehi byl imperátorem Spojeného impéria Země (UEE) v letech 2871 až 2881. Zvolen byl se slibem otevřené vlády a konce korupce: nechal odtajnit tisíce dokumentů, podporoval vyšetřování Advokacie proti úředníkům obviněným z pochybení a rozšířil definici chráněné planety podle zákona Fair Chance. Jeho nejtrvalejším odkazem je založení projektu Archangel, známého také jako Synthworld. Po skončení mandátu projekt řídil jako ředitel a zemřel v roce 2922 na komplikace spojené s umělou slinivkou."
  zdroje:
    - nazev: "Corbyn Salehi"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RL65p7Qpdr-corbyn-salehi
  kapitoly: [kap-9]

- id: "magda-hurston"
  jmeno: "Magda Hurston"
  narozeni: "2833"
  umrti: "2921"
  role: "výkonná ředitelka Hurston Dynamics (2883–2915)"
  kategorie: "korporace"
  medailonek: "Magda Hurston se narodila v roce 2833 na planetě Rytif (Bremen II) jako nejstarší dítě Chesterfielda Hurstona, vystudovala organizační a sociální psychologii v Ženevě a v roce 2856 nastoupila do rodinné firmy Hurston Dynamics. Jako provozní ředitelka v roce 2865 prosadila koupi planety Stanton I a jejích čtyř měsíců od Spojeného impéria Země (UEE), díky níž mohla firma vyrábět zbraně mimo přísné zákony UEE; tak vznikla planeta Hurston. Dohlížela na stavbu prvních obytných domů pro dělníky a na rychlé a levné budování města Lorville, založeného v roce 2877. V letech 2883 až 2915 vedla firmu jako výkonná ředitelka, prodloužila pracovní dobu zaměstnancům se smlouvami Life/Labor, rozšířila těžbu a zpracování antihmoty a podepsala s armádou rekordně výnosnou smlouvu na antihmotové hlavice. Ve vedení ji vystřídal syn Gavin a v roce 2921 zahynula spolu se šesti dalšími lidmi při srážce dvou raketoplánů."
  zdroje:
    - nazev: "Magda Hurston"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/V7gMKmw6wa-magda-hurston
  kapitoly: [kap-9]

- id: "dyna-lei"
  jmeno: "Dyna Lei"
  narozeni: "2833"
  umrti: "2941"
  role: "módní návrhářka, zakladatelka značky Dyna Lei"
  kategorie: "kultura"
  medailonek: "Dyna Lei se narodila v roce 2833 v rodině textilních dělníků a v šestnácti letech ji díky silnému portfoliu přijali jako učednici krejčího ke značce LaVenti. O tři roky později začala přes Spectrum prodávat oblečení vlastního návrhu a ze zisku si otevřela malý módní butik v Prime na Terře. Zlom přišel v roce 2857, kdy si jednu z jejích rób oblékla na předávání hudebních cen Elira hvězda Aris Achrekar, a její podnik se prudce rozrostl. Navrhovala až do své smrti v roce 2941; jedny z jejích posledních šatů, inspirované barvami planety Kiel IV, měla v roce 2939 na sobě senátorka Janna Thurville na galavečeru Green Gala, který pořádala Imperiální nadace umění."
  zdroje:
    - nazev: "Dyna Lei"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/bo1LkZwmX7-dyna-lei
  kapitoly: []

- id: "sylvie-randall"
  jmeno: "Sylvie Randall"
  narozeni: "2835"
  umrti: "2884"
  role: "velitelka 89. letky („Ztracené letky“)"
  kategorie: "armada"
  medailonek: "Velitelka Sylvie Randall byla důstojnicí námořnictva Spojeného impéria Země (UEE) a poslední velitelkou 89. logistické podpůrné letky, které se později začalo říkat Ztracená letka. Velení převzala v roce 2878 a po celou dobu žádala námořnictvo o víc peněz a zásob; prostředky, které se jí podařilo sehnat, dávala do oprav systému včasného varování v soustavě Caliban. Jejím posledním rozkazem bylo, aby letka bránila a evakuovala civilní obyvatelstvo Calibanu. Zahynula spolu se svou letkou při pádu Calibanu v roce 2884."
  zdroje:
    - nazev: "Sylvie Randall"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/V3qgj86Wz2-sylvie-randall
  kapitoly: [kap-9, letka]

- id: "theresa-branaugh"
  jmeno: "Theresa Branaugh"
  narozeni: "2835"
  umrti: "2873?"
  role: "geoložka a průzkumnice, neoficiální objevitelka soustavy Branaugh"
  kategorie: "objevitele"
  medailonek: "Theresa Branaugh byla geoložka, zeměměřička a průzkumnice, která veškerý čas zasvětila snu objevit novou planetární soustavu. Výpravy financovala půjčkami od lichvářů, před nimiž v době splatnosti občas utíkala do jiných soustav. V roce 2873 ji přátelé nahlásili jako pohřešovanou, když se nevrátila z výpravy do soustavy Chronos. O čtyři roky později našel průzkumník Desmond Fell její tělo v odlehlé jeskyni na planetě Branaugh II poblíž trosek její lodi; Advokacie vraha neodhalila, ale zjistila, že loď sestřelil někdo, kdo tu oblast používal jako úkryt. Fell soustavu na její počest pojmenoval Branaugh, a proto se o ní mluví jako o neoficiální objevitelce."
  zdroje:
    - nazev: "Theresa Branaugh"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VpMeGzBPyz-theresa-branaugh
  kapitoly: []

- id: "desmond-fell"
  jmeno: "Desmond Fell"
  narozeni: "2846"
  umrti: "2933"
  role: "průzkumník a navjumper, objevitel soustavy Branaugh"
  kategorie: "objevitele"
  medailonek: "Desmond Fell vystudoval Univerzitu Lo v New Junction (ULON), kde získal dvojí titul z geotechnologie a politického diskurzu, aby si splnil celoživotní sen objevit planetární soustavu. Po studiích pracoval jako zeměměřič pro LFR Mineral Group a v roce 2876 si z výdělků koupil loď Aurora. Při návštěvě soustavy Chronos, kam se jel podívat na Synthworld, zachytil anomálii, která ho dovedla k nezaznamenanému skokovému bodu. Na druhé straně našel v roce 2877 nejen novou soustavu, ale i tělo průzkumnice Theresy Branaugh, pohřešované čtyři roky. Objev nahlásil vládě Spojeného impéria Země (UEE) a soustavu pojmenoval na její počest."
  zdroje:
    - nazev: "Desmond Fell"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RX3dlQ5KON-desmond-fell
  kapitoly: []

- id: "neville-lott"
  jmeno: "Neville Lott"
  narozeni: "2851"
  umrti: "2917"
  role: "sériový vrah"
  kategorie: "zlocin"
  medailonek: "Neville Lott byl sériový vrah, který v 80. letech 29. století v pohoří Tecuya v oblasti Vastac na Terře ulovil, zajal a rozřezal sedm turistů. Při pádu Calibanu v roce 2884 přišel o dvojče i rodiče, těžce popálený byl evakuován na Terru a během léčby se u něj projevilo hluboké psychické trauma. Krátce po propuštění z nemocnice zmizel a nikdo o něm neslyšel, dokud nezačali mizet turisté: přidával se k nim na stezkách a v noci se vracel k jejich tábořišti v masce sešité z pytloviny. Advokacie ho dopadla v roce 2891; u soudu odmítl hájit se nepříčetností, byl odsouzen bez obhajoby a v roce 2917 zemřel ve vězení. Paula Qi v knize Unspeakable Evil předložila svědectví, že vražedné sklony projevoval už před Calibanem, a kritizovala dramatizace, podle nichž z něj vraha udělaly až tamní události."
  zdroje:
    - nazev: "Neville Lott"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VlMgQm7qqM-neville-lott
  kapitoly: []

- id: "joona-tzur"
  jmeno: "Joona Tzur"
  narozeni: "2852"
  umrti: "žije"
  role: "bývalý guvernér planety Severus"
  kategorie: "politika"
  medailonek: "Joona Tzur byl v roce 2903 zvolen guvernérem planety Severus (Kiel III) a zavedl program na oživení její ekonomiky: opuštěnou vojenskou infrastrukturu prodával firmám, které hledaly levné pozemky. Strategie se vyplatila, nabídky využila řada leteckých a kosmických společností a Tzur peníze investoval do zeleně a veřejných prostranství, čímž vytvořil pracovní místa a zvelebil dříve zpustlou krajinu. Díky jeho úsilí se v roce 2913 rozhodla správní rada veletrhu Intergalactic Aerospace Expo natrvalo usídlit na Severu. Funkční období mu skončilo v roce 2915; jeho nejstarší dcerou je senátorka Janna Thurville."
  zdroje:
    - nazev: "Joona Tzur"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RkGaY322MQ-joona-tzur
    - nazev: "Janna Thurville"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/Var8a27eW2-janna-thurville
  kapitoly: []

- id: "kelos-costigan"
  jmeno: "Kelos Costigan"
  narozeni: "2855"
  umrti: "žije"
  role: "imperátor UEE (2941–2950)"
  kategorie: "vladari"
  medailonek: "Kelos Costigan byl imperátorem Spojeného impéria Země (UEE) v letech 2941 až 2950. Než vstoupil do politiky, obchodoval s komoditami; později byl vrchním tajemníkem ve dvou vládách. V roce 2930 neuspěl v kandidatuře na imperátora, ale v roce 2940 zvítězil jako kandidát Univerzalistické strany. Za jeho vlády byla přijata obchodní iniciativa mezi lidmi a Xi’any (HuXa) a planeta Aremis (Vega II) byla uznána za součást impéria. Jeho nejstarším synem je podnikatel a politik Titus Costigan."
  zdroje:
