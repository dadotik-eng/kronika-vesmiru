  kapitoly: []

- id: "tamsa-wheel"
  jmeno: "Tamsa Wheel"
  narozeni: "2883"
  umrti: "žije"
  role: "výtvarnice a sochařka"
  kategorie: "kultura"
  medailonek: "Tamsa Wheel je výtvarnice známá velkými interpretačními sochami z nečekaných kombinací materiálů. Podle kritika Herina Chibera její tvorba zachycuje „křehkou rovnováhu mezi matematickou přesností a nespoutaným chaosem vesmíru“. Banuský průzkumník Kofi Baféuma byl jejím dílem tak nadšený, že po ní v roce 2943 pojmenoval planetární soustavu Tamsa."
