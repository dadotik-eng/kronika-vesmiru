  kapitoly: []

- id: "marshall-leon"
  jmeno: "Marshall Leon"
  narozeni: "2753"
  umrti: "2891"
  role: "imperátor UEE (2801–2811), tvůrce Archy"
  kategorie: "vladari"
  medailonek: "Marshall Leon začal v roce 2774 pracovat v sociálních službách a vypracoval se až do Rady guvernérů planety Reisse (Rhetor III). V letech 2787 až 2793 byl senátorem a poté do roku 2800 diplomatickým tajemníkem UEE ve vládě imperátorky Erin Toi; v této funkci přišel s myšlenkou Archy a v roce 2794 pro její stavbu získal souhlas Senátu. Toi ho díky jeho diplomatickým úspěchům a práci na Arše podpořila v kampani a v letech 2801 až 2811 zastával úřad imperátora Spojeného impéria Země (UEE). Hned v prvním roce úřadu se zúčastnil slavnostního otevření Archy. Po skončení mandátu zasedal až do své smrti ve správní radě Archy."
  zdroje:
    - nazev: "Marshall Leon"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/bZwQBJmZxE-marshall-leon
