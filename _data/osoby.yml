- id: "scott-childress"
  jmeno: "Scott Childress"
  narozeni: "2032"
  umrti: "2121"
  role: "hlavní inženýr RSI, tvůrce kvantového pohonu"
  kategorie: "veda-technika"
  medailonek: "Doktor Scott Childress vedl jako hlavní inženýr tým vědců společnosti Roberts Space Industries (RSI), který v roce 2075 sestrojil první kvantový pohon vyrobený lidmi. Do RSI se dostal hned po absolvování Fairchildova institutu vědy a technologie v roce 2061, protože jeho disertace o konstrukci motorů pro rychlé kosmické lodě zaujala zakladatele firmy Chrise Robertse. Kvantové jádro RSI umožňovalo let rychlostí jedné setiny rychlosti světla. Otevřelo tak novou éru průzkumu Sluneční soustavy a obecně se považuje za základ, na kterém lidstvo později postavilo svou cestu ke hvězdám."
  zdroje:
    - nazev: "Scott Childress"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/R5p68KXk5X-scott-childress
  kapitoly: [kap-1]

- id: "michelle-saleno"
  jmeno: "Michelle Saleno"
  narozeni: "2096"
  umrti: "neznámo"
  role: "zkušební pilotka, zakladatelka 999. zkušební letky"
  kategorie: "armada"
  medailonek: "Michelle „Sal“ Saleno se naučila létat ve čtrnácti letech od rodičů, kteří s malým zemědělským letadlem prováděli postřiky polí, a v osmnácti nastoupila do pilotního výcviku námořnictva Amecania. Jako zkušební pilotka v roce 2128 jako první člověk doletěla kvantovým pohonem za oběžnou dráhu Jupiteru. Když se v roce 2136 při prvním zkušebním letu rozpadl prototyp lodi Zeus, obrátila se na ni společnost RSI a Saleno prosadila vznik 999. zkušební letky. Její připomínky vedly k úplnému přepracování trupu, takže Zeus mohl v roce 2140 vstoupit na trh jako první civilní loď s kvantovým pohonem. Z námořnictva odešla v roce 2156 a začala učit na letecké škole pro děti z chudých poměrů."
  zdroje:
    - nazev: "Michelle Saleno"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/bZkLx7GxXO-michelle-saleno
  kapitoly: [kap-1]

- id: "abeni-okon"
  jmeno: "Abeni Okon"
  narozeni: "2157"
  umrti: "2252"
  role: "první člověk narozený mimo Zemi"
  kategorie: "kultura"
  medailonek: "Abeni Okon přišla na svět na Marsu jako vůbec první člověk narozený na jiné planetě než na Zemi; její rodiče Kinah a Madu Okonovi patřili k prvním kolonistům. Média z ní udělala symbol lidské vynalézavosti a vytrvalosti, mimo jiné proto, že první pokus o terraformaci Marsu v roce 2125 skončil katastrofou. V mládí si slávu užívala, rozhazovala a špatně investovala, ale na konci svých dvacátých let se bez vysvětlení stáhla z veřejného života a věnovala se komunitní práci tam, kde bylo pomoci nejvíc zapotřebí. Naposledy se veřejně ukázala v roce 2232 jako čestný host při vypuštění kolonizační lodi Artemis. Zemřela přirozenou smrtí v roce 2252, je pochována na Marsu a její narozeniny 18. března se slaví jako lidský svátek."
  zdroje:
    - nazev: "Abeni Okon"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/Rz2DPeZZnk-abeni-okon
  kapitoly: [kap-1]

- id: "nick-croshaw"
  jmeno: "Nick Croshaw"
  narozeni: "2236"
  umrti: "2321"
  role: "astrofyzik a pilot, první člověk, který prošel skokovým bodem"
  kategorie: "objevitele"
  medailonek: "Astrofyzik a pilot Nick Croshaw se 10. dubna 2271 zapsal do dějin jako první člověk, který objevil skokový bod a úspěšně jím proletěl. Léta předtím zkoumal Neso trojúhelník, oblast poblíž Neptunu, kde beze stopy mizely lodě, a dospěl k závěru, že za zmizeními stojí dosud neznámý druh vesmírné anomálie. Na sólovou výpravu se vydal s kvantovým pohonem, který si sám upravil. Stal se tak také prvním člověkem, který navštívil jinou planetární soustavu než Sluneční; ta později dostala jméno Croshaw. Jeho skok zahájil novou éru lidského průzkumu a kolonizace."
  zdroje:
    - nazev: "Nick Croshaw"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VyvYkAr7YW-nick-croshaw
  kapitoly: [kap-2]

- id: "liston-garrity"
  jmeno: "Liston Garrity"
  narozeni: "2248"
  umrti: "2317"
  role: "konstruktér zbraní, zakladatel Garrity Arms"
  kategorie: "korporace"
  medailonek: "Liston Garrity byl konstruktér zbraní, který na konci 23. století založil zbrojařskou firmu Garrity Arms. Narodil se na Zemi a úspěch jeho řady spalovacích pistolí Tedge mu umožnil přestěhovat se do rozvíjející se kolonie na Marsu. Za svůj život navrhl čtrnáct různých zbraní. Jeho příjmení se pod licencí používá jako značka zbraní dodnes."
  zdroje:
    - nazev: "Liston Garrity"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RxnPNwAW4M-liston-garrity
  kapitoly: []

- id: "antoine-lebec"
  jmeno: "Antoine Lebec"
  narozeni: "2258"
  umrti: "2307?"
  role: "navjumper, objevitel soustavy Nul"
  kategorie: "objevitele"
  medailonek: "Antoine Lebec se narodil na Zemi a k průzkumu ho přivedl objev soustavy Croshaw v roce 2271. Pilotní výcvik dokončil v roce 2277, ale vlastní loď si mohl koupit až v roce 2282, kdy v loterii vyhrál pozemek s těžebními právy na planetě Angeli (Croshaw II), pod kterým ležela přírodní žíla mědi. V roce 2290 objevil soustavu Nul; nahlásil, že při první návštěvě našel „nul“, a podle toho dostala soustava své jméno. V roce 2307 zmizel při průzkumu okrajových oblastí Nulu a historici se domnívají, že mohl zahynout při pokusu proletět skokovým bodem do Calibanu, který byl objeven až později."
  zdroje:
    - nazev: "Antoine Lebec"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/0ODddzO7Dq-antoine-lebec
  kapitoly: []

- id: "adaliz-dayan"
  jmeno: "Adaliz Dayan"
  narozeni: "2279"
  umrti: "2317?"
  role: "terraformační inženýrka, objevitelka soustavy Banshee"
  kategorie: "objevitele"
  medailonek: "Adaliz Dayan pracovala jako inženýrka na terraformaci planety Hyperion (Fora III) a založila Immramskou asociaci, spolek, který mezi terraformačními úkoly prozkoumával okolní prostor. Za nezvyklých okolností zmizela, když zkoumala kapsu radiace. Při pátrání po její lodi se ukázalo, že radiace označuje skokový bod do dosud neznámé soustavy. Předpokládá se, že jím Dayan proletěla, ale nikdy ji nenašli. Soustava dostala jméno Banshee podle přezdívky, kterou si vysloužila při hraní sataballu na vysoké škole."
  zdroje:
    - nazev: "Adaliz Dayan"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/Vgg7Ml89dN-adaliz-dayan
  kapitoly: []

- id: "neal-socolovich"
  jmeno: "Neal Socolovich"
  narozeni: "2373"
  umrti: "2474"
  role: "generál armády UNE, vyjednavač míru s Banu"
  kategorie: "armada"
  medailonek: "Neal Socolovich se narodil na planetě Angeli (Croshaw II) a v roce 2390 vstoupil do armády Spojených národů Země (UNE). Generálem se stal v roce 2415 po dvou nasazeních v soustavě Banshee, kde proslul schopností urovnávat spory s psanci bez jediného výstřelu. Od roku 2430 velel v nově objevené soustavě Davien a historici mu připisují zásluhu na tom, že první setkání lidstva s Banu v roce 2438 proběhlo mírově. Byl klíčovou postavou jednání o mírové a obchodní dohodě s Banu, první mezidruhové smlouvě v lidských dějinách. Po odchodu do výslužby v roce 2441 koupil pozemek na rodné planetě, začal vyrábět víno a zemřel v roce 2474."
  zdroje:
    - nazev: "Neal Socolovich"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VJX7vxG2BG-neal-socolovich
