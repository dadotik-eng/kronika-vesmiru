- id: "suj-kossi"
  jmeno: "Suj Kossi"
  narozeni: "2900"
  umrti: "žije"
  role: "první tevarinský senátor (za Jalan)"
  kategorie: "xiani-tevarini"
  medailonek: "Suj Kossi se v roce 2946 stal prvním Tevarinem, který získal senátorský mandát, když zvítězil ve volbách za planetu Jalan. Narodil se v roce 2900 u města Gemma v rodině profesionálních lupičů a od deseti let se účastnil jejich nájezdů; když v roce 2919 při přepadení vodní farmy u Nedily zahynula jeho nejstarší sestra i tři farmáři a ukázalo se, že nebylo co ukrást, utekl z domova a vstoupil do armády UEE. Později přešel k námořnictvu jako pilot a v roce 2928 při vanduulském nájezdu v soustavě Oberon zaštítil vlastní lodí tři techniky před nepřátelskou palbou; za těžká zranění, která ukončila jeho vojenskou kariéru, dostal občanství, Medaili za statečnost a čestné propuštění. Jako zastánce nájemníků se v roce 2937 dostal do městské rady Gemmy, prosadil regulaci nájemného a v roce 2946 kandidoval za Univerzalistickou stranu do Senátu, přičemž kampaň na týden přerušil, aby se po bitvě o Vegu II hlásil u námořních záloh. V Senátu spolupracuje s imperátorkou Laylani Addison na programech pro zapojení Tevarinů do veřejné sféry a v roce 2951 byl znovu zvolen."
  rozpor: "Článek o Kossim označuje Jalan za Elysium III, článek o Corath'Thalovi (a odkaz v Kossiho článku) za Elysium IV."
