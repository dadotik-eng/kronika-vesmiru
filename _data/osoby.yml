- id: "mira-ngo"
  jmeno: "Mira Ngo"
  narozeni: "2891"
  umrti: "žije"
  role: "senátorka za Terru"
  kategorie: "politika"
  medailonek: "Mira Ngo je od roku 2936 senátorkou za Terru a nejmladším člověkem, který byl kdy zvolen do Senátu Spojeného impéria Země (UEE). Pochází z rodiny senátorů už ve třetí generaci a dlouhodobě prosazuje politiku Tranzicionalistické strany, například přesun hlavního města UEE ze Země na Terru. Dne 10. října 2949, kdy oznámila kandidaturu na imperátorku, jí někdo vykradl dům a brzy nato unikly osobní dokumenty odhalující vazby rodiny Ngo na několik soukromých stavebních firem na Terře. Přesto se v roce 2950 dostala mezi pět finálních kandidátů; slibovala obnovu historických budov na Zemi, změnu financování Synthworldu i války s Vanduuly a mírnější tresty za nenásilné trestné činy."
  zdroje:
    - nazev: "Mira Ngo"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RWoa1mlWdp-mira-ngo
  kapitoly: []

- id: "janna-thurville"
  jmeno: "Janna Thurville"
  narozeni: "2895"
  umrti: "žije"
  role: "senátorka za Severus"
  kategorie: "politika"
  medailonek: "Janna Thurville je nejstarší dcerou bývalého guvernéra planety Severus (Kiel III) Joony Tzura a koncertní klavíristky Xin Yi Tzur. Když byl Severus v roce 2937 uznán, stala se spolu s centralistou Hideo Utem jednou z jeho prvních senátorů. Je členkou Tranzicionalistické strany, podporuje decentralizaci vládní moci a její přenesení na ekonomicky nejúspěšnější planety UEE, prosazuje vyšší výdaje na vzdělání a umění a staví se proti přehnaným výdajům na armádu. V roce 2939 přišla na galavečer Green Gala Imperiální nadace umění v šatech od Dyny Lei, inspirovaných barvami planety Kiel IV."
