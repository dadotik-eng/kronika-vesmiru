      typ: Comm-Link
      url: https://robertsspaceindustries.com/en/comm-link/spectrum-dispatch/12690-2438-Hello
  kapitoly: [kap-3]

- id: "ai-se-choan"
  jmeno: "Āi se Cho'an"
  narozeni: "2386"
  umrti: "2577?"
  role: "xi’anská navjumperka, objevitelka soustavy Yā'mon"
  kategorie: "xiani-tevarini"
  medailonek: "Āi se Cho'an pocházela z xi’anského rodu, který se specializoval na navigaci skokových bodů, a navigačnímu řemeslu se učila od dětství. Po dokončení xi’anské civilní služby v roce 2477 začala hledat nové skokové body. Za objev soustavy Yā'mon v roce 2529 získala ve věku pouhých 111 let (podle xi’anského kalendáře) postavení matriarchy. V roce 2577 zmizela při cestě soustavou T.āl; historici rodu Cho'an se domnívají, že zahynula při průletu dosud neobjeveným skokovým bodem. Rod proto zavedl pro své členy jako přechodový rituál roční pobyt v soustavě T.āl v naději, že najdou to, na co kdysi narazila ona."
  zdroje:
    - nazev: "Āi se Cho'an"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/Rw1r27OoJJ-aai-se-choan
  kapitoly: []

- id: "micah-zahir"
  jmeno: "Micah Zahir"
  narozeni: "2460"
  umrti: "2577"
  role: "nezávislý průzkumník surovin, objevitel soustavy Oretani"
  kategorie: "objevitele"
  medailonek: "Micah Zahir se narodil na planetě Vann (Croshaw III) a v roce 2480 se přestěhoval na Asuru (Ferron III), kde chtěl pracovat jako operátor těžebních skenerů. Práci nesehnal, a tak se dal najmout jako doprovod zásobovacích konvojů. Na jedné z cest zachytil zvláštní signál, později se na místo vrátil sám a v roce 2481 objevil skokový bod do soustavy Oretani, kterou pojmenoval po své oblíbené lodi z filmu Blast Crater z roku 2464. Odměnu od Spojených národů Země (UNE) investoval do nemovitostí na Seleně (Vega III) a v době své smrti v roce 2577 patřil k největším vlastníkům půdy v soustavě Vega."
  zdroje:
    - nazev: "Micah Zahir"
      typ: Galactapedie
