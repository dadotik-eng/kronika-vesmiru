  role: "hudebník"
  kategorie: "kultura"
  medailonek: "Sindo Guerrero je hudebník, který spojuje flamenco s psychedelií; nejvíc ho proslavila píseň „Sun Kissed“. Jako dítě o hudbu nejevil zájem, ale v pozdním dospívání se stal zpěvákem kapely svých přátel a dalších pět let s nimi vystupoval a učil se hrát na kytaru a klávesy. Když se rodiče přestěhovali do soustavy Ellis, rozjel sólovou dráhu a jeho první hit „Outsider Again, I...“ se dostal do první desítky hitparády New United. Na rodinném výletě do soustavy T.āl v roce 2929 ho žlutě zbarvená architektura planety Oil'xa (T.āl II) inspirovala k písni „Sun Kissed“, která se stala rekordní jedničkou. V roce 2937, po téměř dvou letech nepřetržitého turné a po skončení desetileté smlouvy, přestal koncertovat s tím, že vydělal dost na celý život; od té doby jen spolupracuje s jinými hudebníky."
  zdroje:
    - nazev: "Sindo Guerrero"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/01LNooPKYr-sindo-guerrero
  kapitoly: []

- id: "titus-costigan"
  jmeno: "Titus Costigan"
  narozeni: "2909"
  umrti: "žije"
  role: "ředitel Esrua Industries, kandidát na imperátora"
  kategorie: "politika"
  medailonek: "Titus Costigan je výkonným ředitelem firmy Esrua Industries, ředitelem neziskové nadace Better Together Foundation a nejstarším synem bývalého imperátora Kelose Costigana. V roce 2950 se jako kandidát Univerzalistické strany dostal mezi pět finálních kandidátů na úřad imperátora Spojeného impéria Země (UEE). Sliboval oživit ekonomiku uvolněním regulací pro podniky, zvýšit financování Iniciativy pro mobilizaci milic a zprůhlednit, jak se utrácejí peníze na Synthworld. Před finálním hlasováním se objevilo několik útočných reklam neznámého původu, které ho spojovaly s drogovým syndikátem působícím v několika soustavách, a jeho kampaň na ně odmítla reagovat."
  zdroje:
    - nazev: "Titus Costigan"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VDz7Be7E33-titus-costigan
  kapitoly: []

- id: "ellroy-cass"
  jmeno: "Ellroy Cass"
  narozeni: "2919"
  umrti: "žije"
  role: "umělec a celebrita"
  kategorie: "kultura"
  medailonek: "Ellroy Cass je umělec, herec, tanečník, hudebník a celebrita, známý svými monumentálními díly, která spojují zvuk, obraz a živé vystoupení. Bulvár o něm pravidelně píše kvůli velkým večírkům, problémům s návykovými látkami, extravagantním uměleckým kouskům, okázalým nákupům a bouřlivému chování. V roce 2944 zemřel herec Jared Yildiz na předávkování drogou Neon, kterou údajně získal na palubě Cassovy lodi Constellation Phoenix. Cass byl už tehdy pod drobnohledem kvůli nedávnému pobytu na odvykací léčbě a zvýšená pozornost médií vyústila v jeho veřejné zhroucení, při němž se pokusil zapálit svůj rekreační dům na planetě Tangaroa (Helios II)."
  zdroje:
    - nazev: "Ellroy Cass"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RegZ7z96Gy-ellroy-cass
  kapitoly: []

- id: "selma-tontil"
  jmeno: "Selma Tontil"
  narozeni: "neznámo"
  umrti: "neznámo"
  role: "právnička, spoluzakladatelka a ředitelka firmy Tarsus"
  kategorie: "korporace"
  medailonek: "Selma Tontil byla povoláním právnička a sama patřila mezi navjumpery. Když Tara a Alfon v roce 2292 úspěšně vyzkoušeli modul Tarsus, který dokázal přeměnit běžný kvantový pohon na skokový, poradila jim, aby si vynález urychleně nechali patentovat, a s její pomocí vznikla společnost Tarsus. Úprava stála jen zlomek ceny skokového pohonu RSI, a když firmu RSI zažalovala, Tontil právo na úpravy pohonů úspěšně obhájila. Později od obou vynálezců odkoupila jejich kontrolní podíly a jako ředitelka rozšířila výrobu i o oblíbenou řadu kvantových pohonů."
  zdroje:
