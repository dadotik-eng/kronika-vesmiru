    - nazev: "Deacon Messer II"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/0j46m4BYge-deacon-messer-ii
  kapitoly: [kap-5, kap-6]

- id: "adam-corr"
  jmeno: "Adam Corr"
  narozeni: "2519"
  umrti: "neznámo"
  role: "veterán armády UPE, podezřelý z atentátů roku 2546"
  kategorie: "zlocin"
  medailonek: "Adam Corr byl veterán armády Spojených planet Země (UPE), který jako četař bojoval v bitvě o Idris IV pod velením Ivara Messera I. a z armády odešel s čestným propuštěním. Později byl označen za jednoho ze dvou mužů, kteří údajně na Messerův rozkaz provedli v roce 2546 sérii bombových útoků v UPE. Jako specialista na infiltraci zaplatil jen pár dní před prvními výbuchy kauci za odborníka na trhaviny Cyruse Ishitaku, který seděl ve vězení na planetě Cestulus (Davien II). Co se s Correm stalo potom, není známo."
  zdroje:
    - nazev: "Adam Corr"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/V3qgyvG8ZY-adam-corr
  kapitoly: [kap-5]

- id: "cyrus-ishitaka"
  jmeno: "Cyrus Ishitaka"
  narozeni: "2521"
  umrti: "2546"
  role: "veterán armády UPE, podezřelý z atentátů roku 2546"
  kategorie: "zlocin"
  medailonek: "Cyrus Ishitaka byl veterán armády Spojených planet Země (UPE) v hodnosti desátníka a spolubojovník Ivara Messera I. z bitvy o Idris IV. O jeho soukromém životě se ví málo, kromě opakovaného zatčení za držení a distribuci drog. Jako armádní expert na trhaviny byl později podezírán, že spolu s Adamem Correm provedl na Messerův rozkaz sérii bombových útoků v roce 2546. Pobýval na čtyřech z pěti zasažených planet a necelý týden po posledním útoku ho našli mrtvého; pitva mu pod nehty odhalila stopy chemikálie použité při útocích."
  zdroje:
    - nazev: "Cyrus Ishitaka"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/R4ZGy5XJXe-cyrus-ishitaka
  kapitoly: [kap-5]

- id: "eli-price"
  jmeno: "Eli Price"
  narozeni: "2560"
  umrti: "2663"
  role: "poručík námořnictva UEE, objevitel skokového bodu Oya–Castra"
  kategorie: "objevitele"
  medailonek: "Eli Price byl poručíkem námořnictva Spojeného impéria Země (UEE) a později právníkem; oficiálně je veden jako objevitel skokového bodu mezi soustavami Oya a Castra z roku 2587. Při pátrání po psancích, kteří přepadali nákladní lodě v Castře, hlídal místo, kam ukládali kořist, a podle svých deníků viděl, jak se odnikud vynořila loď a zboží odvezla. Tajně ji sledoval až k neznámému skokovému bodu a na druhé straně z odposlechu zjistil, že jde o skupinu lidských separatistů, kteří přepadali lodě jen tehdy, když potřebovali zásoby. Přes vnitřní rozpory objev nahlásil; námořnictvo vyslalo úderné jednotky, a když se psanci pokusili uprchnout, jejich lodě zničilo. Price se s pocitem viny nevyrovnal, v roce 2591 odešel z armády a po studiu práv působil až do konce kariéry jako obhájce."
  zdroje:
    - nazev: "Eli Price"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/bo1wkzJE41-eli-price
  kapitoly: []

- id: "leonard-casse"
  jmeno: "Leonard Casse"
  narozeni: "2563"
  umrti: "2615"
  role: "konstruktér lodí, zakladatel Casse Aerospace"
  kategorie: "veda-technika"
  medailonek: "Leonard Casse začínal v roce 2587 jako mladší inženýr u Roberts Space Industries v týmu transportní lodi Starbright, kde ho povýšili poté, co odhalil potenciálně nebezpečnou chybu v jejím návrhu. V roce 2595 už vedl návrh modelu Starbright 2600, který sklidil chválu za vstupní systém a ovládání. V roce 2599 odešel z RSI, protože mu nevyhovovala hierarchická struktura, a založil Casse Aerospace, kde měl názor každého stejnou váhu. Stihl vytvořit jen dvě lodě, Cosmo Sloop a stíhačku Hurricane, než v roce 2615 zahynul při srážce za letu. Jeho rukopis se znovu proslavil v 80. letech 28. století díky J. Harrisi Arnoldovi z Anvil Aerospace a v roce 2902 byl Casse uveden do Síně slávy Edlesonova institutu designu."
  zdroje:
    - nazev: "Leonard Casse"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RX3Krj1EKN-leonard-casse
  kapitoly: []

- id: "deacon-messer-ii"
  jmeno: "Deacon Messer II."
  narozeni: "2567"
  umrti: "2661"
  role: "imperátor UEE (2592–2628)"
  kategorie: "vladari"
  rod: "messer"
  medailonek: "Deacon Messer II., jediný syn Ivara I. a Delie Hassan, vládl jako imperátor Spojeného impéria Země (UEE) v letech 2592 až 2628. Za jeho vlády proběhla druhá tevarinská válka (2603–2610); zvýšil výdaje na armádu, rozšířil pravomoci Advokacie a zpřísnil minimální tresty, zároveň však podpořil průzkum a terraformaci, zvýšil daně bohatým a snížil je chudým a střední třídě. V roce 2628 dobrovolně předal vládu dceři Livii III. a zůstal jejím poradcem až do smrti vnuka Mariuse IV. v roce 2641. V roce 2643 se spolu s Livií zcela stáhl z veřejného života a přerušil styky se synem Corsenem V., s vnoučaty si však blízký vztah udržel až do své smrti v roce 2661."
  rozpor: "Článek o Ivarovi Messerovi I. uvádí, že se Ivar oženil s Delií Hassan v roce 2571 a syna Deacona měl „krátce poté“; podle článku o Deaconovi se však Deacon narodil už v roce 2567."
  zdroje:
    - nazev: "Deacon Messer II"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/0j46m4BYge-deacon-messer-ii
    - nazev: "Ivar Messer I"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RXlXYPWk8q-ivar-messer-i
  kapitoly: [kap-6]

- id: "assan-kieren"
  jmeno: "Assan Kieren"
  narozeni: "2584"
  umrti: "2639?"
  role: "guvernér Terry, zastánce odtržení od UEE"
  kategorie: "politika"
  medailonek: "Assan Kieren byl politik zastupující Terru, který se veřejně stavěl proti militaristickému kurzu Spojeného impéria Země (UEE). Guvernérem Terry byl zvolen v roce 2633. V roce 2638 se proslavil v celém impériu, když vyzval, aby Terra uspořádala hlasování o suverenitě, které by jí umožnilo od UEE odejít. Messerovská propaganda se ho snažila zdiskreditovat, referendum neprošlo a vzniklý skandál ukončil jeho politickou kariéru. Následující listopad za dosud nevyjasněných okolností zmizel."
  zdroje:
    - nazev: "Assan Kieren"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RWwZQK774P-assan-kieren
  kapitoly: [kap-6]

- id: "livia-messer-iii"
  jmeno: "Livia Messer III."
  narozeni: "2593"
  umrti: "2661"
  role: "imperátorka UEE (2628–2643)"
  kategorie: "vladari"
  rod: "messer"
  medailonek: "Livia Messer III. vládla Spojenému impériu Země (UEE) v letech 2628 až 2643 poté, co jí otec Deacon II. dobrovolně přenechal úřad. Navázala na jeho právní reformy: zvýšila horní hranice trestů a změnila definici věznic, což jí umožnilo zřídit politické věznice na planetě Charon III. Posílila také vládní dohled nad médii, čímž fakticky vznikl neoficiální úřad propagandy, a z bezpečnostních důvodů omezila cestování. V roce 2641 přežila havárii raketoplánu nad Moskvou, při níž zahynuli její manžel Daniel Scota a syn Marius. V roce 2643 odešla z úřadu, synovi udělila čestný titul Marius IV. a v roce 2661 zemřela ve spánku, měsíc před svým otcem."
  zdroje:
    - nazev: "Livia Messer III"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/01dWwaQkrL-livia-messer-iii
  kapitoly: [kap-6]

- id: "carl-dyson"
  jmeno: "Carl Dyson"
  narozeni: "2593"
  umrti: "2701"
  role: "střelec námořnictva UEE a hudebník"
  kategorie: "objevitele"
  medailonek: "Carl Dyson sloužil jako střelec v hodnosti poručíka v námořnictvu Spojeného impéria Země (UEE). V roce 2617 zachytil při hlídce v soustavě Horus se svým pilotem Ahmadem Hararem gravitační anomálii, kterou palubní počítač vyhodnotil jako pravděpodobný skokový bod. Chtěl objev nahlásit veliteli, ale Harar ho přemluvil, aby jím nejdřív proletěli; na druhé straně je okamžitě zneškodnila xi’anská armáda a tři dny je vyslýchala. Nakonec je propustili zpět do Horu se vzkazem, že každá loď UEE spatřená v soustavě Kai'pua bude bez varování sestřelena. Dyson místo degradace požádal o čestné propuštění, odstěhoval se na Zemi a stal se hudebníkem; jeho album Twilight on the Firing Line získalo dvě ceny Elira."
  zdroje:
    - nazev: "Carl Dyson"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/R5p2mqLvXN-carl-dyson
  kapitoly: []

- id: "ahmad-harar"
  jmeno: "Ahmad Harar"
  narozeni: "2595"
  umrti: "2699"
  role: "pilot námořnictva UEE"
  kategorie: "objevitele"
  medailonek: "Ahmad Harar byl pilotem v hodnosti poručíka v námořnictvu Spojeného impéria Země (UEE). Při hlídce v soustavě Horus v roce 2617 objevil se svým střelcem Carlem Dysonem gravitační anomálii, kterou po hodinách analýzy vyhodnotili jako skokový bod. Místo hlášení na velitelství Dysona přesvědčil, aby jím proletěli, protože to byla jejich šance zapsat se do dějin; ocitli se však v soustavě pod kontrolou Xi’anů a byli zajati. Po třech dnech výslechů přesvědčili věznitele, že armáda UEE o skokovém bodu neví, a vrátili se do Horu se vzkazem, že lodě UEE v soustavě Kai'pua budou napadeny. Harar dostal důtku, přijal degradaci a sloužil ještě třicet let, než v roce 2647 odešel do výslužby jako kapitán."
  zdroje:
    - nazev: "Ahmad Harar"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VYLznx8r3e-ahmad-harar
  kapitoly: []

- id: "corsen-messer-v"
  jmeno: "Corsen Messer V."
  narozeni: "2609"
  umrti: "2662"
  role: "imperátor UEE (2643–2662)"
  kategorie: "vladari"
  rod: "messer"
  medailonek: "Corsen Messer V. byl nejmladším synem Deacona II. a vlády se ujal v roce 2643, kdy se jeho starší sestra Livia III. stáhla z veřejného života. Za jeho vlády se rozšířil okruh zločinů, za které hrozil trest smrti, vzrostly daně v celém impériu, u politických zločinů bylo zrušeno právo na soud, zesílila cenzura a na planetě Charon III přibyly politické věznice. Založil také monumentalistický architektonický směr. V roce 2662 byl spolu se starším synem Gammonem otráven; viník nebyl nikdy dopaden, ale historici se shodují, že za vraždou stála jeho nejmladší dcera Illyana VI."
  zdroje:
    - nazev: "Corsen Messer V"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/0OaB8O6awO-corsen-messer-v
  kapitoly: [kap-6]

- id: "marius-messer-iv"
  jmeno: "Marius Messer IV."
  narozeni: "2625"
  umrti: "2641"
  role: "syn Livie III., čestný imperátor"
  kategorie: "vladari"
  rod: "messer"
  medailonek: "Marius byl jediným synem imperátorky Livie III. a jejího manžela Daniela Scoty, bývalého pilota. Dětství prožil na Zemi s bratrancem Gammonem a sestřenicí Illyanou a od útlého věku ho soukromě vyučoval dědeček Deacon II., často s ním a s matkou objížděl impérium. V šestnácti letech získal Ekvivalenci a byl přijat na Námořní leteckou akademii Spojeného impéria Země (UNFA). V roce 2641 zahynul spolu s otcem, když jejich raketoplán při návratu do atmosféry nad Moskvou postihla katastrofální porucha. Matka mu udělila čestný titul imperátora a v roce 2643 se stáhla z veřejného života."
  zdroje:
    - nazev: "Marius Messer IV"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RxNxAgrXZz-marius-messer-iv
    - nazev: "Livia Messer III"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/01dWwaQkrL-livia-messer-iii
  kapitoly: [kap-6]

- id: "gammon-messer"
  jmeno: "Gammon Messer"
  narozeni: "2629"
  umrti: "2662"
  role: "následník trůnu, důstojník armády UEE"
  kategorie: "armada"
  rod: "messer"
  medailonek: "Gammon Messer byl nejstarším dítětem imperátora Corsena V. a herečky Inayi Satti a dětství prožil na Zemi se sestrou Illyanou a bratrancem Mariusem. Při narození byl až třetí v pořadí následnictví, a tak se věnoval zálibám a podle pověstí i neřestem. Po Mariusově smrti v roce 2641 a otcově nástupu na trůn v roce 2643 se nečekaně stal prvním následníkem; otec ho poslal na vojenskou školu a v osmnácti nastoupil do armády UEE. V roce 2654 se oženil s plukovnicí Yemi Duas a v roce 2661 se mu narodila jediná dcera Astrid. Připisuje se mu zpřísnění podmínek pro vězně a vymýšlení obzvlášť krutých výslechových metod; v roce 2662 byl zavražděn spolu s otcem."
  zdroje:
    - nazev: "Gammon Messer"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/0rxrqgDP12-gammon-messer
  kapitoly: [kap-6]

- id: "illyana-messer-vi"
  jmeno: "Illyana Messer VI."
  narozeni: "2631"
  umrti: "2697"
  role: "imperátorka UEE (2662–2697)"
  kategorie: "vladari"
  rod: "messer"
  medailonek: "Illyana Messer VI. se stala imperátorkou Spojeného impéria Země (UEE) v roce 2662 po vraždě svého otce Corsena V. a bratra Gammona, kterou podle historiků sama zosnovala. Za její vlády UEE zmírnilo propagandu a zpravodajské organizace mohly kritizovat některé kroky vlády, aniž by jim hrozila odveta. Ke konci života určila za nástupce mladšího syna Samuela místo staršího Galora, aby předešla mocenskému boji mezi svými dětmi. Po její smrti v roce 2697 se však trůnu zmocnila její neteř Astrid a rozpoutala čtyři roky ozbrojených střetů mezi stoupenci jednotlivých větví rodu."
  zdroje:
