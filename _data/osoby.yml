  kategorie: "korporace"
  medailonek: "Charles Baxter byl předákem terraformačního týmu společnosti Gaia Planet Services, který v roce 2530 bez povolení přistál na planetě Pallas III, aby ji připravil k terraformaci. Během průzkumu se odevšad vynořily neznámé lodě a všech 276 lidí zajali Xi’ani; bylo to vůbec první setkání lidstva s touto civilizací. Xi’ani poznali, že operaci vede Baxter, a na znamení dobré vůle ho propustili. Uprchl do soustavy Baker a nejdřív se obrátil na své nadřízené, ne na úřady; když chtělo vedení firmy vyjednávat s Xi’any na vlastní pěst, Baxter se postavil proti. Poté vypovídal před třemi tribuny Spojených planet Země (UPE) a výborem senátorů a přiznal, že tým před přistáním planetu pořádně neprověřil skenery."
