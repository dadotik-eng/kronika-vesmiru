- id: "inacio-santos-melo"
  jmeno: "Inácio Santos Melo"
  narozeni: "2513"
  umrti: "2615"
  role: "novinář, moderátor pořadu Showdown!"
  kategorie: "kultura"
  medailonek: "Inácio Santos Melo se narodil v roce 2513 na planetě Cestulus (Davien II). Začínal jako politický asistent, krátce řídil volební kampaně a pak se stal politickým zpravodajem listu United Times/Tribune. V roce 2546 nahradil tvůrkyni pořadu Showdown! Upsanu Dixit v roli moderátora. Jeho konfrontační přístup k hostům zvedl sledovanost a stal se pevnou součástí pořadu i poté, co Melo v roce 2588 odešel do důchodu."
  zdroje:
