  role: "guvernér státu Dellin na planetě Charon III"
  kategorie: "politika"
  medailonek: "Tarquin Klast je zvoleným guvernérem státu Dellin na planetě Charon III. Pochází z chudé rodiny a do úřadu se dostal uprostřed konfliktu mezi Dellinem a sousedním státem Acheron. Zpravodajské organizace a kontrolní skupiny ho obviňují, že ve své vládě odstranil systém brzd a protivah, zřejmě aby si udržel moc. Klast odpovídá, že tyto změny byly nutné k ochraně Dellinu před vojenskými útoky Acheronu."
