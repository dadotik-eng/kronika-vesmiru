- id: "aadya-firmino"
  jmeno: "Aadya Firmino"
  narozeni: "2692"
  umrti: "2781"
  role: "pašeračka a ředitelka Terra Movers Construction, spoluobjevitelka soustavy Tohil"
  kategorie: "objevitele"
  medailonek: "Aadya Firmino vyrůstala v chráněném prostředí a toužila po dobrodružství, a tak v roce 2713 odletěla svou novou lodí Constellation Andromeda do Levski v soustavě Nyx, kde poznala pilotku a mechaničku Oishu Suen. Tři roky spolu pašovaly, dokud je nevyhostili po Firminině posledním pokusu přetáhnout klienty jiným pašerákům, při němž byl zničen jeden z přístavů Levski a tři lidé byli těžce zraněni. Krátce nato Suen zachytila skokový bod do neznámé soustavy Tohil; Firmino ji přemluvila k mlčení, pak ji v soustavě Bremen opila a objev nahlásila vládě UEE jako svůj vlastní. Po rozhovoru, který Suen poskytla listu Terra Gazette, přiznalo Ministerstvo dopravy a navigace zásluhy oběma a Advokacie na ně vydala zatykače, Firmino se však díky týmu právníků vyhnula vězení. V roce 2723 jí byl odepřen vstup na Levski a po návratu na Terru nastoupila do otcovy firmy Terra Movers Construction, kterou po jeho smrti v roce 2736 převzala jako výkonná ředitelka."
  zdroje:
    - nazev: "Aadya Firmino"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/0Nj5o4M9v2-aadya-firmino
  kapitoly: []

- id: "oisha-suen"
  jmeno: "Oisha Suen"
  narozeni: "2694"
  umrti: "2793"
  role: "pilotka a pašeračka, spoluobjevitelka soustavy Tohil"
  kategorie: "objevitele"
  medailonek: "Oisha Suen byla pilotka, mechanička a pašeračka. V roce 2713 se na stanici Levski v soustavě Nyx seznámila s dědičkou stavební firmy z Terry Aadyou Firmino a společně rozjely pašerácký obchod, jehož základnou byla Firminina loď Constellation Andromeda. V roce 2716 je Lidová aliance vyhostila a během útěku Suen na právě opraveném skeneru zachytila podivný signál, který vedl k novému skokovému bodu do soustavy Tohil. Firmino ji však zradila, objev ohlásila jako svůj a odměnu si nechala; Suen proto poskytla otevřený rozhovor listu Terra Gazette, který vyvolal vyšetřování, a vláda nakonec přiznala zásluhy oběma. Za pravdivou výpověď dostala snížený trest, vrátila se na Levski, kde jí vyhoštění zrušili, a založila tam firmu na přepravu cestujících."
  zdroje:
    - nazev: "Oisha Suen"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/01LrmgveKB-oisha-suen
  kapitoly: []

- id: "ulysses-messer-x"
  jmeno: "Ulysses Messer X."
  narozeni: "2702"
  umrti: "2781"
  role: "imperátor UEE (2751–2781)"
  kategorie: "vladari"
  rod: "messer"
  medailonek: "Ulysses Messer X. byl od roku 2722 vrchním tajemníkem svého strýce Galora IX., dohlížel na přestavbu vládních budov v metabarokním stylu a se zhoršujícím se zdravím imperátora přebíral stále víc jeho každodenních povinností. Po nástupu na trůn v roce 2751 věnoval většinu prostředků UEE dokončení těchto staveb. Během své vlády osekal ochranu životního prostředí, zvýšil daně, snížil minimální věk pro práci na deset let, pozastavil minimální mzdu, oslabil státní dohled nad průmyslem, rozšířil pravomoci policie a přepsal zákony o vlastizradě. V roce 2781 proti němu provedl převrat jeho syn Linton XI. a Ulysses spáchal sebevraždu dřív, než se k němu Lintonovi agenti dostali."
  zdroje:
    - nazev: "Ulysses Messer X"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/bBp6YZPOGO-ulysses-messer-x
  kapitoly: [kap-6]

- id: "marcus-fayel"
  jmeno: "Marcus Fayel"
  narozeni: "2719"
  umrti: "2816"
  role: "terraformační expert, zakladatel hnutí Outsiders"
  kategorie: "kultura"
  medailonek: "Marcus Fayel vystudoval univerzitu UPARQ a v roce 2743 ho firma Hatfield & Harding najala, aby dohlížel na terraformaci planety Leir II. Na místě si bez vědomí zaměstnavatele zřídil vlastní těžbu, jinak však platil za vzorného dozorce; když ho firma v roce 2803 vyhlásila zaměstnancem roku, místo osobní účasti poslal na banket video, v němž neustále opakoval slova „čistota záměru“. V roce 2812 přerušil veškerou komunikaci a ve smyčce vysílal, že „očista“ planety je dokončena a on se svými stoupenci se stává jejím správcem. Žoldnéře, které firma vyslala planetu získat zpět, odrazil. Planetu přejmenoval na Mya a své náboženské hnutí, Outsidery neboli Bratrstvo Slunečního oka, vedl až do své smrti v roce 2816."
  zdroje:
    - nazev: "Marcus Fayel"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/Rw1k2w51XZ-marcus-fayel
  kapitoly: []

- id: "terrence-akari"
  jmeno: "Terrence Akari"
  narozeni: "2737 nebo 2743"
  umrti: "2833 nebo 2859"
  role: "senátor za Terru, vyjednavač míru s Xi’any"
  kategorie: "politika"
  medailonek: "Terrence Akari byl senátorem za Terru a celoživotním zastáncem míru mezi lidmi a mimozemšťany, který se jako první člověk vzepřel Lintonu Messerovi XI. V roce 2789 tajně překročil Perryho linii a v soustavě Tohil vyjednal s xi’anským císařem Kr.ē pakt o neútočení, takzvanou smlouvu Akari–Kr.ē. Po návratu ji Rada guvernérů Terry jednomyslně schválila a Terra prohlásila, že nepodpoří žádné válečné akce proti Xi’anům; protože to bylo považováno za velezradu, musel se Akari před Lintonovými agenty skrývat. Po protimesserovské revoluci roku 2792 odmítl nabídku imperátorky Erin Toi stát se velvyslancem u Xi’anů a vrátil se do Senátu, kde se podílel na zákonu Fair Chance, na zákonu o reorganizaci armády z roku 2793 a na dalších zásadních reformách."
  rozpor: "Galactapedie má o Akarim dva články se stejným názvem, které si odporují. První uvádí roky 2737–2833, zvolení senátorem v roce 2772 a smrt v úřadu v roce 2833; druhý roky 2743–2859, senátorský mandát v letech 2781–2789 a 2792–2812 a odchod ze Senátu v roce 2812. Liší se i v tom, kdo mu pomohl dostat se k Xi’anům: podle prvního protimesserovští aktivisté, podle druhého náčelník terranské sekce Advokacie Nathan Warrick. První článek mu navíc připisuje podíl na zákonu o historické pravdě, který podle svého názvu pochází až z roku 2941."
  zdroje:
    - nazev: "Terrence Akari"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RL6ZQLwnko-terrence-akari
    - nazev: "Terrence Akari"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/V3qgjK7Jor-terrence-akari
  kapitoly: [kap-8]

- id: "j-harris-arnold"
  jmeno: "J. Harris Arnold"
  narozeni: "2742"
  umrti: "2853"
  role: "zakladatel a hlavní konstruktér Anvil Aerospace"
  kategorie: "korporace"
  medailonek: "Jude „J“ Harris Arnold byl jediným synem realitních magnátů z Terry a vystudoval astronautickou laboratoř Marsovského institutu vesmírných technologií (MIST), kde poprvé poznal dílo zesnulého konstruktéra Leonarda Casse. Kariéru začal v roce 2763 jako mladší konstruktér u Aegis Dynamics, ale po neúspěšném prototypu a opakovaném odmítání návrhů tam neviděl budoucnost, a tak s půjčkou od rodičů založil v roce 2772 ve městě Nova Kyiv na Terře společnost Anvil Aerospace. Jeho první stíhačka Osprey zaujala námořnictvo, a když ho držitel práv ke Cassovu dílu zažaloval, Arnold spor urovnal tím, že celé portfolio Casse Aerospace koupil, a Cassovy typické prvky dál používal jako poctu. Když Aegis po protimesserovské revoluci přišla o většinu zakázek, získal Anvil přímou zakázku na loď U4A-3 Terrapin nasazenou v roce 2796 a později stíhačka F7A Hornet, jejíž vývoj Arnold osobně řídil, nahradila Avenger jako standardní frontovou stíhačku UEE. Proslul sdílením zisku se zaměstnanci a podporou talentů, každou část svých lodí schvaloval osobně až do pozdního věku a v roce 2853 zemřel u svého pracovního stolu."
  zdroje:
    - nazev: "J Harris Arnold"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/Vy2ZqLy458-j-harris-arnold
  kapitoly: []

- id: "linton-messer-xi"
  jmeno: "Linton Messer XI."
  narozeni: "2745"
  umrti: "2792"
  role: "poslední imperátor z rodu Messerů (2781–2792)"
  kategorie: "vladari"
  rod: "messer"
  medailonek: "Linton Messer XI. byl posledním Messerem v úřadu imperátora Spojeného impéria Země (UEE). Moc převzal v roce 2781, když s pomocí sestry Fiony svrhl svého otce Ulyssese X. Za jeho vlády prodal práva na terraformaci planety Garron II soukromé firmě napojené na jeho rodinu, přestože věděl, že planetu obývají vnímající bytosti. Revoluční skupina Tide vypustila záznam následného masakru do médií a rozpoutala protimesserovskou revoluci, během níž byl Linton v roce 2792 zabit v úřadu."
  zdroje:
    - nazev: "Linton Messer XI"
