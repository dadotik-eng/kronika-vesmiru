  narozeni: "2899"
  umrti: "žije"
  role: "zakladatel a ředitel Consolidated Outland"
  kategorie: "korporace"
  medailonek: "Silas Koerner je zakladatelem, jediným vlastníkem, hlavním konstruktérem a výkonným ředitelem společnosti Consolidated Outland. Narodil se na planetě Rytif (Bremen II) jako jediný dědic rodinného jmění. Peníze investoval do mnoha oborů, od chovu ryb přes těžbu a dálkové mapování až po elektroniku, a teprve poté založil firmu na výrobu kosmických lodí."
