- id: "parker-terrell"
  jmeno: "Parker Terrell"
  narozeni: "2888"
  umrti: "žije"
  role: "investigativní novinář, moderátor pořadu Plain Truth"
  kategorie: "kultura"
  medailonek: "Parker Terrell je investigativní novinář a moderátor talk show Plain Truth. Do roku 2943 psal pro New United, kde publikoval řadu odhalení a získal pověst neodbytného a vyhraněného komentátora. Po vystoupení v debatním pořadu Showdown!, kde tvrdil, že vláda Spojeného impéria Země (UEE) nezákonně použila superzbraň ke zničení povrchu planety Ellis XI, na tři měsíce zmizel. Když ho našli na planetě Vann (Croshaw III) a vyslechla ho Advokacie, znovu vystoupil v Showdown! s tvrzením, že ho za pravdu zahnali do úkrytu, a New United s ním brzy nato ukončil smlouvu. Pak přijal nabídku Spectra připravit vlastní talk show a Plain Truth se začala vysílat v roce 2944."
  zdroje:
    - nazev: "Parker Terrell"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/Rxnza3Qdqd-parker-terrell
  kapitoly: []

- id: "laylani-addison"
  jmeno: "Laylani Addison"
  narozeni: "2889"
  umrti: "žije"
  role: "imperátorka UEE (od 2951)"
  kategorie: "vladari"
  medailonek: "Laylani Addison je současnou imperátorkou Spojeného impéria Země (UEE); přísahu složila 1. ledna 2951. Předtím devět let vyučovala integrované vědy a xenotechnologie na Mentorské univerzitě a v letech 2931 až 2947 tam byla děkankou aplikovaných věd. Není členkou žádné politické strany. Její program počítá s Inovační iniciativou, která uvolní omezení výzkumu umělé inteligence, s vyššími výdaji na vzdělání, vědu a veřejné univerzity, s lepšími vztahy mezi lidmi a mimozemskými civilizacemi, s více penězi pro Synthworld a s vládním programem na nalezení ztracené kolonizační lodi Artemis. Do své vlády jmenovala Tevarinku Ki Jotal, první členku kabinetu z řad Tevarinů."
  zdroje:
    - nazev: "Laylani Addison"
