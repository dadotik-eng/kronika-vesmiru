- id: "armistead-perry"
  jmeno: "Armistead Perry"
  narozeni: "neznámo"
  umrti: "neznámo"
  role: "generálka námořnictva UPE a UEE, autorka Perryho linie"
  kategorie: "armada"
  medailonek: "Armistead Perry pocházela z vojenské rodiny, Ekvivalenci získala už v šestnácti letech a důstojnickou akademii námořnictva Spojených planet Země (UPE) zakončila jako nejlepší absolventka. Do námořnictva nastoupila v roce 2488 jako poručice v soustavě Corel, kde hlídala skokový bod do Geddonu a zadržovala pašeráky z Banuského protektorátu; plukovnicí byla už v roce 2503. V roce 2531 přišla při střetu s velkým pašeráckým gangem o nohu, byla povýšena na generálku a převelena do soustavy Kilian, odkud pomáhala vybudovat silnou vojenskou přítomnost v nově objevené soustavě Yā'mon. V roce 2542 navrhla vytvořit nárazníkové pásmo mezi Xi’anským impériem a UPE; Tribunál po měsících souhlasil, vybral pro ně osm soustav a na její počest je pojmenoval Perryho linie. Generálkou zůstala i v námořnictvu Spojeného impéria Země (UEE), a to až do roku 2589."
  zdroje:
