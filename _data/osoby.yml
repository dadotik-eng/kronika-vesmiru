- id: "magnus-tobin"
  jmeno: "Magnus Tobin"
  narozeni: "2756"
  umrti: "2912"
  role: "zakladatel microTechu, tvůrce mobiGlasu"
  kategorie: "korporace"
  medailonek: "Magnus Tobin po získání Ekvivalence nastoupil do textilní firmy svých rodičů a díky přestavbě jejího technického zázemí jí pomohl k rekordním ziskům. V roce 2782 s počátečním kapitálem od rodičů oficiálně založil společnost microTech, která se však dlouho nedokázala dostat do zisku; obrat přišel, až když se spojil se svou bývalou mentorkou Aleenou Tressler a na její radu najímal špičkové inženýry a nechával jim volnou ruku. Koupě firmy Empiric Education ho přivedla přímo k vytvoření prvního mobiGlasu, jehož úspěch udělal z microTechu jednu z největších firem ve Spojeném impériu Země (UEE). Stál také za koupí planety Stanton IV od UEE a zemřel v roce 2912 poté, co osobně dohlížel na stavbu města New Babbage."
  zdroje:
    - nazev: "Magnus Tobin"
