- id: "lii-se-kre"
  jmeno: "Lii\" se Kr.ē"
  narozeni: "neznámo"
  umrti: "neznámo"
  role: "císařovna Xi’anů (2372–2643)"
  kategorie: "xiani-tevarini"
  medailonek: "Lii\" se Kr.ē vládla Xi’anskému impériu v letech 2372 až 2643 jako předposlední panovnice Třetího imperiálního věku. Kvůli událostem, které provázely první kontakt Xi’anů s lidmi, zastávala tvrdě protilidský postoj a nechala rychle posilovat xi’anské vojenské síly podél Perryho linie. Ani opakované výhrůžky vojenským zásahem ze strany Spojených planet Země (UPE) ji nepřiměly prozradit, jak daleko Xi’anské impérium sahá. Jejím synovcem je současný císař T.uēng se Kr.ē."
  zdroje:
    - nazev: "Emperor Lii\" se Kr.ē"
