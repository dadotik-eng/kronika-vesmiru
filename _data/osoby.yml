- id: "paul-barlow"
  jmeno: "Paul Barlow"
  narozeni: "neznámo"
  umrti: "neznámo"
  role: "mariňák, oslavovaný „hrdina“ bitvy o Fabelu"
  kategorie: "armada"
  medailonek: "Paul Barlow byl jediným mariňákem ze svého družstva, který přežil vanduulský útok na hornickou osadu Fabela v soustavě Caliban 15. srpna 2825. Oficiální verze, kterou rozšířila média, z něj udělala hrdinu, jenž sám s vozidlem Ballista zničil celou vanduulskou letku, a Barlowa oslavovali po celém impériu. Po pádu Calibanu v roce 2884 však přiznal, že na nátlak nadřízených lhal: ve skutečnosti při útoku v opilosti utíkal schovat se do dolu a z Ballisty střílel zraněný bývalý horník Ignacio Assaf, zatímco Barlow jen vysílal nouzové volání. S novinářkou Melanií Andrieux napsal knihu A Good Lie, která obě verze staví vedle sebe, a veškerý výtěžek z ní připadl Assafově rodině. Zbytek života pomáhal veteránům trpícím posttraumatickou stresovou poruchou; námořní pěchota jeho tvrzení nikdy nekomentovala a oficiální vyšetřování neproběhlo."
  zdroje:
    - nazev: "Battle of Fabela"
      typ: Comm-Link
      url: https://robertsspaceindustries.com/en/comm-link/spectrum-dispatch/17862-Battle-Of-Fabela
  kapitoly: []

- id: "ignacio-assaf"
  jmeno: "Ignacio Assaf"
  narozeni: "neznámo"
  umrti: "2825"
  role: "bývalý horník, skutečný hrdina bitvy o Fabelu"
  kategorie: "armada"
  medailonek: "Ignacio Assaf byl bývalý horník, který se v osadě Fabela v soustavě Caliban živil sběrem a zpeněžováním starého vybavení. Při vanduulském útoku 15. srpna 2825 ho zranily střepiny, přesto byl odhodlaný vetřelce zastavit. Uklidnil vyděšeného mariňáka Paula Barlowa a přesvědčil ho, aby díky svému vojenskému oprávnění zpřístupnil vozidlo Ballista čekající na údržbu; ze střeleckého místa pak těžce poškodil bombardér Void a sestřelil druhý bombardér i dvě stíhačky Scythe. Posily námořnictva, které vzápětí dorazily, už pro něj přišly pozdě: podlehl zraněním a slávu za jeho čin oficiálně sklidil Barlow. Pravdu odhalil Barlow až po pádu Calibanu v roce 2884 a svou knihu A Good Lie věnoval Assafovi slovy „I když tě dějiny zapomenou, já nikdy.“"
  zdroje:
