  kapitoly: []

- id: "kyle-polo"
  jmeno: "Kyle Polo"
  narozeni: "2883"
  umrti: "žije"
  role: "bývalý senátor za Angeli"
  kategorie: "politika"
  medailonek: "Kyle Polo byl v letech 2935 až 2945 senátorem za planetu Angeli (Croshaw II). Hlasoval pro zákony, které snižovaly vládní výdaje a daně pro velké i malé podniky na Angeli. Jeho největším návrhem byla Polova iniciativa, která měla omezit vojenský rozpočet tím, že ho podřídí kontrole Senátu. Zpočátku získala podporu, ale po vanduulském útoku na soustavu Vega byla 4. listopadu 2945 odmítnuta a Polo, který se ve stejném hlasování ucházel o znovuzvolení, přišel o mandát."
  zdroje:
    - nazev: "Kyle Polo"
      typ: Galactapedie
