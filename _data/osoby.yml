- id: "yaha-se-xyo"
  jmeno: "Y.ah'a se Xy.ō"
  narozeni: "neznámo"
  umrti: "neznámo"
  role: "první xi’anská císařovna Druhého imperiálního věku"
  kategorie: "xiani-tevarini"
  medailonek: "Y.ah'a se Xy.ō byla první císařovnou Druhého imperiálního věku Xi’anů. Původně se věnovala potravinářské mikrobiologii a do Rady tří svého rodu se dostala, když objevila bakterii umožňující rychlé kvašení obilí a luštěnin, čímž odvrátila hrozící hladomor na planetě Ka'ua (Hyoton IV). Když byl rod Xy.ō vybrán jako nástupce rodu Ru'a, stala se císařovnou díky příznivému postavení nejmladší ze tří dcer. S posledním císařem rodu Ru'a Se'angem vedla terraformaci planety R.aip'uāng (Kai'pua II) jako poctu mnoha tisíciletím služby rodu Ru'a. Za její vlády se rozvinulo vědění o konzervaci potravin a vzrostl vliv rodů, které se zabývaly biologií."
  zdroje:
    - nazev: "Emperor Y.ah'a se Xy.ō"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/0ODxZEPdoZ-emperor-yaha-se-xyoo
  kapitoly: []

- id: "corath-thal"
  jmeno: "Corath'Thal"
  narozeni: "neznámo"
  umrti: "neznámo"
  role: "tevarinský válečný vůdce"
  kategorie: "xiani-tevarini"
  medailonek: "Corath'Thal byl tevarinský válečný vůdce, který za druhé tevarinské války vedl ozbrojené povstání proti Spojenému impériu Země (UEE). Jako skvělý a charismatický vůdce sjednotil mnoho Tevarinů rozprášených po první válce s cílem získat zpět jejich domovský svět Kaleeth, dnešní Jalan (Elysium IV). Pomocí partyzánské taktiky se nepozorovaně přesouval mezi soustavami a útočil tam, kde armáda UEE nebyla, takže lidé jen těžko odhadovali jeho další krok. Tevarinské síly však postupně řídly a nebylo je čím doplnit. Když po bitvě o Centauri bylo jasné, že Tevarinové znovu prohrají, vedl Corath'Thal svou flotilu k poslednímu výpadu ke Kaleethu, kde lodě vypnuly štíty a shořely v atmosféře planety."
  zdroje:
