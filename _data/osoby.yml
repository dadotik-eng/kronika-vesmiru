- id: "samuel-messer-viii"
  jmeno: "Samuel Messer VIII."
  narozeni: "2678"
  umrti: "2715"
  role: "imperátor UEE (2697/2701–2715)"
  kategorie: "vladari"
  rod: "messer"
  medailonek: "Samuela Messera VIII. určila za nástupce jeho matka Illyana VI., po její smrti v roce 2697 se však moci chopila jeho sestřenice Astrid a Samuela odstavila. Po čtyřleté občanské válce zorganizovali jeho agenti Astridinu vraždu a Samuel se v roce 2701 oficiálně stal imperátorem. Za své vlády zpřísnil omezení svobody projevu a několikrát nechal armádu potlačit civilní protesty. Byl ubodán ve své posteli a v roce 2715 ho na trůnu vystřídal starší bratr Galor IX."
  rozpor: "Galactapedie datuje jeho vládu od roku 2697, sama však uvádí, že část historiků ji počítá až od roku 2701; článek o Astrid Messer VII. ji pro léta 2697–2701 označuje za jednu ze dvou imperátorů."
