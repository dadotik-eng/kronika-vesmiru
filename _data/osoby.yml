- id: "arial-hurston"
  jmeno: "Arial Hurston"
  narozeni: "2466"
  umrti: "2537"
  role: "třetí výkonný ředitel Hurston Dynamics"
  kategorie: "korporace"
  medailonek: "Arial Hurston byl třetím výkonným ředitelem společnosti Hurston Dynamics. Jeho úsporná opatření přinesla firmě dvě desetiletí rekordních zisků. Patřila k nim i dodnes sporná pracovní smlouva typu Life/Labor, kterou zastánci práv pracujících kritizují jako tak svazující, že se téměř rovná legalizovanému otroctví. Na jeho počest dostal jméno Arial první měsíc planety Hurston."
