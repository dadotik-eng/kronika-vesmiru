- id: "teesa-morrison"
  jmeno: "Teesa Morrison"
  narozeni: "2492"
  umrti: "2571"
  role: "průzkumnice, objevitelka skokového bodu Baker–Yā'mon"
  kategorie: "objevitele"
  medailonek: "Teesa Morrison se narodila na tankeru, který zrovna proletoval soustavou Cano, a sama o sobě říkala, že je „vesmírná tulačka a průzkumnice na plný úvazek“; výpravy si financovala příležitostnými zakázkami. V roce 2531 objevila v soustavě Baker skokový bod, ale za ním narazila na vojenskou jednotku Xi’anů a musela ustoupit. Armáda Spojených planet Země (UPE) se snažila zprávu utajit, jenže záznam setkání unikl do médií, a když se o dva týdny později z bodu vynořil xi’anský průzkumník, visela válka na vlásku. Pod tlakem veřejnosti však námořnictvo UPE zvolilo opatrný postup a otevřenému konfliktu se podařilo zabránit. Za vládní odměnu si Morrison koupila větší loď, která se stala jejím trvalým domovem, a v roce 2571 zemřela přirozenou smrtí při průletu soustavou Goss."
  zdroje:
    - nazev: "Teesa Morrison"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/01LrNgqDrL-teesa-morrison
  kapitoly: []

- id: "mauricio-tusk"
  jmeno: "Mauricio Tusk"
  narozeni: "2499"
  umrti: "2551"
  role: "vrchní advokát UPE"
  kategorie: "politika"
  medailonek: "Mauricio Tusk sloužil od roku 2524 jako strážce zákona v Advokacii a v letech 2541 až 2546 zastával úřad vrchního advokáta Spojených planet Země (UPE). Spolu s vrchní tajemnicí Janis Rezaian veřejně kritizoval tehdejšího vrchního generála Ivara Messera za neochotu ke kompromisům s ostatními členy Tribunálu. Když byl Messer v roce 2546 zvolen prvním občanem a Tribunál zanikl, přišel Tusk o svůj úřad. Roku 2547 se vrátil k Advokacii a v roce 2551 zahynul při vysoce riskantní akci, jejímž cílem bylo někoho vyprostit."
  zdroje:
    - nazev: "Mauricio Tusk"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/VY4WBM6OZ1-mauricio-tusk
  kapitoly: [kap-5]

- id: "marie-sante"
  jmeno: "Marie Sante"
  narozeni: "2504"
  umrti: "2545?"
  role: "navjumperka, objevitelka soustavy Horus"
  kategorie: "objevitele"
  medailonek: "Navjumperka Marie Sante se narodila na planetě Gonn (Oberon I) jako nejstarší ze sedmi dětí a často se musela starat o sourozence. Ve čtrnácti utekla z domova a znovu se objevila až v roce 2528, kdy ohlásila vládě Spojených planet Země (UPE) objev soustavy Horus, pojmenované po její lodi; podle podrobných map, které předložila, historici soudí, že tam byla poprvé až o deset let dříve. Když v roce 2542 objevila skokový bod do xi’anské soustavy R.il'a, zařadila UPE Horus do Perryho linie a uzavřela ho pro civilisty. Sante však odmítla odejít a dál soustavu prozkoumávala, přičemž unikala námořnictvu a občas se s ním i střetla. V roce 2545 i se svou lodí beze stopy zmizela a její osud je dodnes oblíbeným námětem příběhů a dokumentů na planetě Serling (Horus I)."
  zdroje:
    - nazev: "Marie Sante"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/RX36PWwe4K-marie-sante
  kapitoly: []

