- id: "kellar-lench"
  jmeno: "Kellar Lench"
  narozeni: "2514"
  umrti: "2573"
  role: "vědec, objevitel Tevarinů"
  kategorie: "objevitele"
  medailonek: "Doktor Kellar Lench byl vědec, který jako první člověk našel soustavu Elysium a civilizaci Tevarinů. Po doktorátu pracoval pro výzkumný institut New Horizons, dceřinou firmu skupiny Hathor, ale po více než 250 dnech osamělé mise na planetě Yar (Centauri II) opustil své stanoviště, dal výpověď a odjel do města Fujin na planetě Saisei (Centauri III). Dne 15. listopadu 2541 objevil v soustavě Centauri skokový bod do soustavy plné života. Jeho rozhodnutí sdělit objev Spojeným planetám Země (UPE) vedlo k prvnímu kontaktu s Tevariny a následně k první tevarinské válce. Později přednášel fyziku na Marsovském institutu vesmírných technologií (MIST) a zemřel v roce 2573 na následky alkoholismu."
  zdroje:
    - nazev: "Kellar Lench"
      typ: Galactapedie
      url: https://robertsspaceindustries.com/galactapedia/article/V7d2g8xxva-kellar-lench
  kapitoly: [kap-5]

- id: "ivar-messer-i"
  jmeno: "Ivar Messer I."
  narozeni: "2516"
  umrti: "2592"
  role: "první imperátor UEE"
  kategorie: "vladari"
  rod: "messer"
  medailonek: "Ivar Messer sloužil jako důstojník 112. pěšího praporu armády Spojených planet Země (UPE) a vyznamenal se v první tevarinské válce, v operaci Nemesis i v bitvě o Idris IV, kde po smrti svého velitele převzal velení a dovedl vojáky k vítězství. Vláda jeho obraz statečného a charismatického důstojníka využila v náborové kampani a Messer z této popularity po válce vytěžil politický vliv i místo vrchního generála v Tribunálu. Pobouření veřejnosti po krveprolití v Jatě využil k prosazení nového úřadu prvního občana, do kterého byl 15. prosince 2546 v mimořádných volbách sám zvolen. Poté rozpustil Tribunál, přejmenoval UPE na Spojené impérium Země (UEE) a počátkem roku 2547 se prohlásil imperátorem. V roce 2571 se oženil s technickou ředitelkou Delií Hassan a jejich jediný syn Deacon po jeho smrti v roce 2592 převzal vládu."
  rozpor: "Podle článku o Ivarovi se oženil s Delií Hassan v roce 2571 a syna Deacona měl „krátce poté“, článek o Deaconovi však uvádí, že se Deacon narodil už v roce 2567."
  zdroje:
    - nazev: "Ivar Messer I"
