- id: "tueng-se-kre"
  jmeno: "T.uēng se Kr.ē"
  narozeni: "neznámo"
  umrti: "žije"
  role: "současný císař Xi’anů"
  kategorie: "xiani-tevarini"
  medailonek: "T.uēng se Kr.ē je současným císařem Xi’anského impéria; korunován byl v roce 2643 jako nástupce své tety, císařovny Lii\" se Kr.ē. Spolu se senátorem Spojeného impéria Země (UEE) Terrencem Akarim stál za první dohodou, která měla ukončit studenou válku mezi Xi’any a lidmi. Je posledním členem rodu Kr.ē, který smí podle zákona převzít císařský titul. Po jeho smrti bude vybrán nový císařský rod a Třetí imperiální věk skončí."
  zdroje:
