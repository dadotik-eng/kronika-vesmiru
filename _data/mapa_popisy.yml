# Krátké české popisy soustav pro Hvězdnou mapu (/mapa/).
# Převyprávěno z oficiálních popisů Star Map RSI (archiv Archiváře, starsystems).
"AYR'KA": "Vojenská soustava Xi’anů s výcvikem pozemních vojsk. Za studené války ležela blízko Perryho linie; po uklidnění vztahů se sem stáhly xi’anské síly z linie."
"BACCHUS": "Dvojhvězda, ve které mnozí v UEE tuší domovský svět Banu – Banu to ale nikdy nepotvrdili. Obchodní trasy jsou vždy plné Banu, lidí i Xi’anů."
"BAKER": "Dvojhvězda zajímavá pro vědce, ale špatně položené planety znemožňují terraformaci. Řídké osídlení se drží hlavně kolem Xenie, překladiště Covalexu u Baker III."
"BANSHEE": "Jediná soustava UEE s pulsarem uprostřed. Planety jsou kvůli záření neobyvatelné, Banshee III ale patří k největším těžebním oblastem impéria."
"BRANAUGH": "Nezabraná soustava dostupná jen malým skokovým bodem, kudy neprojedou velké lodě. UEE proto její jedinou obyvatelnou planetu odepsala."
"BREMEN": "Objevena roku 2441 a dlouho považována za nezajímavou. Proslula hlavně jako hlavní dodavatel potravinových dávek za druhé tevarinské války (2603–2610)."
"CALIBAN": "Bývalá soustava UEE, ztracená při vanduulském postupu. Pád Calibanu roku 2884 byl až do bitvy u Vegy II poslední výskyt vanduulské Kingship v prostoru UEE – a místem posledního boje Ztracené letky."
"CANO": "Čtyřplanetová soustava objevená roku 2463. Na oceánském Carteyně (Cano II) se zastavila terraformace, když v hlubinách objevili vznikající život; dnes ho chrání zákony."
"CASTRA": "Za napětí s Xi’any (2530–2789) shromaždiště námořních bombardérů na Perryho linii. Po uznání Akariho smlouvy imperátorkou Toi byla odzbrojena a otevřena osadníkům."
"CATHCART": "Soustava bez planet, jen s volnými asteroidy – po staletí šrotiště galaxie, kde se rozebíraly vyřazené lodě. Rozestavěná vojenská platforma zůstala opuštěná."
"CENTAURI": "Objevena 2365, jedna z prvních osídlených soustav. Za první tevarinské války (2541–2546) patřila k hlavním bojištím."
"CHARON": "Odlehlá soustava s nejhoršími věznicemi Messerů. Po pádu režimu a odtajnění zvěrstev se rada guvernérů Charonu III zřekla uznání UEE jako první."
"CHRONOS": "Rozlehlá prázdná soustava se dvěma mrtvými světy. Prázdná obyvatelná zóna se stala místem ambiciózního projektu Synthworld; jediným přístavem je stanice Archangel."
"COREL": "Na hranici s Banuským protektorátem, jedna z nejrušnějších obchodních tras impéria. Na Lo (Corel III) žijí Banu a lidé vedle sebe."
"CROSHAW": "„Brána do vesmíru“ – první soustava mimo Sol, kterou lidé navštívili. Objevil ji roku 2271 Nick Croshaw; spory o její kolonizaci přispěly ke vzniku UNE."
"DAVIEN": "Místo prvního setkání lidstva s mimozemšťany – Banu, roku 2438. Za pár měsíců vznikla první mezihvězdná mírová smlouva a Cestulus (Davien II) zaplavili obchodníci."
"EEALUS": "Ē'aluth je známá hlavně jako největší přírodní rezervace Xi’anů na Ko'li (Ē'aluth III). Celníci jsou přísní kvůli pašerákům a invazním druhům."
"EL'SIN": "Xi’anská soustava. Mapové údaje nejsou úplné."
"ELLIS": "Třináct planet a široká obyvatelná zóna. Domov Murray Cupu, nejslavnějšího závodu UEE, který vznikl jako zábava během terraformace."
"ELYSIUM": "Původní domov Tevarinů, po první tevarinské válce (2541–2546) připojený k UPE. Za druhé války (2603–2610) sem dopadly trosky flotily válečníka Corath'thala."
"FERRON": "Po staletí bohatá díky nerostům Asury (Ferron III). Když došly, lidé i firmy odešli a soustava zchudla."
"FORA": "Blízko území Banu, kde měl vzniknout obchodní uzel. Jediná obyvatelná planeta Hyperion (Fora III) ale po nehodě při terraformaci trpí věčnou prachovou bouří."
"GARRON": "Známá hlavně masakrem na Garronu II roku 2792, který odstartoval pád Messerů a vyhladil vznikající druh. Dnes je pomníkem nebezpečí terraformace."
"GEDDON": "Jediná planeta u modré hvězdy. Pro lidi nepřátelská, Banu v ní ale pod povrchem postavili arkologie a těží suroviny."
"GENESIS": "Na Genesis II objevili průzkumníci rozumný druh, a tak platí zákon Fair Chance. Vědci sledují jeho vývoj; nedávno se mezi dvěma druhy planety rozhořely boje."
"GLIESE": "Bohaté planety a pásy asteroidů z ní dělají velký přístav Banu. Gliese IV je záhadou: většina Banu na ni nevstoupí, přestože na povrchu stojí prázdné banuské osady."
"GOSS": "Dvojhvězda u mlhoviny Olympus Pool, jedna z nejkrásnějších částí impéria. Žije z turistiky, ale Gossiané si většinu surovin vyrobí sami."
"GURZIL": "Mladá soustava s protoplanetárním diskem – bez plnohodnotných planet, ale bohatá na suroviny k těžbě."
"HADES": "Prastaré bojiště. Xenoarcheologové soudí, že tu civilizace zničila sama sebe v občanské válce; z Hades IV zbyla jen „půlka planety“."
"HADRIAN": "„Země nikoho“ na hranici s Xi’any, za studené války vojensky klíčová. Dnes hlavní kontrolní bod obchodu mezi UEE a Xi’anskou říší; mimo vytyčené koridory je nebezpečno."
"HADUR": "Yā'mon (dříve Hadur) byla soustava Perryho linie, kterou smlouva Akari–Kr.ē přiřkla Xi’anům. Ti tu terraformují dvě planety k neznámému účelu."
"HELIOS": "Héliová hvězda typu B vysílá prudký sluneční vítr, který ruší senzory – armáda UEE tu proto skrývá své aktivity na stanici Hephaestus a Helios IV."
"HORUS": "Soustava Perryho linie s několika skoky do xi’anského prostoru. Po zrušení linie připadla UEE a byla odzbrojena."
"IDRIS": "Za první tevarinské války Tevarinové roku 2542 dobyli Locke (Idris IV). Jeho znovudobytí zachránil mladý kapitán Ivar Messer – a změnil tím osud UEE."
"INDRA": "Kyuk'ya (dříve Indra) je dvojhvězda na hranici lidí a Xi’anů, bývalá soustava Perryho linie. Dnes rušný xi’anský přístav, kde se vykládá zboží pro hlubší xi’anský prostor."
"KABAL": "Nedávno objevená soustava, zprvu pokládaná za prázdnou – dokud na Kabalu III nenašli opuštěná tevarinská města. Zdá se, že je Tevarinové opustili kolem první tevarinské války."
"KALLIS": "Planety se tu teprve formují. Ač tu není život, chrání ji zákon Fair Chance, aby vědci mohli zrod soustavy sledovat."
"KAYFA": "Kai'pua má pro Xi’any náboženský význam a míří sem poutníci. Za éry Messerů patřila k nejopevněnějším xi’anským soustavám."
"KELLOG": "Leží u vanduulského prostoru a je pod přísným dohledem: na Kellogu II (Xis) objevili život a poslední planetu UEE proměnila ve vězeňský svět QuarterDeck."
"KHABARI": "Xi’anská soustava K.ap'a'ri. Mapové údaje nejsou úplné."
"KIEL": "Další soustava na hranici s Xi’any, za studené války shromaždiště vojsk. Terraformovali jen Severus (Kiel III) jako velitelské centrum."
"KILIAN": "Čtrnáct planet plných kasáren, výcvikových středisek a loděnic. Sídlí tu velitelství námořnictva na MacArthuru (Kilian V) a námořní pěchoty na Corinu (Kilian IX)."
"KINS": "Známá hlavním banuským trhem se smluvním služebnictvím, které k banuské společnosti tradičně patří. Nebezpečnější než jiné soustavy Banu – hlavně kvůli lidem."
"LEIR": "Tři planety bohaté na nerosty, známé ale díky izolacionistům Outsiders, kteří ovládli Leir II. UEE nechtěla krveprolití, a tak soustavě odřízla podporu."
"MAGNUS": "Kdysi slavné loděnice, které upadly, když námořnictvo přesídlilo do Kilianu. Po desetiletích krize a zločinu ji teď pomalu zvedá Drake Interplanetary."
"MARKAHIL": "Xi’anská soustava Malkail. Mapové údaje nejsou úplné."
"MIN": "Středem není hvězda, ale bludný plynný obr se čtyřmi měsíci. Na Min 1b žijí světélkující bakterie a malá skupina osadníků."
"NEMO": "Turistický cíl a velký dodavatel ropy. Jediný obyvatelný svět Ergo (Nemo III) je oceán, po kterém plují plovoucí města."
"NEXUS": "Formálně nezabraná, přesto ji obsadila těžařská konsorcia z UEE. Po objevu skoků do bezprávných soustav sem přišli zločinci."
"NUL": "Pulzující cefeida ji rozpaluje natolik, že ji UEE nechala nezabranou. Zůstala skoro pustá až do roku 2571, kdy na Ashanu dopadla loď UEES Olympus."
"NYX": "Objevena 2582 a ponechána nezabraná. Roku 2655 se do opuštěné těžební stanice na asteroidu Delamar uchýlili aktivisté a uprchlíci před Messery."
"OBERON": "Křižovatka skokových bodů a nárazníková zóna mezi UEE a Vanduuly. Vanduulské nájezdy, drsná těžba a tragédie při terraformaci ji nechaly nezabranou."
"ODIN": "Hvězda se dávno před objevem zhroutila v bílého trpaslíka a soustava je pro lidi nehostinná. Zajímavý je pás asteroidů Coil s neustálými elektromagnetickými bouřemi."
"ORETANI": "Objevena v 25. století. Uprostřed terraformace se zhroutil jediný skokový bod a tisíce lidí zůstaly odříznuté – příběh, ze kterého vznikl svátek Coramor."
"ORION": "Nejvzdálenější svět Project Far Star. Tady se lidstvo 9. srpna 2681 poprvé setkalo s Vanduuly, když jejich nájezdníci napadli základnu na Armitage."
"OSIRIS": "Jedna z prvních soustav chráněných zákonem Fair Chance. Prozkoumána až po pádu Messerů; na Etosu (Osiris I) objevili původní život."
"OSO": "Žije tu nejvyspělejší předtechnologická civilizace, jakou UEE kdy objevila. Provoz hlídá pozorovací základna Chimera."
"OYA": "Soustava Perryho linie, kterou při odzbrojení dostala UEE. Těžaři, které armáda dlouho držela stranou, se sem po otevření okamžitě vrhli."
"PALLAS": "Th.us'ūng (dříve Pallas) – místo prvního setkání lidí s Xi’any roku 2530, kdy firma bez povolení začala terraformovat planetu, kterou už Xi’ani využívali. Ten střet určil tón vztahů na staletí."
"PYRO": "Šest planet bičovaných výrony žáru a záření z eruptivní hvězdy. Po objevu roku 2493 ji vytěžili; stanice firmy Pyrotechnic Amalgamated zůstala."
"RHETOR": "Centrum vzdělanosti UEE s univerzitami a výzkumnými ústavy – soustava s nejnižším průměrným věkem v impériu."
"RIHLAH": "R.il'a byla za studené války hlavním xi’anským vojenským uzlem. Dnes z ní roste průmyslové a obchodní centrum otevřené obchodu s UEE."
"SOL": "Kolébka lidstva a hlavní soustava impéria. Na Zemi sídlí imperátor i senát; Mars byl první planetou, kterou lidé terraformovali."
"STANTON": "UEE drží práva k soustavě, ale čtyři planety prodala čtyřem megakorporacím – jediné soukromé světy impéria, kde pořádek drží firemní bezpečnost."
"TAL": "T.āl je ikonická xi’anská „výrobní soustava“: každá planeta má přidělený obor podnikání i vlastní barvu architektury."
"TAMSA": "Nejnovější soustava UEE – dvě planety kolem černé díry. Roku 2943 ji objevil banuský průzkumník Kofi Baféuma; průzkum podle zákona Fair Chance teprve probíhá."
"TANGA": "Centrální hvězda už je bílým trpaslíkem a vnitřní planety zřejmě zničila. V pásu asteroidů se těží drahé kovy."
"TARANIS": "Nezabraná soustava se dvěma hustými pásy asteroidů – úkryt pirátů – a rozbitým měsícem nad Taranisem II."
"TAYAC": "Domov orbitální stanice Ark, která byla otevřena roku 2800 po studené válce s Xi’any jako úložiště vědění a neutrální půda pro diplomacii."
"TERRA": "Jediná soustava pojmenovaná podle hlavní planety, ne podle hvězdy. I za Messerů se snažila držet pokrokový kurz proti despotismu."
"TIBER": "Za Project Far Star tu místo terraformace stavěli stanice. Po útocích v Orionu se stala vojenským shromaždištěm, kde UEE vanduulský postup několik let zadržovala, než soustava roku 2736 padla."
"TOHIL": "Jediná bývalá soustava Perryho linie se skokem do nezabraného prostoru – ráj pašeráků. Hrála ale roli i v pádu Messerů."
"TRISE": "Duchovní srdce Banuského protektorátu na okraji xi’anského prostoru; náboženské Souli tu žijí trochu stranou zbytku banuské společnosti."
"TYROL": "Dvojhvězda, které hrozí výbuch novy. Zůstala nezabraná a obývají ji hlavně zločinci."
"VAGABOND": "Vanduulská soustava. Údaje utajila armáda UEE."
"VANGUARD": "Vanduulská soustava. Údaje utajila armáda UEE."
"VECTOR": "Vanduulská soustava. Údaje utajila armáda UEE."
"VEGA": "Osídlena roku 2402 a rychle rostla, dokud se koncem 27. století v sousedství neobjevili Vanduulové. Poslední desetiletí se díky armádě vzpamatovává."
"VENDETTA": "Vanduulská soustava. Údaje utajila armáda UEE."
"VERITAS": "Vanduulská soustava. Údaje utajila armáda UEE."
"VERMILION": "Vanduulská soustava. Údaje utajila armáda UEE."
"VESPER": "Vanduulská soustava. Údaje utajila armáda UEE."
"VIKING": "Vanduulská soustava. Údaje utajila armáda UEE."
"VIRGIL": "Kdysi chlouba expanze díky rychle terraformovanému Virgilu I. Po pádu Tiberu se sem stáhla armáda UEE a pokusila se Vanduuly zastavit – soustava dnes patří Vanduulům."
"VIRGO": "Vanduulská soustava. Údaje utajila armáda UEE."
"VIRTUS": "La'uo (dříve Virtus) s rudým obrem uprostřed UEE ráda přenechala Xi’anům. Proslula „povoleným pirátstvím“ – vybrané gangy tu smějí za podmínek působit."
"VOLT": "Vanduulská soustava. Údaje utajila armáda UEE."
"VOODOO": "Vanduulská soustava. Údaje utajila armáda UEE."
"VULTURE": "Vanduulská soustava. Údaje utajila armáda UEE."
"YULIN": "Oblíbený cíl dovolených Banu i lidí – zábavní ráj s nabídkou neřestí, ale i obchodu."
