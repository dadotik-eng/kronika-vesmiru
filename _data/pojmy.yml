  vysvetleni: "Nepřátelská rasa bez ústřední vlády, rozdělená do samostatných klanů, které přepadají osady. Lidé je poznali roku 2681 a každé setkání od té doby stálo mnoho životů."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/VpGPp92gdO-vanduul

- termin: "Kingship"
  tvary: [Kingship, Kingshipu, Kingshipem, Kingshipy, Kingshipů]
  vysvetleni: "Vojenské označení největších vanduulských lodí, vlajkových lodí mocných klanů. Jeden trup spojuje bitevní loď, nosič, velitelské centrum i výsadkový transport."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/V3qWn9Dlvm-vanduul-kingship

# --- Armáda ---
