  vysvetleni: "První mimozemská civilizace, se kterou se lidé setkali (2438). Snesou mnoho různých atmosfér a nevedou historické záznamy, takže jejich domovský svět nikdo nezná. Obchodují se všemi."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/0NwpYPpNZ4-banu

- termin: "Banuský protektorát"
  tvary: [Banuský protektorát, Banuského protektorátu, Banuskému protektorátu, Banuským protektorátem]
  vysvetleni: "Volné spojenectví banuských planet, měst a flotil. Společné záležitosti řeší Rada protektorátu složená ze stovek Banu."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/Vgg795z2a3-banu-protectorate

- termin: "Xi’ani"
