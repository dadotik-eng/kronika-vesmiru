  vysvetleni: "Obří knihovna a archivní stanice v soustavě Tayac s věděním všech známých civilizací. Navrhl ji Marshall Leon v roce 2794, dokončena byla roku 2800."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/0qnNMX5lAk-the-ark

- termin: "Synthworld"
  tvary: [Synthworld, Synthworldu, Synthworldem, Projekt Archangel, projekt Archangel, projektu Archangel, projektem Archangel]
  vysvetleni: "Nedokončená umělá planeta v soustavě Chronos, oficiálně projekt Archangel. Ohlásil ji imperátor Corbyn Salehi roku 2872 jako náhradu za ničivou terraformaci."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/bZkyrEPLra-synthworld-chronos-iii

# --- Cizí civilizace ---
