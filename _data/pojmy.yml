  zdroj: https://robertsspaceindustries.com/galactapedia/article/VyvYkAr7YW-nick-croshaw

- termin: "terraformace"
  tvary: [terraformace, terraformaci, terraformací, Terraformace, terraformační, terraformačního, terraformačními, terraformačním, terraformovat, terraformovali, terraformována]
