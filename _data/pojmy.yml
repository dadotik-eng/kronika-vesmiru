  vysvetleni: "Místo v prostoru, kde začíná průchozí tunel do jiné, často vzdálené soustavy. Pouhým okem je téměř neviditelný; známé body hlídají a označují velké stavby."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/0rqzJPaMpY-jump-point

- termin: "skokový tunel"
  tvary: [skokový tunel, skokového tunelu, skokovým tunelem, skokové tunely]
  vysvetleni: "Přirozená průchozí červí díra, kterou lodě za krátkou dobu urazí vzdálenost, na niž by kvantovým letem potřebovaly roky. Může se bez varování zhroutit."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/bBp6Bx33wm-jump-tunnel

- termin: "skokový pohon"
  tvary: [skokový pohon, skokového pohonu, skokovým pohonem, skokové pohony, Skokové pohony, skokových pohonů]
  vysvetleni: "Kvantový pohon doplněný skokovým modulem, se kterým loď dokáže proletět skokovým tunelem do jiné soustavy."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/RX3DOkJdxJ-quantum-drive

- termin: "navjumper"
  tvary: [navjumper, Navjumper, navjumpeři, navjumpera, navjumperem, Navjumperem, navjumpery, navjumperů, navjumperům, navjumperka, Navjumperka, navjumperky, navjumperkou]
  vysvetleni: "Pilot, který hledá a mapuje nové skokové body. Navázal na první „jumpery“, kteří lodě skoky zpočátku za tučnou odměnu převáděli ručně."
  zdroj: https://robertsspaceindustries.com/en/comm-link/spectrum-dispatch/15019-Galactic-Guide-Croshaw-System

