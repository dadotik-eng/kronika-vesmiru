  vysvetleni: "89. logistická letka, která roku 2884 dva dny bez posil bránila Caliban před Vanduuly a umožnila útěk milionům civilistů. Přežil jediný nejmenovaný pilot."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/0Gz5BNmPqo-squadron-89

# --- Místa současnosti ---
