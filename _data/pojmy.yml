  vysvetleni: "Vesmírná civilizace z planety RyiXy’an, terraformující už tisíce let. Od prvního kontaktu v roce 2530 s nimi lidé vedli více než dvě a půl století studenou válku."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/ReJwN9KJEj-xian

- termin: "Kr.ē"
  tvary: [rod Kr.ē, rodu Kr.ē, císař Kr.ē, císaře Kr.ē, Kr.ē]
  vysvetleni: "Současný xi’anský císařský rod. Císař Kr.ē vládne od roku 2643 a se senátorem Terrencem Akarim připravil první dohodu o konci studené války."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/VaZwmlmPQo-emperor-kree

- termin: "Perryho linie"
