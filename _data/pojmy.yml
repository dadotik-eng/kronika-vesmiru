# Slovníček pojmů. Web podtrhne výskyty tvarů z pole `tvary` a po najetí ukáže `vysvetleni`.
# Zdroj: Galactapedie (primárně) a Comm-Linky z archivu H:\Kronika, stav 10. 11. 2026.
# Tvary jsou záměrně delší a konkrétní, aby nevznikaly falešné shody.

# --- Státy a instituce lidstva ---
- termin: "UEE"
  tvary: [UEE, Spojené impérium Země, Spojeného impéria Země, Spojenému impériu Země, Spojeném impériu Země, Spojeným impériem Země]
  vysvetleni: "Spojené impérium Země, současný stát lidstva od roku 2546. V čele stojí volený imperátor, vedle něj Tribunál a Senát složený ze zástupců planet."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/VyvyKxy4v6-united-empire-of-earth

- termin: "UNE"
  tvary: [UNE, Spojené národy Země, Spojených národů Země, Spojeným národům Země, Spojenými národy Země]
  vysvetleni: "Spojené národy Země, první společná vláda lidstva založená v roce 2380. Vedla první velkou vlnu terraformace a v roce 2523 se pokojně proměnila v UPE."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/R4ZQpY83oO-united-nations-of-earth

- termin: "UPE"
  tvary: [UPE, Spojené planety Země, Spojených planet Země, Spojeným planetám Země, Spojenými planetami Země]
  vysvetleni: "Spojené planety Země, vláda lidstva v letech 2523–2546. Řídil ji tříčlenný Tribunál se Senátem; zanikla, když Ivar Messer převzal moc jako První občan."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/0QxBjKP2PN-united-planets-of-earth

- termin: "Senát"
  tvary: [Senát, Senátu, Senátem]
  vysvetleni: "Zákonodárný sbor tvořený volenými senátory z jednotlivých planet. Schvaluje zákony i rozpočet a od roku 2380 je nejstarší nepřetržitě fungující součástí lidské vlády."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/VaZn8OqaNZ-senate

- termin: "Tribunál"
  tvary: [Tribunál, Tribunálu, Tribunálem, tři tribuni, tří tribunů, třemi tribuny, tři tribuny]
  vysvetleni: "Výkonný orgán vlády, v němž si moc dělí správa infrastruktury, armády a práva. Vznikl s UPE, Ivar Messer ho zrušil a Erin Toi roku 2792 obnovila."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/bZwq5Nr5EL-tribunal

- termin: "imperátor"
  tvary: [imperátor, imperátora, imperátorem, imperátorovi, imperátoři, imperátorů, Imperátor, imperátorka, imperátorky, imperátorku, imperátorkou, Imperátorka]
  vysvetleni: "Nejvyšší úřad UEE. Vytvořil ho Ivar Messer počátkem roku 2547 a za Messerů se dědil; dnes imperátora volí občané na jediné desetileté období."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/0Gz5BoJ9wl-uee-imperator

- termin: "První občan"
  tvary: [První občan, první občan, Prvního občana, prvního občana, Prvním občanem, prvním občanem]
  vysvetleni: "Úřad jediného vládce, který si v roce 2546 prosadil Ivar Messer po sérii bombových útoků. Občané kvůli němu rozpustili Tribunál a 15. prosince Messera zvolili."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/V7gM82vNmr-prime-citizen

- termin: "Advokacie"
  tvary: [Advokacie, Advokacii, Advokacií]
  vysvetleni: "Meziplanetární policie UEE založená roku 2523. Stojí nad místními policejními složkami a její agenti stíhají zločiny napříč soustavami."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/VDoP5pmODk-advocacy

- termin: "Ekvivalence"
  tvary: [Ekvivalence, Ekvivalenci, Ekvivalencí]
  vysvetleni: "Osvědčení o dokončeném středoškolském vzdělání v UEE. Bez něj nelze studovat dál, vstoupit do armády ani získat plné občanství."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/Vgg7YGdQDY-equivalency

- termin: "Spectrum"
  tvary: [Spectrum, Spectra, Spectru, Spectrem]
  vysvetleni: "Mezihvězdná komunikační a mediální síť, která propojuje celé UEE. Slouží k osobním zprávám i k vysílání zpráv, sportu a pořadů."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/VaZwen9E2Q-spectrum

# --- Éra Messerů a její konec ---
- termin: "Messerové"
  tvary: [Messerové, Messerů, Messerům, rod Messerů, Rod Messerů, éra Messerů, éry Messerů, éře Messerů, érou Messerů]
  vysvetleni: "Dynastie, která v letech 2546–2792 absolutisticky vládla UEE. Začala Ivarem Messerem a s každým dalším vládcem byla krutější, válečnější a zkorumpovanější."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/V8gJ6ZwGqo-messer-era

- termin: "protimesserovská revoluce"
  tvary: [protimesserovská revoluce, protimesserovské revoluce, protimesserovskou revoluci, protimesserovské hnutí, protimesserovského hnutí, protimesserovské, protimesserovskou, protimesserovského]
  vysvetleni: "Desítky let sílící odpor, který vyvrcholil roku 2792 smrtí Lintona Messera XI. a koncem dynastie. Rozhodující roli sehrál záznam masakru na Garronu II."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/bE3rKa32P7-anti-messer-revolution

- termin: "Tide"
  tvary: [skupina Tide, skupiny Tide, skupině Tide, skupinou Tide, hnutí Tide, Tide]
  vysvetleni: "Odbojové hnutí proti Messerům s buňkami na většině lidských planet. Pustilo do Spectra záznam masakru na Garronu II, a tím rozpoutalo revoluci."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/RXlXOpwG6k-tide

- termin: "Garron II"
  tvary: [Garron II, Garronu II]
  vysvetleni: "Planeta, jejíž práva na terraformaci prodal roku 2792 Linton Messer XI. Při přestavbě vyhynul druh, o jehož vnímavosti věděl. Odhalení masakru ukončilo éru Messerů."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/01dWeqnMr1-massacre-of-garron-ii

- termin: "Fair Chance"
  tvary: [zákon Fair Chance, zákona Fair Chance, zákonu Fair Chance, zákonem Fair Chance, Fair Chance]
  vysvetleni: "Zákon z roku 2795, přijatý po masakru na Garronu II. Soustavy s vnímavým nebo možná vnímavým životem chrání před kontaktem, terraformací i těžbou."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/RXlXmnaYGP-fair-chance-act

- termin: "zákon o historické pravdě"
  tvary: [zákon o historické pravdě, Zákon o historické pravdě, zákona o historické pravdě, zákonem o historické pravdě, zákonu o historické pravdě]
  vysvetleni: "Zákon Senátu z roku 2941, který odtajnil tisíce dokumentů z éry Messerů. Odhalil vojenské záznamy, tajné projekty i osudy lidí, kteří záhadně zmizeli."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/0OaB8KmBKq-historical-truth-act-of-2941

# --- Cestování a technologie ---
- termin: "kvantový pohon"
  tvary: [kvantový pohon, kvantového pohonu, kvantovému pohonu, kvantovým pohonem, kvantové pohony, kvantových pohonů, kvantovým skokem]
  vysvetleni: "Motor, který vytváří takzvané Chan-Eisenovo pole a dnes lodím umožňuje letět zhruba pětinou rychlosti světla. První lidský prototyp z roku 2075 dosáhl setiny."
