  vysvetleni: "Osm pohraničních soustav mezi lidmi a Xi’any, které armáda od roku 2542 držela jako uzavřené vojenské pásmo. Pakt o Perryho linii je roku 2793 spravedlivě rozdělil."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/V8gJQMY9mO-perry-line

- termin: "studená válka"
  tvary: [studená válka, studené války, studené válce, studenou válku, studenou válkou]
  vysvetleni: "Napětí mezi lidmi a Xi’any v letech 2530–2793. K velkým bitvám nedošlo, pohraniční soustavy se však proměnily ve vojenská pásma."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/RXlLjDewkZ-xian-human-cold-war

- termin: "Tevarinové"
  tvary: [Tevarinové, Tevarinů, Tevarinům, Tevariny, Tevarinech, Tevarin, Tevarinem, Tevarinka, Tevarinku, Tevarinkou, tevarinský, tevarinská, tevarinské, tevarinského, tevarinskou, tevarinským, Tevarinský, Tevarinská, Tevarinské]
  vysvetleni: "Válečnický národ z planety Kaleeth, řídící se kodexem Rijora. Po prohrané válce v letech 2541–2546 přišli o domov; část splynula s lidskou společností, ostatní se rozptýlili."
  zdroj: https://robertsspaceindustries.com/galactapedia/article/V8gJv3nB3X-tevarin

- termin: "Kaleeth"
