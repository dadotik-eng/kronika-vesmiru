# Korporace, svátky a příběhy (původně z nedělní Ukázky v archivu).
korporace:
  nazev: Korporace a firmy
  uvod: Firmy, které postavily lodě, koupily planety a občas i dějiny.
  polozky:
  - id: rsi
    nazev: Roberts Space Industries
    stitek: Výrobce lodí
    text: Firma, která otevřela lidem vesmír. Stojí za prvním soběstačným kvantovým pohonem z roku 2075, za patentem na terraformaci i za lodí Zeus, první kosmickou lodí v běžném prodeji.
    kapitoly:
    - 1
    - 2
    prehrat: null
    pripravuje_se: false
  - id: aegis
    nazev: Aegis Dynamics
    stitek: 2532 · Výrobce lodí
    text: Vznikla sloučením firem Aegis Macrocomputing a Dynamic Production Systems, aby stavěla lodě pro námořnictvo. Oblíbil si ji Ivar Messer a její lodě se staly symbolem režimu. Po roce 2792 přišla o většinu vojenských zakázek a její jméno bylo nadlouho poskvrněné. Dnes vyrábí vojenské i civilní lodě.
    kapitoly:
    - 5
    - 6
    - 8
    prehrat: null
    pripravuje_se: false
  - id: origin
    nazev: Origin Jumpworks
    stitek: 2747 · Luxusní lodě
    text: Výrobce luxusních lodí, založený v Kolíně nad Rýnem. V roce 2913 přesídlil do města New Austin na planetě Terra. Model M50 z roku 2920 se proslavil tím, že je to v podstatě motor s kokpitem.
    kapitoly: []
    prehrat: null
    pripravuje_se: false
  - id: anvil
    nazev: Anvil Aerospace
    stitek: 2772 · Výrobce lodí
    text: Založil ji konstruktér J. Harris Arnold, který trval na tom, že osobně schválí každý podsystém. Když se po pádu Messerů odvrátilo námořnictvo od Aegis, začalo zadávat zakázky přímo Anvilu.
    kapitoly:
    - 8
    prehrat: null
    pripravuje_se: false
  - id: misc
    nazev: MISC
    stitek: 2805 · Průmyslové lodě
    text: Vznikla spojením krachující firmy Hato Electronics a designérského studia Musashi. V roce 2910 uzavřela s Xi’any tajnou dohodu o sdílení technologií, jejíž podrobnosti zůstávají obchodním tajemstvím.
    kapitoly: []
    prehrat: null
    pripravuje_se: false
  - id: drake
    nazev: Drake Interplanetary
    stitek: 2845 · Levné lodě
    text: Když návrh konstruktérky Jan Dredge prohrál soutěž o levnou stíhačku pro impérium, firma začala loď Cutlass prodávat civilistům. Firma tvrdí, že je legitimní, ale její lodě se staly oblíbeným nástrojem pirátů. Dredge odešla z čela firmy v roce 2947 po skandálu kolem svých výroků.
    kapitoly: []
    prehrat: null
    pripravuje_se: false
  - id: tarsus
    nazev: Tarsus
    stitek: 2292 · Skokové pohony
    text: Dva mechanici z malé čerpací stanice přišli na to, že drahý skokový pohon je jen vylepšená úprava běžného kvantového pohonu. Jejich levné zařízení zpřístupnilo hvězdy každému majiteli lodi.
    kapitoly:
    - 2
    prehrat: null
    pripravuje_se: false
  - id: hurston
    nazev: Hurston Dynamics
    stitek: Vlastník planety Hurston
    text: Rodinná zbrojařská firma koupila planetu Stanton I a hned na ní rozjela těžbu ve velkém. Podle oficiálního průvodce svůj svět vyždímala do poslední kapky.
    kapitoly:
    - 9
    prehrat: null
    pripravuje_se: false
  - id: crusader
    nazev: Crusader Industries
    stitek: Vlastník planety Crusader
    text: Získala plynného obra Stanton II a jeho nedostavěné loděnice, ve kterých staví velké osobní lodě. Lodě zavěšené v atmosféře uprostřed osvětlené sítě konstrukcí vypadají až přízračně krásně.
    kapitoly:
    - 9
    prehrat: null
    pripravuje_se: false
  - id: arccorp
    nazev: ArcCorp
    stitek: Vlastník planety ArcCorp
    text: Její planeta Stanton III je téměř celá zastavěná a je to nejvíc umělý ze čtyř světů soustavy. Odborníci na Xi’any ji přirovnávají k jejich továrním planetám.
    kapitoly:
    - 9
    prehrat: null
    pripravuje_se: false
  - id: microtech
    nazev: microTech
    stitek: Vlastník planety microTech
    text: Elektronická společnost koupila mrazivou planetu Stanton IV a její chladné klima využívá ke chlazení svých rozsáhlých sítí.
    kapitoly:
    - 9
    prehrat: null
    pripravuje_se: false
svatky:
  nazev: Svátky a kultura
  uvod: Čím žijí lidé i Banu, když zrovna neválčí.
  polozky:
  - id: red
    nazev: Red Festival
    stitek: Konec ledna až začátek února
    text: Po celém impériu se každoročně schovávají miliony zlatě zdobených červených obálek. Tradici převzali i Banu a schovávají obálky na počest Cassy, patrona štěstí.
    kapitoly: []
    prehrat: null
    pripravuje_se: false
  - id: coramor
    nazev: Coramor
    stitek: 11. února
    text: Svátek lásky připomíná rok 2486, kdy Yuri Ilyin zmizel při pokusu dostat se zpět ke své milé Corazon Tan. Název i růžovočerné barvy pochází ze slavného filmu. Je to jeden z nejrušnějších cestovních dnů v impériu a někteří lidé toho dne posílají zprávy těm, které ztratili.
    kapitoly: []
    prehrat: null
    pripravuje_se: false
  - id: fortuna
    nazev: Stella Fortuna
    stitek: 15. března
    text: Začala jako oslava rané kolonie na Marsu. Název vybrali ze soutěžního návrhu jedenáctileté školačky Estelle Priya z Port Renatus. Dnes je to svátek štěstí a odvahy pokoušet osud, v barvách zlaté a zelené, a oblíbený den pro uzavírání obchodů.
    kapitoly:
    - 1
    prehrat: null
    pripravuje_se: false
  - id: kontakt
    nazev: Den prvního kontaktu
    stitek: 12. června
    text: Každoroční připomínka setkání s Banu v soustavě Davien 12. června 2438, kdy se lidé poprvé potkali s mimozemskou civilizací.
    kapitoly:
    - 3
    prehrat: null
    pripravuje_se: false
  - id: foundation
    nazev: Foundation Festival
    stitek: Červenec
    text: Občanský program, který po celý měsíc povzbuzuje lidi, aby se zapojili jako dobrovolníci v místních i celoimperiálních organizacích.
    kapitoly: []
    prehrat: null
    pripravuje_se: false
  - id: luminalia
    nazev: Luminalia
    stitek: 22. prosince
    text: Banuský Festival záře, při kterém hoří obřadní lampy asi dva standardní dny. Lidé se k němu přidali krátce po prvním kontaktu na planetě Cestulus, když je pozvala banuská opravna lodí. Impérium svátek uznalo v roce 2557. Červenou a zelenou mu přidala až úspěšná reklama.
    kapitoly:
    - 3
    prehrat: null
    pripravuje_se: false
pribehy:
  nazev: Příběhy
  uvod: Krátké dramatizace skutečných událostí z historie vesmíru.
  polozky:
  - id: letka
    nazev: Ztracená letka
    stitek: Hotová dramatizace · 2884
    text: Poslední dva dny pilotů, kteří kryli útěk milionů lidí z Calibanu.
    kapitoly:
    - 9
    prehrat: letka
    cist: /pribehy/ztracena-letka/
    pripravuje_se: false
  - id: fabela
    nazev: Lež z Fabely
    stitek: Připravuje se
    text: Paul Barlow se stal slavným hrdinou námořní pěchoty díky obraně osady Fabela. Po pádu Calibanu se přiznal, že svůj příběh pod tlakem nadřízených lhal. Skutečným hrdinou podle něj byl bývalý horník Ignacio Assaf.
    kapitoly: []
    prehrat: null
    pripravuje_se: true
  - id: lorris
    nazev: Uprchlice a maršál
    stitek: Připravuje se
    text: Adelaide Lorris v roce 2438 na útěku před maršálem Cathcartem objevila novou soustavu a schovávala se v ní. Pojmenovala ji po svém pronásledovateli. V roce 2464 ji Cathcart zastřelil.
    kapitoly:
    - 3
    prehrat: null
    pripravuje_se: true
  - id: kellar
    nazev: Kellarův útěk
    stitek: Připravuje se
    text: V květnu 2931 se honička za zločincem Deanem Kellarem rozšířila do pěti soustav a zapojilo se do ní přes tři desítky lidí z obou stran zákona. Veřejnost ji sledovala ještě celá desetiletí.
    kapitoly: []
    prehrat: null
    pripravuje_se: true
  - id: kieren
    nazev: Zmizení guvernéra
    stitek: Připravuje se
    text: Guvernér Assan Kieren v roce 2638 navrhl odtržení Terry od impéria. Státní propaganda ho zničila a brzy nato beze stopy zmizel.
    kapitoly:
    - 6
    prehrat: null
    pripravuje_se: true
