# Vygenerováno nástrojem nastroje/texty_z_archivu.py ze scén v archiv/index.html – needitovat ručně.
prolog:
  nazev: Prolog
  podtitul: Archivář
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: Dvě a půl století se dějiny psaly na rozkaz.
  - kdo: ARCHIVÁŘ
    text: Messerové je přepisovali. Korporace si je kupovaly. Vanduulové je pálili.
  - kdo: ARCHIVÁŘ
    text: Pak v roce 2941 přišel zákon o historické pravdě a tisíce tajných spisů vyšly na světlo.
  - kdo: ARCHIVÁŘ
    text: Jsem archivář. Mým úkolem je říct vám, co se skutečně stalo.
  - kdo: ARCHIVÁŘ
    text: Čeká nás osm set osmdesát jedna let. Od prvního kvantového pohonu až po válku, která trvá dodnes.
  - kdo: ARCHIVÁŘ
    text: Uslyšíte o světech, které jsme stvořili, i o těch, které jsme zničili. O letce, z níž přežil jediný pilot, a o imperátorovi, kterého svrhla pravda, již se snažil utajit.
  - kdo: ARCHIVÁŘ
    text: Archiv je plný cizích hlasů, vysílání a zapomenutých jmen. Kudy půjdete, je na vás.
kap-1:
  nazev: I. Hvězdy na dosah
  podtitul: 2075–2157
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: 'Ráno 3. května 2075 začalo jako každé jiné. Malá Rebecca seděla u jídelního stolu a kreslila si, zatímco její matka sledovala ranní zprávy. Pak na hologramu uviděla tátu. Stál vedle prezidenta, měl nový plnovous a mluvil o vesmíru. Dlouho ho neviděli. Kdykoli odcházel do práce, ptala se ho, proč musí pořád pracovat. A on jí vždycky odpověděl stejně: snaží se jí dát hvězdy. Ta slova si zapsala do deníku. Toho rána se začala plnit.'
  - kdo: ARCHIVÁŘ
    text: Jejím otcem byl doktor Scott Childress, hlavní inženýr společnosti Roberts Space Industries. Firmu založil v roce 2038 vynálezce Chris Roberts. Slovo vesmír v jejím názvu bylo dlouho jen přáním. Prvním výrobkem byl úsporný měnič baterií pro auta, pak přišly čističky vody a dokonce chov cvrčků. V roce 2061 narazil Roberts na disertaci čerstvého absolventa o dostupnějších motorech pro kosmické lodě. Probudila v něm dávný sen a jejího autora Scotta Childresse hned přijal. Čtrnáct let nato dokončil se svým týmem první soběstačný kvantový pohon. Loď s ním dosáhla setiny rychlosti světla. Sluneční soustava se najednou zmenšila a lidstvo ji poprvé mohlo prozkoumávat takovou rychlostí. Jenže hvězdy, které Scott sliboval své dceři, zatím patřily jen vládám, armádě, velkým korporacím a nejbohatším.
  - kdo: ARCHIVÁŘ
    text: 'Další velký krok přišel o necelých čtyřicet let později. V dubnu 2113 představila RSI stroj, který dokázal přeměnit atmosféru planety tak, aby se v ní dalo dýchat. Terraformace. Věc, kterou lidé do té doby znali jen z vědecké fantastiky. Pro Chrise Robertse to byla celoživotní posedlost. Průlomu se ale nedožil, zemřel o pět let dřív. Svět jásal. Ale ne všichni. Novinář Hannigan Terrell tehdy v listu United Times napsal, že když něco dokážeme, ještě to neznamená, že to musíme udělat. Lidé podle něj nejsou bohové a přetvářet samotný vzduch celé planety je arogantní a nebezpečné. Svůj sloupek zakončil slibem: Nic dobrého z toho nevzejde.'
  - kdo: ARCHIVÁŘ
    text: Lidstvo přesto pokračovalo. Mělo pro to vážný důvod. Země se dusila přelidněním. Docházelo jídlo, voda i energie a kvůli nim propukaly války. Chráněné přírodní divy padly pod buldozery, aby uvolnily místo osadám a polím, a vymíraly celé druhy zvířat i rostlin. Lidé potřebovali nový domov a nejbližším kandidátem byl Mars. V roce 2120 spojily vlády světa své znalosti i peníze a pustily se do první přeměny celé planety. Na povrch odletěly týmy průzkumníků. Mapovaly terén, vybíraly místa pro atmosférické procesory a zkoumaly vzorky půdy, aby nic neohrozilo nový vzduch. Byla to první opravdu důkladná výprava na naši nejbližší planetu a vlády nechtěly nic ponechat náhodě.
  - kdo: ARCHIVÁŘ
    text: 'V září roku 2125 byl Mars v závěrečné fázi přeměny. Už dva týdny tam existovalo prostředí, ve kterém se dalo dýchat. Vědci systém ještě prověřovali, ale od oficiálního prohlášení, že je planeta bezpečná, je dělily jen dva dny. Lidé na povrchu proto pracovali bez dýchacích přístrojů. Porušovali tím předpisy, ale nic nenasvědčovalo tomu, že by vzduch nebyl stabilní. 13. září 2125, ve 4.38 ráno, se atmosféra zhroutila. Stalo se to tak rychle, že nikdo nestihl spustit poplach ani utěsnit ventilaci základen. Nový vzduch se rozplynul a 4 876 lidí se udusilo. Úředník, který nechtěl být jmenován, to novinářům shrnul jedinou větou: Atmosféra nevydržela. Podle prvních zpráv šlo o chemickou chybu v atmosférických procesorech.'
  - kdo: ARCHIVÁŘ
    text: Prezidentka zmínila možnost mezinárodní komise a mrtvé nazvala hrdiny Marsu, kteří zemřeli, když posouvali lidstvo vpřed. Tragédie ale znovu rozdmýchala staré spory o to, zda má terraformace vůbec smysl. Otázka, kterou Hannigan Terrell položil o dvanáct let dřív, najednou nezněla jako přehnaná opatrnost. Vlna veřejného odporu zastavila vývoj terraformace na dvacet let. Celá pravda přitom vyšla najevo až mnohem později. Teprve po zhruba deseti letech novinářského pátrání vláda připustila, že na tragédii mohla mít podíl porucha umělé inteligence, která terraformaci řídila. To už ale nikoho nezajímalo. Byl to jeden z omylů, které lidstvo postupně odradily od myslících strojů.
  - kdo: ARCHIVÁŘ
    text: Mezitím rostl zájem o kvantový pohon pro obyčejné lidi. Ve třicátých letech postavila RSI prototyp první lodi pro běžné zákazníky. Jmenovala se Zeus. Zkušební lety ale odhalovaly problémy s pevností trupu. 23. června 2136 se jeden z letů vysílal živě do celého světa. Když loď opouštěla zemskou atmosféru, trup se roztrhl. Zeus se rozpadl a zkušební pilot zahynul. Jedenáct let po Marsu lidé znovu viděli, jakou cenu má pokrok, a nadšení z levného létání vystřídal strach. Zoufalá RSI se obrátila na námořnictvo a na pilotku Michelle Saleno, prvního člověka, který s kvantovým pohonem doletěl za oběžnou dráhu Jupiteru. Přesvědčila námořnictvo, aby založilo 999. zkušební letku pro testování nejmodernějších lodí, a ta pomohla Zeus vyladit. Saleno a její piloti pak celý rok trvali na změnách. Dokud RSI trup nepřepracuje, nikdo z nich do lodi nesedne. RSI nakonec trup úplně přestavěla a 19. března 2137 Saleno v nové lodi poprvé vzlétla. V roce 2140 se Zeus dostal na trh jako první loď s kvantovým
      pohonem, kterou si mohl koupit i běžný člověk. Hvězdy už nepatřily jen vládám.
  - kdo: ARCHIVÁŘ
    text: A Mars? Data, která po sobě tragédie zanechala, nakonec pomohla. V polovině padesátých let přišly přísnější bezpečnostní předpisy a přesnější normy pro zpracování atmosféry. V roce 2157, po téměř čtyřiceti letech zkoušek a tragédií, byl Mars oficiálně prohlášen za planetu, na které se dá dýchat.
  - kdo: ARCHIVÁŘ
    text: 'U města Port Renatus pak odhalili pomník obětem. Hlavní řeč pronesl senátor Stephen Nguyen, jehož mladší bratr Sean při tragédii zemřel. Když Stephen kdysi poprvé vyhrál volby, nechal mu Sean vzkaz: Buď statečný, buď sám sebou a všechno bude v pořádku. Senátor nechtěl, aby jména vytesaná do kamene vedla jen k tichému vzpomínání. Měla být výzvou vyrazit do vesmíru. Řeč zakončil bratrovými slovy: Buďte stateční, buďte sami sebou a všechno bude v pořádku.'
  - kdo: ARCHIVÁŘ
    text: Téhož roku se na Marsu narodila Abeni Okon, první člověk, který přišel na svět mimo Zemi. Scott Childress se toho nedožil. Zemřel už v roce 2121. Hvězdy, které sliboval své dceři, však byly konečně na dosah. A na okraji Sluneční soustavy už čekalo něco, co nikdo nedokázal vysvětlit.
kap-2:
  nazev: II. První skok
  podtitul: 2262–2292
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: V předvečer startu kontrolovala kapitánka Lisa Danvers obvodové desky pod komunikačním pultem. Už potřetí. Ze skrytých reproduktorů na můstku se ozval klidný hlas a zeptal se, jestli jí může pomoct. Patřil Janusovi, umělé inteligenci, která měla loď Artemis řídit. Artemis byla splněný sen. První pokus dostat lidi k jiné hvězdě. Skokové body tehdy nikdo neznal. Loď měla k planetě, na které by se snad dalo žít, letět obyčejným kvantovým pohonem přes sto let. Na palubu se přihlásilo přes milion dobrovolníků. Vybrali pět tisíc z nich a ti měli celou cestu prospat ve stázi. Čestným hostem startu byla Abeni Okon, první člověk narozený mimo Zemi. Janus měl za ně bdít. Jeho tvůrkyně Carol Zahir na něm pracovala od roku 2201 a vytvořila nejsložitější umělou inteligenci, jakou lidé do té doby měli. Dokončení se nedožila. Zemřela dva roky předtím. Ráno startu kapitánka odmítla předat Janusovi řízení. Chtěla loď vyvést sama. Artemis odletěla a každý den posílala na Zemi hlášení o svém stavu.
      V roce 2237 hlášení přestala chodit. Bez varování. Spojení se mělo ztratit až o čtrnáct let později. Loď už nikdo nikdy neviděl.
  - kdo: ARCHIVÁŘ
    text: Zprávami se rychle šířila podezření, že loď zničil sám Janus. Žádný důkaz se nenašel. Nedůvěra ale zůstala a je jedním z důvodů, proč lidé od 23. století umělou inteligenci téměř nevyvíjejí. Hvězdy byly pořád příliš daleko.
  - kdo: ARCHIVÁŘ
    text: Ve vlastní soustavě to ale lidem šlo stále lépe. Na okrajích Sluneční soustavy létaly státní, obchodní i soukromé lodě. V srpnu 2262 vezla nákladní loď Goodman s osmičlennou posádkou zásoby na orbitální plošinu u Neptunu. Byl to běžný let. Tři hodiny před cílem ale zasáhl loď úlomek a vyřadil jí motory na pravoboku. Goodman se vymkl z kurzu a několik hodin bezmocně driftoval. Posádce se nakonec podařilo motory opravit natolik, aby se loď sotva plížila. Pak se ozvalo poslední vysílání. Pátrání na poslední známé pozici nenašlo nic. Žádné trosky. Goodman prostě zmizel. Během několika dalších měsíců zmizely na stejném místě a podobným způsobem ještě dvě lodě. Vyšetřovatelé nedokázali zjistit, co se s nimi stalo. Úřady oblast vyhlásily za zakázanou a lidé jí začali říkat Nesův trojúhelník.
  - kdo: ARCHIVÁŘ
    text: 'Jeden muž se ale bát nechtěl. Astrofyzik a pilot Nick Croshaw strávil téměř deset let studiem místa, které pohlcovalo lodě. Byl přesvědčený, že za zmizeními stojí dosud neznámý druh vesmírné anomálie. Postupně přišel na to, jak ji otevřít. Záleželo na rychlosti a úhlu přiblížení a hlavně na záření odhaleného fúzního jádra. Upravil si vlastní kvantový pohon a vydal se tam sám. 10. dubna 2271 vletěl do anomálie a vynořil se v cizí soustavě. Stal se prvním člověkem, který objevil a prolétl skokovým bodem, a prvním, kdo navštívil jinou planetární soustavu. Ta dodnes nese jeho jméno: Croshaw. Jeho příběh se pak vyprávěl ve filmech i v písních a lidé ho znali nazpaměť.'
  - kdo: ARCHIVÁŘ
    text: Lidé teď věděli, jak se dostat ke hvězdám. Nevěděli ale, jak na nich žít. Do soustavy Croshaw se hnaly soukromé i státní společnosti, aby si zabraly její planety. Ani jedna neuspěla. Nikdo nespočítal, kolik bude stát dovážet zásoby přes skokový bod. Státy a firmy se mezitím přely, komu budou patřit půda a nerosty. A skok sám zůstával nebezpečný. Mnoho lidí, kteří do skokového bodu mezi Solem a Croshawem vletěli, se už neobjevilo. Lodě se musely provádět ručně. Tak vznikl nový druh pilotů, jumpeři. Nabízeli se jako jediný spolehlivý způsob, jak se mezi soustavami dostat, a nechávali si za to dobře platit. Odvážlivci si upravovali kvantové pohony po vzoru Croshawa. Říkalo se tomu nick, podle jeho křestního jména. Mezi jumpery kolovaly příběhy o lidech, kteří s nickem odletěli a už se neozvali. Po tuctu takových případů s tím skoro všichni přestali.
  - kdo: ARCHIVÁŘ
    text: Pořádek do toho vnesl až výbor, který jmenoval Světový summit, setkání vůdců Země. Jeho mistrovským tahem byl Freeman Act z roku 2281. Zákon zavedl loterii o půdu a práva na nerosty a prodej jednosměrných letenek na planety, které se teprve přetvářely. Kdo si letenku koupil, měl jistý domov. Zároveň svými penězi platil terraformaci. Prodej šel zpočátku pomalu. Život na jiné planetě si lidé už dovedli představit, ale život v úplně jiné soustavě je děsil. Teprve rozsáhlé kampaně a svědectví z nové soustavy jejich strach rozptýlily. Vznikla celá vrstva lidí, kteří odpočítávali dny, než se stanou prvními mezihvězdnými osadníky.
  - kdo: ARCHIVÁŘ
    text: 'Na scénu se mezitím vrátila RSI. V jejích laboratořích převzali Croshawův výzkum a začali vyrábět stabilní skokové pohony. Byly ale drahé a vzácné. Vlastnily je vlády, univerzity a velké korporace. Pár miliardářů platilo soukromé průzkumníky v naději, že nějaká soustava ponese jejich jméno. Komentátoři si všímali ironie: firma, která kdysi zpřístupnila vesmír, teď hlídala, aby skoky zůstaly výsadou bohatých. Celá generace dětí si hrála na průzkumníky a snila o tom, že jednou pojmenuje novou hvězdu. Z některých vyrostli nadšenci, kteří znali hvězdné mapy zpaměti a hádali se o nejlepší lodě. Říkali si také jumpeři. Skokový pohon si ale skoro nikdo z nich koupit nemohl.'
  - kdo: ARCHIVÁŘ
    text: Dva z nich, Tara Dilione a Alfonsus Carbrino, pracovali jako mechanici na malé čerpací stanici u skokového bodu mezi Croshawem a Solem. Jednou u nich nouzově přistál transport plný cestujících. Selhal mu skokový pohon a majitel si nemohl dovolit letět do servisu RSI u Marsu. Šlo jen o drobnou opravu kabeláže. Oba mechanici si ale vymysleli složitou historku a celý den si pohon prohlíželi kus po kusu. A pochopili. Část, která ohýbala prostor, byla stejná jako v obyčejném kvantovém pohonu. RSI nevynalezla nic převratného. Jen zdokonalila nick. Dvacet sedm měsíců a skoro všechny své peníze pak dali do modulu, který z kvantového pohonu udělal skokový. První verze zabíraly většinu nákladového prostoru. Pojmenovali ho Tarsus podle svých křestních jmen. Prý to bylo to nejbližší dítěti, co kdy budou mít. Urovnali si všechny záležitosti a 7. listopadu 2292, jedenadvacet let po Croshawově skoku, vletěli do skokového bodu. Vynořili se v pořádku. Zpráva se mezi jumpery rozletěla a každý chtěl
      modul pro sebe. Jedna z nich, právnička Selma Tontil, poznala, co to znamená, a přiměla oba vynálezce, aby si modul nechali patentovat. S její pomocí vznikla firma Tarsus. RSI se ji pokusila zažalovat, ale Tontil právo upravovat pohony uhájila. Za půl roku už RSI prodávala vlastní skokový modul. Za zlomek ceny si teď mohl skokový pohon pořídit každý, kdo vlastnil loď. A s každým novým skokem se vracela otázka stará jako lidstvo samo. Jsme tu sami?
kap-3:
  nazev: III. Nejsme sami
  podtitul: 2380–2438
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: Po objevu dalších skokových bodů se vlády Země sešly na světovém summitu. V roce 2380 vyhlásily vznik Spojených národů Země. Poprvé ve své historii začalo lidstvo mluvit jedním hlasem, a to právě včas.
  - kdo: ARCHIVÁŘ
    text: V roce 2438 prohledával navjumper Vernon Tar soustavu Davien, když narazil na neznámou loď. Střet naštěstí nikoho nezabil, ale mohl být začátkem první mezihvězdné války. Armáda mu proto dala jasně najevo, že pokud bude mlčet, zapíše se do dějin jako hrdina.
  - kdo: ARCHIVÁŘ
    text: O dva týdny později se v Davienu objevila delegace Banu. Generál Neal Socolovich s ní několik měsíců lámal jazykovou bariéru a v říjnu téhož roku podepsal první mezihvězdnou dohodu o míru a obchodu.
  - kdo: ARCHIVÁŘ
    text: Ironii celé události lidé odhalili až po letech. Davien vůbec neležel poblíž banuského území. Loď, kterou Tar potkal, patřila uprchlíkovi. Na první setkání s mimozemskou civilizací tak lidstvo narazilo díky někomu, kdo před ní utíkal. Soustava přesto rozkvetla a stala se bránou k východnímu obchodu.
kap-4:
  nazev: IV. Tři pilíře a první trhlina
  podtitul: 2523–2530
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: Lidské kolonie rostly a stará struktura přestávala stačit. V roce 2523 se Spojené národy proměnily ve Spojené planety Země. Každá planeta získala zastoupení v Senátu a výkonnou moc si rozdělili tři tribuni. Moc jednoho člověka měla být navždy minulostí.
  - kdo: ARCHIVÁŘ
    text: Sedm let nato vyslala společnost Gaia Planet Services 276 lidí, aby terraformovali svět považovaný za neobydlený. Neměli povolení a planeta nebyla tak opuštěná, jak si mysleli. Krátce po zahájení prací se odevšad vynořily cizí lodě.
  - kdo: ARCHIVÁŘ
    text: Tým zajali Xi’ani, druhá mimozemská civilizace, se kterou se lidé setkali. Na znamení dobré vůle propustili předáka Charlese Baxtera. Dobrá vůle však dlouho nevydržela.
  - kdo: ARCHIVÁŘ
    text: Začala studená válka, která přetrvala přes dvě a půl století. Nikdo ji nikdy nevyhlásil, přesto si sabotáže, špionáž a tajné operace vyžádaly oběti na obou stranách. Pozdější vládci navíc pochopili, jak užitečný je nepřítel za hranicí. Strach z Xi’anů se stal jedním z nejsilnějších nástrojů moci v lidských dějinách.
kap-5:
  nazev: V. Válka, která stvořila diktátora
  podtitul: 2541–2546
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: V roce 2541 objevili lidští průzkumníci skokový bod do domovské soustavy Tevarinů, válečnické rasy se svým přísným kodexem cti. Konflikt propukl téměř okamžitě. Námořnictvo bránilo přístupové skoky, ale Tevarinové našli jinou cestu a v roce 2542 překvapivě zaútočili na soustavu Idris.
  - kdo: ARCHIVÁŘ
    text: Zlom přišel v roce 2544 v bitvě o Idris IV. Když padl velitel, převzal velení mladý důstojník Ivar Messer a navedl bombardéry nebezpečně blízko vlastním pozicím. Riskantní manévr zvrátil bitvu a možná celou válku. Vláda potřebovala hrdinu a udělala z Messera tvář konfliktu.
  - kdo: ARCHIVÁŘ
    text: V roce 2546 Tevarinové kapitulovali. Messer přivedl jejich zajatého vůdce přímo do sněmovny a lidé šíleli nadšením. Domovský svět poražených, Kaleeth, byl zabrán, osídlen a přejmenován na Elysium IV.
  - kdo: ARCHIVÁŘ
    text: 'Teď přišla Messerova skutečná ofenzíva. Jako vrchní generál prohlásil vládu tří tribunů za přežitek, přiživoval strach z Xi’anů a navrhl jediný úřad s plnou mocí: prvního občana. V prosinci 2546 pro něj občané sami hlasovali a hned jej do funkce zvolili. Z Prvního občana se časem stal imperátor a ze Spojených planet Spojené impérium Země. Tři pilíře padly bez jediného výstřelu.'
kap-6:
  nazev: VI. Dynastie
  podtitul: 2546–2781
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: Rod Messerů vládl lidstvu 246 let. Trůn se dědil z ruky do ruky, propaganda ovládla zpravodajství a každý kritik riskoval, že prostě zmizí. Impérium mezitím dál rostlo a stále nové planety lidé přetvářeli podle sebe.
  - kdo: ARCHIVÁŘ
    text: 'V roce 2603 se z temnoty vynořila přestavěná tevarinská flotila pod velením válečníka Corath’Thala. Přiletěla do soustavy Fora a žádala jediné: vrátit Elysium IV, ztracený domov svého lidu. Imperátor odpověděl rozkazem k totálnímu útoku. Válka trvala sedm let a skončila roku 2610 v soustavě Centauri, kde Corath’Thala porazila legendární letka Squadron 42.'
  - kdo: ARCHIVÁŘ
    text: Ne každý nepřítel přicházel zvenčí. V roce 2638 navrhl guvernér Terry Assan Kieren, aby se soustava od impéria odtrhla. Státní propaganda jej systematicky zničila a Kieren krátce nato zmizel. Prokázat se nikdy nic nepodařilo.
  - kdo: ARCHIVÁŘ
    text: Největší hrozba pro Messery však vyrůstala v jejich vlastním domě. V roce 2781 svrhl Linton Messer svého otce, imperátora Ulyssese, spiknutím, do něhož byla zapojena i jeho sestra Fiona. Ulysses svržení nepřežil. Linton využil revoluční nálady, aby se dostal k moci. Netušil, že to samé hnutí jednou přijde i pro něj.
kap-7:
  nazev: VII. Stín z Orionu
  podtitul: 2681–2736
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: V roce 2681 byla v soustavě Orion vypálena kolonie na planetě Armitage. Útočníci nechtěli jednat ani obchodovat. Vanduulové jsou kočovné klany, jejichž domovský svět nikdo nezná, a po každém nájezdu zmizí zpět do tmy. Imperátorka Illyana Messer ani její nástupci je nebrali jako skutečnou hrozbu.
  - kdo: ARCHIVÁŘ
    text: Omyl se ukázal v únoru 2712. Do Orionu vplula flotila kapitálních lodí a lidé poprvé spatřili Kingship, plavidlo dlouhé přes tři kilometry. Bitva skončila prakticky dřív, než začala. Námořnictvo ustoupilo do soustavy Tiber a Orion nechalo svému osudu. Pozdější imperátor dal soustavu vymazat ze všech nevojenských map.
  - kdo: ARCHIVÁŘ
    text: Armáda se připravila na další úder, ale žádný nepřicházel. Vanduulové zůstali v Orionu přes rok, vytěžili jeho planety a pak se stáhli. Teprve 4. února 2726 se v Tiberu objevila první vanduulská stíhačka. V dubnu 2732 dorazil do soustavy velký klan a začalo obléhání.
  - kdo: ARCHIVÁŘ
    text: Čtyři krvavé roky bojů přinesly lidem většinu toho, co dodnes vědí o vanduulské taktice. V prosinci 2736 přiletěl z Orionu další Kingship a obrana se zhroutila. Přeživší lodě ustoupily do soustavy Virgil v naději, že se Vanduulové opět zastaví u koristi. Tentokrát je následovali.
kap-8:
  nazev: VIII. Příliv
  podtitul: 2789–2793
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: Režim začal praskat ve chvíli, kdy na to nejméně čekal. Senátor Terrence Akari z planety Terra překročil v roce 2789 Perryho linii, zakázanou hranici s Xi’any, a setkal se s xi’anským císařem z rodu Kr.ē. Společně sepsali mírovou smlouvu. 29. května svolal Akari mimořádné zasedání Senátu, zatímco imperátor odpočíval daleko od hlavního města, a nechal o ní okamžitě hlasovat.
  - kdo: ARCHIVÁŘ
    text: Pokud Xi’ani nebyli nepřítelem, co ještě bylo lež? Odpověď přišla v dubnu 2792. Linton Messer prodal práva na terraformaci planety Garron II a její vyvíjející se život, včetně druhu s prokazatelnou vnímavostí, byl vyhuben. Imperátor o tom věděl.
  - kdo: ARCHIVÁŘ
    text: Aktivistická skupina Tide pustila záznam do celé galaktické sítě. Vzpoura se šířila ze světa na svět. 27. dubna zahájily bezpečnostní síly na planetě Vale palbu do demonstrantů a zabily přes 230 lidí. Tím se zhroutil poslední zbytek poslušnosti.
  - kdo: ARCHIVÁŘ
    text: 2. května byl Linton sesazen a revolucionáři ho popravili. Jeho sestra Fiona zmizela beze stopy a éra Messerů skončila. Moc převzala senátorka Erin Toi, obnovila Tribunál a omezila vládu imperátora časovým limitem. V červenci 2793 pak Pakt o Perryho linii oficiálně ukončil studenou válku. Garron II je dnes chráněn zákonem Fair Chance, aby se tamní život mohl vyvíjet bez zásahů lidí.
kap-9:
  nazev: IX. Archa a umělý svět
  podtitul: 2800–2884
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: Po pádu Messerů bylo třeba začít znovu. Marshall Leon, diplomat, který měl opravit vztahy s ostatními rasami, vyhrál volby a roku 2801 se stal imperátorem. Jeho odkazem je Archa, vesmírné úložiště znalostí a kultury všech ras.
  - kdo: ARCHIVÁŘ
    text: 'Dobré úmysly ale stály peníze. V roce 2851 objevila navjumperka Toshi Aaron soustavu Stanton a vláda brzy zjistila, že terraformace tamních planet bude mnohem dražší, než si může dovolit. V roce 2865 přišlo šokující oznámení: všechny planety soustavy se prodají. Hurston Dynamics, Crusader Industries, ArcCorp a microTech dnes vlastní jediné soukromé planety v impériu.'
  - kdo: ARCHIVÁŘ
    text: V roce 2872 ohlásil imperátor Corbyn Salehi plán, který měl terraformaci navždy nahradit. Projekt Archangel měl v soustavě Chronos postavit celou planetu od základů. Dodnes není hotová.
  - kdo: ARCHIVÁŘ
    text: Zatímco se stavěl nový svět, staré se ztrácely. V červenci 2884 proklouzl vanduulský klan vedený Kingshipem kolem senzorů do soustavy Caliban. Jedinou vojenskou jednotkou na místě byla logistická letka číslo 89.
kap-10:
  nazev: X. Válka bez konce
  podtitul: 2945–2956
  poznamka: ''
  odstavce:
  - kdo: ARCHIVÁŘ
    text: Na začátku října 2945 zaútočili Vanduulové na planetu Vega II, dnes zvanou Aremis. Útok zasáhl města New Corvo a Estilia a lidé pochopili, že po více než dvou a půl stoletích šarvátek se už nedá předstírat mír. Admirál Bishop před Senátem řekl to, co se dlouho nikdo neodvážil vyslovit.
  - kdo: ARCHIVÁŘ
    text: Imperátor Kelos Costigan pak požádal o vyhlášení války a Senát ji v listopadu 2945 schválil. Aremis získal na tomtéž zasedání plné uznání jako planeta impéria. Roku 2946 vedl admirál Bishop flotu do operace Mandrake v soustavě Oberon.
  - kdo: ARCHIVÁŘ
    text: Válka změnila i politiku. V roce 2947 oznámilo impérium obchodní iniciativu s Xi’any a tentýž rok se atentátník pokusil Costigana zabít. 1. ledna 2951 složila přísahu imperátorka Laylani Addison, která jmenovala do své vlády první Tevarinku Ki Jotal. Národ, který lidé kdysi porazili a vyhnali z domova, má dnes hlas v kabinetu.
  - kdo: ARCHIVÁŘ
    text: 'Rok 2956 běží souběžně s naším časem a příběh se stále píše. V soustavách Stanton a Pyro dnes létají lidé jako ty: kurýři, horníci, žoldáci i piráti. Vanduulská hrozba nezmizela, korporace nepolevily a Synthworld stojí nedokončený. Poslední stránka této kroniky zůstává prázdná. Je na tobě, co na ni napíšeš.'
letka:
  nazev: Ztracená letka
  podtitul: Dramatizace · 2884
  poznamka: Průběh bitvy vychází z oficiální historie. Rozhovory a některé podrobnosti jsou smyšlené.
  odstavce:
  - kdo: ARCHIVÁŘ
    text: 7. července 2884. 04:43 standardního času.
  - kdo: ARCHIVÁŘ
    text: Varovné senzory celé soustavy mlčí. Dodnes nikdo přesně neví proč.
  - kdo: ARCHIVÁŘ
    text: Poblíž planety Caliban IV letí dva piloti osmdesáté deváté letky. Běžná hlídka.
  - kdo: HLÍDKA JEDNA
    text: Hlídko dva, vidíš to za mnou?
    radio: true
  - kdo: HLÍDKA DVA
    text: Mám jeden kontakt. Ne. Tři. Deset.
    radio: true
  - kdo: HLÍDKA JEDNA
    text: Tohle není nájezd. Vysílám nouzový signál.
    radio: true
  - kdo: HLÍDKA DVA
    text: Velíne Crion, tady hlídka dva, hlásím vanduulský kl…
    radio: true
  - kdo: ARCHIVÁŘ
    text: Ani jedna zpráva nebyla dokončena.
  - kdo: ARCHIVÁŘ
    text: Letka vzlétla, aniž tušila, proti čemu stojí. Čtyři lodě padly dřív, než se objevil hlavní nepřítel.
  - kdo: VELITELKA RANDALLOVÁ
    text: Všem lodím, tady Randallová. Vidím Kingship.
    radio: true
  - kdo: VELITELKA RANDALLOVÁ
    text: Vypusťte komunikační drony. Žádáme o posily.
    radio: true
  - kdo: VELÍN CRION
    text: Velitelko, nejbližší flotila může dorazit až za dva dny.
    radio: true
  - kdo: VELITELKA RANDALLOVÁ
    text: Tak máme dva dny.
    radio: true
  - kdo: VELITELKA RANDALLOVÁ
    text: Přestáváme bránit Crion. Odteď chráníme konvoje. Každá civilní loď, která odstartuje, se dostane ven.
    radio: true
  - kdo: ARCHIVÁŘ
    text: Letka startovala z provizorních ranvejí v okrese Blackwater. Jednotka určená pro logistiku stála proti válečnému klanu.
  - kdo: CIVILNÍ TRANSPORT
    text: Tady civilní transport. Na palubě máme tisíce lidí a žádné zbraně.
    radio: true
  - kdo: PILOT 89. LETKY
    text: Leťte a neohlížejte se.
    radio: true
  - kdo: ARCHIVÁŘ
    text: První den. Druhý den. Letka se zmenšovala a konvoje dál odlétaly.
  - kdo: ARCHIVÁŘ
    text: Velitelka Sylvie Randallová z bitvy nevyvázla. Její poslední rozkaz platil do konce.
  - kdo: ARCHIVÁŘ
    text: Čtyřicet devět hodin po prvním kontaktu dorazila druhá flotila.
  - kdo: DRUHÁ FLOTILA
    text: Tady druhá flotila. Crion hoří. Odpovězte. Je tu někdo živý?
    radio: true
  - kdo: PILOT 89. LETKY
    text: Tady osmdesátá devátá.
    radio: true
  - kdo: DRUHÁ FLOTILA
    text: Kolik vás zbývá?
    radio: true
  - kdo: PILOT 89. LETKY
    text: Jeden.
    radio: true
  - kdo: ARCHIVÁŘ
    text: Přes tři miliony lidí unikly. Podle odhadů více než pět a půl milionu zemřelo.
  - kdo: ARCHIVÁŘ
    text: Roku 2885 námořnictvo letku vyřadilo ze služby. Lidé jí začali říkat Ztracená letka.
  - kdo: ARCHIVÁŘ
    text: Oficiální záznam jméno posledního pilota neuvádí.
