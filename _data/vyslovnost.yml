# Rejstřík výslovnosti Hvězdné kroniky
# ----------------------------------------------------------------------------
# Jak se cizí jména a pojmy čtou česky. Používá se:
#  - v přehrávači: mluvený text (v) kapitol od bota se z psaného textu (t) vytvoří podle tohoto rejstříku,
#  - pro dabing v ElevenLabs: z rejstříku se vyrobí slovník výslovnosti (alias pravidla),
#  - Režisér (agent) podle něj kontroluje texty a nová jména hlásí k doplnění.
#
# Pole:
#   psano: jak se slovo píše (kmen – pravidlo platí i pro skloňované tvary: Vanduul → Vanduulové, vanduulský)
#   cti:   jak se má číst (stejný kmen, koncovky se převezmou z psaného tvaru)
#   cele:  true = nahrazuje se jen celé slovo / sousloví (zkratky, víceslovné názvy)
#   tvary: nepravidelné tvary, kde se mění i kmen (Ulyssese → Julisíze)
#   pozn:  poznámka; „ověřit“ = výslovnost není jistá, potvrdí Daniel
#
# Pořadí nehraje roli – delší výrazy se nahrazují dřív než kratší.
# ----------------------------------------------------------------------------

