# Větev "beta" = ostrý web + návrhy od bota, které čekají na Danielovo schválení.
# Náhled: https://beta.hvezdna-kronika.pages.dev (zamčený přes Cloudflare Access).
#  - po každé změně ostrého webu (main) se main přimíchá do bety, aby beta nezastarala,
#  - ruční spuštění s akcí "zahodit" vrátí betu na stav ostrého webu (zahodí neschválené návrhy).
#  - ruční spuštění s akcí "schvalit" převede betu na formát v2 (nastroje/prevod_v2.py), zkontroluje ji podle pravidel ostrého webu (kapitoly jen overeni: OK)
#    a teprve pak ji sloučí do main; potom spustí Náhledy (push z akce jiné akce sám nespouští).
name: Beta
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      akce:
        description: "obnovit = přimíchat main do bety · zahodit = beta znovu podle main · schvalit = zkontrolovat a sloučit betu do main"
        required: true
        default: obnovit
      popis:
        description: "U schválení: krátký popis, co se schvaluje (do zprávy commitu)"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AKCE="${{ github.event.inputs.akce || 'obnovit' }}"
          if [ "$AKCE" = "schvalit" ]; then
            git checkout -B beta origin/beta
            pip install -q pyyaml
            # Přechodně: co bot zapsal ve starém formátu, se převede na formát v2 (record_key z adres, ID období a soustav)
            python3 nastroje/prevod_v2.py
            if ! git diff --quiet; then
              git commit -qam "Převod na formát záznamů v2 (při schválení)" && git push origin beta
            fi
            if ! python3 nastroje/kontrola.py --ostry; then
              echo "::error::Beta neprošla kontrolou pro ostrý web – nic se neschválilo."
              exit 1
            fi
            git checkout -B main origin/main
            POPIS="${{ github.event.inputs.popis }}"
            git merge --no-edit origin/beta -m "Schváleno Danielem: ${POPIS:-beta → ostrý web}"
            git push origin main
            gh workflow run nahledy.yml --ref main
            echo "Beta schválena a sloučena do main."
            exit 0
          fi
          if [ "$AKCE" = "zahodit" ] || ! git ls-remote --exit-code --heads origin beta >/dev/null; then
            git push --force origin origin/main:refs/heads/beta
            echo "Beta nastavena podle main."
          else
            git checkout -B beta origin/beta
            if git merge --no-edit origin/main -m "Beta: přimíchán ostrý web"; then
              git push origin beta
            else
              echo "::error::Main se nedá přimíchat do bety (konflikt). Návrhy v betě je potřeba schválit nebo zahodit."
              exit 1
            fi
          fi
